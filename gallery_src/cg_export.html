<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Spine 全屏 CG 批量导出</title>
<style>
body{background:#0d1017;color:#dbe2ee;font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;margin:0;padding:24px}
h1{font-size:18px;margin:0 0 6px}
.note{color:#8b96ad;font-size:12px;margin-bottom:14px}
.bar{display:flex;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap}
button{background:#243049;color:#dbe2ee;border:1px solid #3a4a6b;border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px}
button:hover{background:#2e3d5c}
button.primary{background:#2b6cb0;border-color:#3b82c4}
.stat{font-size:13px;color:#9fb0c8}
.stat b{color:#7bd88f}
#log{background:#11151f;border:1px solid #232a3a;border-radius:8px;padding:10px 12px;height:22vh;overflow:auto;font:12px/1.5 Consolas,Consolas,monospace;white-space:pre-wrap}
#sum{font-size:12.5px;color:#9fb0c8;margin:10px 0 6px}
#sum b{color:#dbe2ee}
#tblwrap{max-height:46vh;overflow:auto;border:1px solid #232a3a;border-radius:8px;background:#11151f}
table{border-collapse:collapse;width:100%;font:12px/1.5 Consolas,"Microsoft YaHei",monospace}
th,td{padding:5px 8px;border-bottom:1px solid #1d2432;text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:#151b27;color:#8b96ad;font-weight:600;z-index:1}
td.n{color:#6d7890;text-align:right}
td.d{color:#9fb0c8;font-variant-numeric:tabular-nums}
td.m{white-space:normal;color:#9fb0c8;max-width:460px}
tr.now td{background:#16233a}
td.st{font-weight:600}
.st-wait{color:#6d7890}.st-done{color:#7bd88f}.st-skip{color:#8b96ad}.st-fail{color:#ff7b7b}.st-now{color:#8ab4ff}
.ok{color:#7bd88f}.fail{color:#ff7b7b}.skip{color:#8b96ad}.warn{color:#ffb27b}
canvas{position:fixed;left:-99999px;top:0}
</style>
</head>
<body>
<h1>Spine 全屏 CG 批量导出 <span class="stat" id="head"></span></h1>
<div class="note">渲染每个 Spine 皮肤全部件 setup pose（游戏皮肤详情全屏同款构图）→ PNG 落盘 <b>Output/CG_v2/&lt;皮肤&gt;.png</b>。本地服务器 8777 由控制台重导自动拉起；手动排查时用 <b>_gallery_server.py --export --no-browser</b> 起服务，再自己打开本页。日常重导由无头 Chrome 自动跑，无需在此点「开始导出」。</div>
<div class="bar">
  <button id="btnStart" class="primary">开始导出</button>
  <button id="btnStop">停止</button>
  <label><input type="checkbox" id="chkRedo"> 重做已存在的</label>
  <label>长边 <select id="selSize"><option>1600</option><option selected>2400</option><option>3200</option></select> px</label>
  <span class="stat" id="prog"></span>
</div>
<div id="sum"></div>
<div id="tblwrap"><table>
  <thead><tr><th>#</th><th>皮肤目录</th><th>名称</th><th>状态</th><th>输出尺寸</th><th>场景框</th><th>覆盖率</th><th>耗时</th><th>说明</th></tr></thead>
  <tbody id="tbody"></tbody>
</table></div>
<div id="log"></div>
<canvas id="cv"></canvas>
<script src="./index.js"></script>
<script src="./vendor/spine/spine-all.js"></script>
<script>
const $=s=>document.querySelector(s);
const G=window.GALLERY;
const logEl=$('#log');
function log(msg,cls){const d=document.createElement('div');if(cls)d.className=cls;d.textContent=msg;logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight;}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* ?animFrame=1 → 导出"默认动画第 0 帧"而不是纯 setup pose。
   默认关闭：231 张既有产物是 setup pose 语义，不因为 4 个皮肤就整体改定义。 */
const ANIM_FRAME=new URLSearchParams(location.search).get('animFrame')==='1';
/* ?part=<层名> → **只导出这一层**（逗号分隔可多层）。
   为什么需要：多层 Spine 的层间关系**无法用坐标判据判断** ——
   实测 `tianjinfeng_2` 五层的骨骼顶点框几乎完全相同（都 6008×5785、交叠 100%，
   因为骨骼里有大量远端占位/隐藏骨骼），必须**逐层出图**看每层各自画了什么。
   逐层导出后该皮肤的真相才浮出来：`2B2`=整个房间背景（45° 菱形）、`2M`=**同一个角色
   的第二个姿态**（倒吊在笼子里，绿发红裙）、`2T`=零星粒子、`2B`=空。
   ⚠️ 必须配合 `tag=`：否则诊断图会**覆盖正式产物** `CG_v2/<key>.png`。
   ⚠️ 必须配合 `animFrame=1` 才看得到真实部件 —— setup pose 下附件数是 0
   （附件挂在动画关键帧的 AttachmentTimeline 上，§42/§98）。**注意 setup 与 animFrame
   是两种语义**：同一张 CG 两种模式画出来差别很大（setup 下本例角色几乎不存在），
   拿 animFrame 的验证图去代表 setup 产物是错的（2026-10-04 踩过）。 */
const QS=new URLSearchParams(location.search);
const ONLY_PARTS=(QS.get('part')||'').split(',').map(s=>s.trim()).filter(Boolean);
const OUT_TAG=(QS.get('tag')||'').replace(/[^\w.\-]/g,'_');   // 文件名后缀，防路径注入

// 收集待导出：按 Spine_v2 目录去重
const jobs=[];{const seen=new Set();
  for(const s of (G.ships||[]))for(const sk of (s.skins||[])){
    const sp=sk.spine; if(!sp||!sp.folder)continue;
    if(seen.has(sp.folder))continue; seen.add(sp.folder);
    jobs.push({folder:sp.folder, parts:(sp.parts&&sp.parts.length)?sp.parts:[sp.folder], name:s.name||sp.folder});
  }}
$('#head').textContent=`共 ${jobs.length} 个 Spine 皮肤`;
log(`发现 ${jobs.length} 个 Spine 皮肤目录`);
{const q=new URLSearchParams(location.search);
 const only=q.get('only'); if(only){const set=new Set(only.split(',')); jobs.length=0;
   for(const s of (G.ships||[]))for(const sk of (s.skins||[])){const sp=sk.spine;
     if(sp&&set.has(sp.folder)&&!jobs.some(j=>j.folder===sp.folder))
       jobs.push({folder:sp.folder, parts:(sp.parts&&sp.parts.length)?sp.parts:[sp.folder], name:s.name||sp.folder});}}
 const sz=q.get('size'); if(sz){const o=document.createElement('option');o.textContent=sz;o.selected=true;$('#selSize').appendChild(o);}
 if(q.get('redo')==='1')$('#chkRedo').checked=true;
}

/* ── 结果表：给人看的视图 ──────────────────────────────────────────────
   日志（#log）仍是**唯一真源**：run_cg_export.py 轮询 `#log div:last` 的文本判
   「全部结束 / 已停止」。下面这张表只是同一批结果的另一个视图，
   不得改变日志行的内容、顺序或收尾时机。
   列含义：输出尺寸 = 落盘 PNG 的 W×H；场景框 = 顶点包围盒（未像素二次构图前）；
   覆盖率 = 不透明像素占画布比例（<0.5 会在日志里标 warn）。 */
const tbody=$('#tbody'), rows=[];
for(let i=0;i<jobs.length;i++){
  const tr=document.createElement('tr');
  tr.innerHTML=`<td class="n">${i+1}</td><td>${jobs[i].folder}</td><td>${jobs[i].name||''}</td>`
    +'<td class="st st-wait">等待</td><td class="d">—</td><td class="d">—</td>'
    +'<td class="d">—</td><td class="d">—</td><td class="m"></td>';
  tbody.appendChild(tr); rows.push(tr);
}
const fmtMs=ms=>ms<1000?ms+'ms':(ms/1000).toFixed(1)+'s';
let nowRow=null;
function setSum(done=0,skip=0,fail=0){
  $('#sum').innerHTML=`共 <b>${jobs.length}</b> 个 · 完成 <b>${done}</b> · 跳过 <b>${skip}</b>`
    +` · 失败 <b>${fail}</b> · 等待 <b>${jobs.length-done-skip-fail}</b>`;
}
setSum();
function setRow(i,st,cls,d={}){
  const tr=rows[i]; if(!tr)return;
  const stc=tr.children[3];
  stc.textContent=st; stc.className='st '+cls;
  for(const [k,j] of [['size',4],['scene',5],['frac',6],['ms',7]]){
    if(d[k]!=null)tr.children[j].textContent=d[k];
  }
  if(d.note!=null){const td=tr.children[8];td.textContent=d.note;td.title=d.note;}
  if(nowRow&&nowRow!==tr)nowRow.classList.remove('now');
  nowRow=(cls==='st-now')?tr:null;
  if(nowRow){tr.classList.add('now');try{tr.scrollIntoView({block:'nearest'})}catch(e){}}
}

const cv=$('#cv');
const glctx=new spine.webgl.ManagedWebGLRenderingContext(cv,{alpha:true,premultipliedAlpha:true,preserveDrawingBuffer:true});
const scene=new spine.webgl.SceneRenderer(cv,glctx,false);
const gl=glctx.gl; gl.clearColor(0,0,0,0); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
let running=false, stopFlag=false;

async function loadPart(base,pn,textures,cfg){
  const skelR=await fetch(base+pn+'.skel'); if(!skelR.ok)throw new Error('skel '+pn+' 404');
  const bytes=new Uint8Array(await skelR.arrayBuffer());
  const atlasR=await fetch(base+pn+'.atlas'); if(!atlasR.ok)throw new Error('atlas '+pn+' 404');
  const atlasTxt=await atlasR.text();
  const pageNames=[];for(const ln of atlasTxt.split('\n')){const t=(ln||'').replace(/\r$/,'');if(/^[A-Za-z0-9_].*\.(png|jpg)$/i.test(t)&&!ln.startsWith(' ')&&!ln.startsWith('\t')&&!t.includes(':'))pageNames.push(t);}
  for(const pgn of pageNames){ if(textures[pgn])continue;
    const img=new Image();img.crossOrigin='anonymous';
    await new Promise((rs,rj)=>{img.onload=rs;img.onerror=()=>rj(new Error('tex '+pgn+' 加载失败'));img.src=base+pgn;});
    textures[pgn]=new spine.webgl.GLTexture(glctx,img,false);
  }
  const texLoader=path=>{for(const q in textures){if(q===path||(''+path).endsWith(q)||q.endsWith(''+path))return textures[q];}return textures[pageNames[0]];};
  const atlas=new spine.TextureAtlas(atlasTxt,texLoader);
  const ofind=atlas.findRegion.bind(atlas); atlas.findRegion=n=>{let r=ofind(n);if(r)return r;const t=(''+n).trim();return t!==n?ofind(t):r;};
  const loaderArgs=[new spine.AtlasAttachmentLoader(atlas)];
  let data;
  if(bytes[0]===0x7B){ // JSON 骨架（如 beierfasite_g）
    data=new spine.SkeletonJson(...loaderArgs).readSkeletonData(new TextDecoder().decode(bytes));
  } else {
    data=new spine.SkeletonBinary(...loaderArgs).readSkeletonData(bytes);
  }
  /* 与画廊 Spine 标签同一套 skin 选择逻辑（docs/TROUBLESHOOTING.md §42）：
     spine-ts 3.8 的附件时间线经"当前 skin"解析，不设 skin 时命名 skin 独有的部件整块不画。 */
  const skinNames=(data.skins||[]).map(k=>k.name);
  const coverOf=(sk)=>{ const ever=new Set();
    let an=(data.animations||[]).map(a=>a&&a.name).filter(Boolean).slice(0,6);
    const asd=new spine.AnimationStateData(data);
    for(const n of (an.length?an:[null])){ const t2=new spine.Skeleton(data); const st=new spine.AnimationState(asd);
      try{ if(sk!==null) t2.setSkin(data.findSkin(sk));
        t2.setSlotsToSetupPose(); t2.setBonesToSetupPose();
        if(n) st.setAnimation(0,n,true);
        for(const dt of [0.05,0.5,2.0]){ st.update(dt); st.apply(t2);
          for(const sl of t2.slots) if(sl.getAttachment()) ever.add(sl.data.name); } }catch(e){} }
    return ever.size; };
  let bestSkin=null, bestCov=coverOf(null);
  for(const k of skinNames){ const c=coverOf(k); if(c>bestCov){ bestCov=c; bestSkin=k; } }
  const skeleton=new spine.Skeleton(data);
  if(bestSkin!==null) skeleton.setSkin(data.findSkin(bestSkin));
  skeleton.setSlotsToSetupPose(); skeleton.setBonesToSetupPose();
  /* ⚠️ 光设 skin 还不够：setup pose 的附件取自 slotData.attachmentName，与 skin 无关
     （实测 aluomangshi_2 四种 skin 下都恒为 145 个附件，腿一条都不回来）；
     部件是动画第 0 帧的 AttachmentTimeline 挂上去的（设 skin + 应用后为 201）。
     默认仍导出纯 setup pose（保持 231 张既有语义不变）；`animFrame=1` 才应用默认动画第 0 帧。 */
  if(ANIM_FRAME){ const an=(data.animations||[]).map(a=>a&&a.name).filter(Boolean);
    /* 起始动画按 prefab 逐层写的 startingAnimation 来，不再一律优先 'normal'
       （§58：3 个目录不是 normal —— buleisite / buleisite_hx = idle，pulimaosi 两层各播各的）。 */
    const want=(cfg&&cfg.startingAnimation)||'normal';
    const pick=an.indexOf(want)>=0?want:(an.indexOf('normal')>=0?'normal':an[0]);
    if(pick){ const st=new spine.AnimationState(new spine.AnimationStateData(data));
      st.setAnimation(0,pick,true); st.update(0); st.apply(skeleton); } }
  /* 各层 localScale 照 prefab 写。⚠️ 只有**层间不一致**才真的改变画面（全库 5 个目录），
     整目录统一缩放会被下面的取景归一化吃掉 —— 那是 §58 量出来的，别拿"9 个非单位变换"当影响面。 */
  if(cfg&&cfg.localScale){ skeleton.scaleX=cfg.localScale[0]||1; skeleton.scaleY=cfg.localScale[1]||1; }
  skeleton.updateWorldTransform();
  return {skeleton,data};
}

/* 取景判据与画廊弹窗逐字一致（勿在此处单独改）：
   ① setup alpha=0 的巨幕不参与取景；② **乘完 slot 颜色后没有非近黑落笔**的纯色板也不参与
   （`heimu`/`1heidi` 是黑贴图×白乘数，`yunlong_3` 的 `kkkkk*` 是白贴图×黑乘数，
   只看贴图或只看 alpha 都漏掉一半）。
   下方 `contentBBox()` 的像素二次构图**救不了这一类**：纯黑遮罩是不透明像素，alpha>8 判定
   会把它当成内容（实测 aluomangshi_2 自报"覆盖 0.83"看着健康，图却是一大片黑里嵌一小块舞台）。
   全库判据取证见 docs/TROUBLESHOOTING.md §45/§46。 */
const inkCache=new Map(), inkCv={c:null,ctx:null};

/* 离群槽位剔除（2026-10-04，docs/TROUBLESHOOTING.md §97，用户拍板走这条路）。
   实测样本：`yuanchou_2_hx`（远山 Tintin 和谐版）的槽位 `BG_desk` ——
     · MeshAttachment，4 顶点的矩形，`verticesLen=8 / bonesLen=0` ⇒ **几何完全合法、不是解表错位**
     · 尺寸 3198×5124 **正常**，但局部顶点坐标 **(-294183, 48339368)**、世界坐标 (-29638, 4833859)
     · 同角色另一张桌子 `desk_new` 的顶点是 (-1392, 9978) ⇒ 同类物件，量级差 **1000 倍**
     · 本体 `yuanchou_2` **没有这个槽位**（只有 `BG_desk_paper1/2`）⇒ 和谐版专有
     · 6 个动画（1/2/3/4/5/normal）× 每动画 13 帧实测，位置**一模一样**、从不归位
   用户判断「游戏内显示是正常的」—— 与上述一致：**这份 skel 里存的就是这个离谱坐标，
   游戏另有一套摆位机制**（Unity 侧改 mesh / 额外偏移）。所以正确修法是**取景时把它排除**，
   不是改数据（改了反而与游戏内不一致）。

   ⚠️ 判据为什么不能直接用「离 min/max 最远的那个」：
   **离群点自己会把 min/max 尺度撑大**，拿它当基准就是自证失败（阈值跟着离群值一起放大，
   永远剔不干净）。所以基准取**分位数**——对少数极端离群值不敏感：
     · 中心 = 各槽位中心点的**中位数**
     · 尺度 = 各槽位中心到该中心的距离的 **90 分位**（不是最大值）
     · 剔除条件 = 距离 > 6 × 90分位 **且** 面积 > 30 × 全体中位面积
   两个条件是 **AND**：只「远」不「大」的可能是真实的角色部件（飞出去的道具之类），
   只「大」不「远」的正是 §45/§46 那类该由 inksOf 处理的巨幕。

   ⚠️ 保守边界：`TOTAL` 不足 8 个槽位、或 90 分位距离为 0 时**原样返回**（不判），
   宁可漏剔不可错剔。逐层计日志便于事后核对剔了几个。 */
let dropOutlierLog=[];
function dropOutliers(list){
  try{
    if(!Array.isArray(list)||list.length<8)return list;      // 槽位太少，判不准 → 不动
    // 每条先把「中心 / 距离 / 面积」算好并与 list 同序保存。
    // ⚠️ 距离算完要**降序排一份副本**取 90 分位，但**不能拿排序后的数组按 i 索引** ——
    // 排序打乱了与 list 的对应关系，那样判据会拿别人的距离去剔这个槽位。
    const cen=list.map(e=>[(e.r[0]+e.r[2])/2,(e.r[1]+e.r[3])/2]);
    const areas=list.map(e=>Math.max(1,(e.r[2]-e.r[0])*(e.r[3]-e.r[1])));
    const srt=a=>a.slice().sort((x,y)=>x-y);
    const medArea=srt(areas)[areas.length>>1];
    const medX=srt(cen.map(c=>c[0]))[cen.length>>1];
    const medY=srt(cen.map(c=>c[1]))[cen.length>>1];
    const dist=cen.map(c=>Math.hypot(c[0]-medX,c[1]-medY));
    const p90=srt(dist)[Math.min(dist.length-1,Math.floor(dist.length*0.90))];
    if(!(p90>0))return list;                                 // 全叠在一点 → 不判
    const distLim=p90*6, areaLim=medArea*30;
    const keep=[],kill=[];
    list.forEach((e,i)=>{(dist[i]>distLim&&areas[i]>areaLim?kill:keep).push(e);});
    if(kill.length&&keep.length>=3){
      dropOutlierLog=dropOutlierLog.concat(kill.map(e=>({box:e.r.map(x=>Math.round(x))})));
      return keep;
    }
  }catch(e){ return list; }                                   // 判据自身出错 → 原样，不阻断导出
  return list;
}
function inksOf(a,col){
  // 缺省方向：查不到落笔证据时**假定它落笔**（`return true`）。
  // ⚠️ 2026-10-04 试过改成 `return false`（想剥掉"取不到贴图"的附件），**实测有害**：
  //   `yuanchou_2_hx` 的 `BG_desk` 是**正常的 MeshAttachment**（region 640×1025、
  //   hasPage=true、UV 合法、贴图区有内容），`inksOf` 判 true 是对的 —— 它的问题不在附件，
  //   而在**骨骼变换**：世界坐标 (-29319, 4833859)，把包围盒撑到 30593×4834428
  //   ⇒ CG 渲成 64×2400 细条。把它当"不落笔"剥掉会掩盖真因、且可能误伤真贴图。
  //   ⇒ 判据保持原样；这类"骨骼飞出"要在**上游**（骨骼/动画数据）修，不在取景层糊。
  const reg=a.region; if(!reg||!reg.page)return true;
  const key=reg.page.name+'|'+reg.name+'|'+(reg.index||0)+'|'+col.r+','+col.g+','+col.b+','+col.a;
  const seen=inkCache.get(key); if(seen!==undefined)return seen;
  let hit=true;
  try{const pg=reg.page, img=pg.texture&&pg.texture.getImage?pg.texture.getImage():null;
    let sw=reg.width, sh=reg.height;
    if(reg.degrees===90||reg.rotate){const t=sw;sw=sh;sh=t;}
    if(img&&img.width&&sw>0&&sh>0){
      const n=Math.min(48,Math.max(4,sw)), m=Math.min(48,Math.max(4,sh));
      if(!inkCv.ctx){inkCv.c=document.createElement('canvas');inkCv.c.width=48;inkCv.c.height=48;
                     inkCv.ctx=inkCv.c.getContext('2d',{willReadFrequently:true});}
      inkCv.ctx.clearRect(0,0,48,48);
      inkCv.ctx.drawImage(img,reg.x,reg.y,sw,sh,0,0,n,m);
      const px=inkCv.ctx.getImageData(0,0,n,m).data;
      let inked=0,nb=0;
      for(let i=0;i<n*m;i++){const o=i*4;
        if(px[o+3]*col.a<=8)continue; inked++;
        if(Math.max(px[o]*col.r,px[o+1]*col.g,px[o+2]*col.b)>40)nb++;}
      hit=inked>0&&(nb/inked)>=0.05;
    }
  }catch(e){}
  inkCache.set(key,hit); return hit;}

/* ⚠️ 2026-10-05：**这里不做"层级剔除背景巨幕"**（弹窗 index.html 有做，别为了
   "两边一致"搬过来）。取证方式与结论：
     · 加进去跑 `run_cg_export.py --only tianjinfeng_2 --redo --extra 'tag=withdrop'`，
       再回滚跑一次 `tag=nodrop`，两次产物 **md5 完全相同**
       （74e59a6fdc32d9522f14bd8cf5cca1e5，清掉 profile 缓存后第三次跑仍相同）
       ⇒ 这条判据对导出产物**零影响**，拿它换不来任何东西，只多一份要同步维护的代码。
     · 为什么零影响：本页顶点框只决定**画布初始比例**，最终构图由下面 `contentBBox()`
       的像素二次构图定；而像素二次构图在本页是**可靠**的（渲静止姿态 + `await sleep(30)`
       等 GPU），它自己就能把"顶点框 7000、实际不透明内容 3884"的背景裁到实际内容。
       弹窗那边像素二次构图**读不到像素**（动画在跑、贴图首帧才上传，实测恒读空），
       只能靠顶点框 ⇒ 才需要事先把背景巨幕层剔出去。
   ⇒ 判据属于"取景机制"，与机制绑定：两页机制不同，判据就不该一致。
     门槛是「有没有实测收益」，不是「两边看起来一致」。
     详细数据与判据见 index.html 的 `dropBackdropLayers` 注释（§105）。 */
function framingBox(skeletons){let cur=[];
  for(const sk of skeletons) for(const slot of sk.slots){
    const a=slot.getAttachment(); if(!a||!slot.bone||!slot.bone.active)continue;
    const col=(slot.data&&slot.data.color)||{r:1,g:1,b:1,a:1};
    if(col.a<=0.001)continue;
    let v,c;
    try{ if(a instanceof spine.RegionAttachment){v=spine.Utils.newFloatArray(8);c=8;a.computeWorldVertices(slot.bone,v,0,2);}
      else if(a instanceof spine.MeshAttachment&&a.worldVerticesLength){c=a.worldVerticesLength;v=spine.Utils.newFloatArray(c);a.computeWorldVertices(slot,0,c,v,0,2);}
      else continue;
      let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
      for(let j=0;j<c;j+=2){if(v[j]<x0)x0=v[j];if(v[j]>x1)x1=v[j];if(v[j+1]<y0)y0=v[j+1];if(v[j+1]>y1)y1=v[j+1];}
      if(x1<x0||y1<y0)continue;
      cur.push({a,col,r:[x0,y0,x1,y1]});
    }catch(e){continue;}
  }
  cur=dropOutliers(cur);
  const union=(l)=>{ if(!l.length)return null; const r=[1e9,1e9,-1e9,-1e9];
    for(const e of l){if(e.r[0]<r[0])r[0]=e.r[0];if(e.r[1]<r[1])r[1]=e.r[1];
                      if(e.r[2]>r[2])r[2]=e.r[2];if(e.r[3]>r[3])r[3]=e.r[3];} return r; };
  let box=union(cur);
  for(let round=0;round<6&&box;round++){const w=box[2]-box[0],h=box[3]-box[1],T=Math.max(w,h)*0.02;
    const kill=new Set(cur.filter(e=>(e.r[0]<=box[0]+T||e.r[1]<=box[1]+T||e.r[2]>=box[2]-T||e.r[3]>=box[3]-T)
                                     &&!inksOf(e.a,e.col)));
    if(!kill.size)break;
    const rest=cur.filter(e=>!kill.has(e)), nb=union(rest);
    if(!nb)break;                      // 全剥光就退回上一轮（yunlong_3 会走到这里）
    cur=rest; box=nb;}
  return box;}

/* 分层的权威清单只有一份：`Spine_v2/<目录>/parts.json`（由 extract_spine_v2.py 从 prefab 落盘）。
   拿不到就抛错，**绝不回落到"目录里有哪些 .skel"** —— 那个 glob 正是把本体与和谐版
   叠在一起画、造出 15 对逐像素相同 CG 的根因（docs/TROUBLESHOOTING.md §58）。 */
async function partsCfg(base,folder){
  const r=await fetch(base+'parts.json');
  if(!r.ok) throw new Error(folder+': 缺 parts.json（先跑 py -3 scripts/extract_spine_v2.py --parts-only）');
  const j=await r.json(); const m={};
  for(const l of (j.layers||[])) m[l.layer]=l;
  return m;
}

async function exportOne(job,longSide){
  const base='../Spine_v2/'+job.folder+'/';
  const textures={};
  const layers=[]; const errs=[];
  const pcfg=await partsCfg(base,job.folder);
  for(const pn of job.parts){
    if(ONLY_PARTS.length && ONLY_PARTS.indexOf(pn)<0) continue;   // ?part= 层过滤
    try{ layers.push(await loadPart(base,pn,textures,pcfg[pn])); }
    catch(e){ errs.push(pn+': '+(e.message||e)); }
  }
  if(!layers.length){ for(const t in textures)try{textures[t].dispose()}catch(e){}
    throw new Error((ONLY_PARTS.length?'?part='+ONLY_PARTS.join(',')+' 没匹配到任何层；':'')+(errs.join(' | ')||'无部件')); }
  // 取景框：见上方 framingBox（与画廊弹窗同一判据）
  const fb=framingBox(layers.map(L=>L.skeleton));
  if(!fb){ for(const t in textures)try{textures[t].dispose()}catch(e){} throw new Error('包围盒为空'); }
  const minX=fb[0],minY=fb[1],maxX=fb[2],maxY=fb[3];
  const bw=maxX-minX, bh=maxY-minY;
  let W,H; const pad=1.04;
  if(bw>=bh){W=longSide;H=Math.max(64,Math.round(longSide*bh/bw*pad/pad));}else{H=longSide;W=Math.max(64,Math.round(longSide*bw/bh*pad/pad));}
  W=Math.min(W,4096);H=Math.min(H,4096);
  cv.width=W;cv.height=H;
  gl.viewport(0,0,W,H);
  scene.camera.setViewport(W,H);   // 关键：resize() 不更新相机视口，必须显式 setViewport
  const camX0=(minX+maxX)/2, camY0=(minY+maxY)/2;
  let camX=camX0, camY=camY0, zoom=Math.max(bw*pad/W,bh*pad/H);
  function draw(){
    scene.camera.position.set(camX,camY,0);
    scene.camera.zoom=zoom;
    scene.camera.update();
    gl.clear(gl.COLOR_BUFFER_BIT);
    scene.begin(); for(const L of layers)scene.drawSkeleton(L.skeleton,true); scene.end();
  }
  draw();
  await sleep(30); // 等 GPU 完成
  // 二次构图：像素 alpha 包围盒（顶点包围盒会被超大半透明部件撑爆，如冒险号/阿拉曼什）
  function contentBBox(){
    const px=new Uint8Array(W*H*4); gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,px);
    let x0=W,y0=H,x1=-1,y1=-1;
    /* 判据：alpha > 8（**原样**）。
       ⚠️ 2026-10-05 两次踩坑，别再改这条（与 index.html 的 pixelFit 同源同判据）：
       ① 「不透明近黑=留白」（max(r,g,b)<40）⇒ 暗调皮肤 79.6% 像素都被判留白，裁掉角色。
       ② 「局部纯色=留白」（连续 24 像素同色）⇒ 大片平滑渐变被判留白，裁掉角色。
       ⇒ 没有可靠像素判据能区分留白与深色内容；宁可留黑边，不要裁内容。 */
    for(let y=0;y<H;y++){const row=(H-1-y)*W;
      for(let x=0;x<W;x++){ if(px[(row+x)*4+3]>8){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } } }
    return x1<0?null:[x0,y0,x1,y1];
  }
  const bb=contentBBox();
  let frac=1;
  if(bb){
    frac=((bb[2]-bb[0]+1)*(bb[3]-bb[1]+1))/(W*H);
    if(frac<0.82){
      const cx=(bb[0]+bb[2])/2, cy=(bb[1]+bb[3])/2;
      camX=camX+(cx-W/2)*zoom; camY=camY+(H/2-cy)*zoom;
      zoom=Math.max((bb[2]-bb[0]+1)*zoom*pad/W,(bb[3]-bb[1]+1)*zoom*pad/H);
      draw(); await sleep(30);
    }
  }
  const blob=await new Promise((rs,rj)=>cv.toBlob(b=>b?rs(b):rj(new Error('toBlob 失败')),'image/png'));
  /* ?tag= 落到文件名后缀：逐层诊断图**绝不能覆盖正式产物** CG_v2/<key>.png。 */
  const saveName=OUT_TAG ? job.folder+'_'+OUT_TAG : job.folder;
  const r=await fetch('/save_cg?name='+encodeURIComponent(saveName),{method:'POST',body:blob});
  if(!r.ok)throw new Error('save 失败 HTTP '+r.status);
  for(const t in textures)try{textures[t].dispose()}catch(e){}
  return {W,H,bw:Math.round(bw),bh:Math.round(bh),frac:+frac.toFixed(2),errs};
}

$('#btnStop').onclick=()=>{stopFlag=true;log('收到停止指令，当前皮肤完成后中断…','warn');};
$('#btnStart').onclick=async()=>{
  if(running)return; running=true; stopFlag=false;
  const longSide=parseInt($('#selSize').value,10);
  const redo=$('#chkRedo').checked;
  let done=0,skip=0,fail=0;
  for(let i=0;i<jobs.length;i++)setRow(i,'等待','st-wait',{size:'—',scene:'—',frac:'—',ms:'—',note:''});
  setSum();
  for(let i=0;i<jobs.length;i++){
    if(stopFlag)break;
    const job=jobs[i];
    if(!redo){const e=await (await fetch('/cg_exists?name='+encodeURIComponent(job.folder))).text();
      if(e==='1'){skip++;setRow(i,'跳过','st-skip',{note:'已存在（勾「重做已存在的」才覆盖）'});
        $('#prog').textContent=`${i+1}/${jobs.length} 跳过${skip} 完成${done} 失败${fail}`;
        setSum(done,skip,fail);continue;}}
    setRow(i,'导出中','st-now',{note:''});
    const t0=performance.now();
    try{
      const r=await exportOne(job,longSide);
      done++;
      setRow(i,'完成','st-done',{size:`${r.W}x${r.H}`,scene:`${r.bw}x${r.bh}`,frac:String(r.frac),
        ms:fmtMs(Math.round(performance.now()-t0)),note:r.errs.length?'⚠ '+r.errs.join('；'):''});
      log(`✓ [${i+1}/${jobs.length}] ${job.folder} (${job.name}) ${r.W}x${r.H} 场景${r.bw}x${r.bh} 覆盖${r.frac}${r.errs.length?'  ⚠ '+r.errs.join('; '):''}`, r.errs.length||r.frac<0.5?'warn':'ok');
    }catch(e){fail++;
      setRow(i,'失败','st-fail',{ms:fmtMs(Math.round(performance.now()-t0)),note:e.message||String(e)});
      log(`✗ [${i+1}/${jobs.length}] ${job.folder}: ${e.message||e}`,'fail');}
    $('#prog').textContent=`${i+1}/${jobs.length} 跳过${skip} 完成${done} 失败${fail}`;
    setSum(done,skip,fail);
    await sleep(50);
  }
  setSum(done,skip,fail);
  log(stopFlag?`已停止：完成${done} 跳过${skip} 失败${fail}`:`全部结束：完成${done} 跳过${skip} 失败${fail}`,'warn');
  running=false;
};
if(new URLSearchParams(location.search).get('autostart')==='1')$('#btnStart').click();
</script>
