<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>碧蓝航线资产浏览器 · Azur Lane Asset Browser</title>
<script>/* 先定主题再渲染，否则刷新会闪一下默认色 */try{document.documentElement.dataset.theme=localStorage.getItem('gallery.theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
<style>
/* ══════════════════════════════════════════════════════════════════════
   两套配色共用一套形状与动效：
     · 浅色（默认）取自游戏自己的界面语言——白色圆角面板 + 天蓝标题条 + 樱粉点缀；
     · 深色 = 原来那套（`--bg:#0f1320` 一族），作为「夜」保留。
   颜色的"个性"由 token 承担，形状/弹性两边一致，切主题时只有配色在动。
   ⚠️ 组件规则里**不许出现字面颜色**，否则另一套主题会漏色。新增控件请引用 token。
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --r-card:16px; --r-panel:20px; --r-chip:999px; --r-in:12px;
  /* 弹性曲线：末段过冲再落回 —— "Q弹"里"弹"的那一半 */
  /* ⚠️ 2026-09-28 第二次改口：先做的是"Q弹/果冻"（末段过冲 + 按下压扁），用户看过实机
     明确否掉——"不要那种点击一下就弹一下的反应，要 iPhone 那种丝滑"。
     ⇒ 交互全部改走这一条**无过冲**的平滑曲线（iOS 的加速-减速），
        压扁 / 鼓起 / 回弹三件套一起删；按下只剩极轻的一下 scale(.97)。
     三个旧 token 名保留为别名：调用点有三十来处，逐处改容易漏。
     ⚠️ 以后加动效默认用 --ease-ios；要过冲必须先问。 */
  --ease-ios:cubic-bezier(.32,.72,0,1);
  --spring:var(--ease-ios); --spring-jelly:var(--ease-ios); --spring-slow:var(--ease-ios);
  --t-col:.34s;                       /* 主题切换时配色过渡的时长 */
}
:root,[data-theme=light]{
  color-scheme:light;
  --bg:#eef4fb; --bg2:#e3ecf8; --panel:#ffffff; --panel2:#f4f8fd; --line:#d8e4f2;
  --txt:#3a4a63; --txt2:#5b6d8c; --dim:#93a3bd;
  --brand:#5fb0ef; --brand-d:#3d87d4; --brand-l:#e8f4ff;
  --pop:#ff9ec4; --pop-d:#f4779f; --pop-l:#fff0f6;
  --ok:#4fc787; --ok-d:#2f8a5d;
  --acc:var(--pop); --acc2:var(--brand);
  --sh1:0 2px 8px rgba(96,140,190,.14); --sh2:0 6px 18px rgba(96,140,190,.18);
  --sh3:0 14px 34px rgba(96,140,190,.24);
  --mask:rgba(120,150,190,.42);
  --stage:repeating-linear-gradient(45deg,#f7fafd 0 12px,#eaf1fa 12px 24px);
  --bar:rgba(255,255,255,.94);
  --chip:#ffffff; --chip-line:#d8e4f2; --rar-bg:#f4f8fd;
  --grad-brand:linear-gradient(180deg,#7cc3f6 0%,#5fb0ef 45%,#3d87d4 100%);
  --grad-pop:linear-gradient(180deg,#ffb8d3 0%,#f4779f 100%);
  --grad-mint:linear-gradient(180deg,#8fe3bd 0%,#2f9e63 100%);
  /* 卡片名称条的压暗底：白天用半透明墨蓝，夜里更深；文字两套都用近白 */
  --scrim:linear-gradient(0deg,rgba(26,48,78,.90) 0%,rgba(26,48,78,.62) 46%,rgba(26,48,78,0) 100%);
  --scrim-txt:#f4f9ff;
  /* 水面着色参数（只有背景那层读，组件不碰）：泡沫/高光/水体色 + 斜率增益与起沫阈值。
     白天泡沫纯白、水体往蓝里压；夜里泡沫偏冰蓝、高光更亮。 */
  --w-foam:#ffffff; --w-glint:#ffffff; --w-deep:#5fa0d8;
  --w-gain:8; --w-foamth:0.012; --w-alpha:0.97;
  /* 卡片"悬空"：面板留一点透明度，海面才不是只在缝隙里露一下；
     --gloss 是果冻的高光（上半亮、下半透），只用于按钮表面。 */
  /* 玻璃拟态（liquid glass），不是磨砂白卡：面板**几乎全透**、只给极轻的一层模糊，
     真正的玻璃感来自三样东西——① 上沿一道镜面亮边 ② 一圈更厚的"边墙"折射背后
     ③ 跟着鼠标跑的高光。模糊只给进过视口的卡挂（见 .g / GLASS_IO）。 */
  --card-bg:rgba(255,255,255,.05); --glass-line:rgba(152,182,214,.30);
  --glass-blur:2.5px; --rim-blur:17px;
  /* 亮边从 98% 白压到 20%：真玻璃的边缘靠"透"读出来，画一条白线只会像塑料贴皮 */
  --rim-hi:rgba(255,255,255,.20); --spec:rgba(255,255,255,.30);
  /* 常驻的斜向反光：玻璃在任何角度都会反一条光，这是"是玻璃"最直接的一笔。
     它跟跟着鼠标跑的圆斑叠在一起（::after 的两层背景），不是只在高光时才出现。 */
  --spec2:linear-gradient(118deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,.04) 23%,rgba(255,255,255,0) 46%);
  /* 文字区那层底：原来给到 60% 白 —— 那就是"奶膜"，是上一版被判"还是毛玻璃"的主因 */
  --body-tint:rgba(255,255,255,.24);
  --sh-float:0 14px 30px rgba(38,62,96,.16);
  /* 导航栏是"厚材质"：比卡片实，但仍然是玻璃——下沿一条亮发丝边代替灰边 */
  --nav-bg:rgba(255,255,255,.16); --nav-line:rgba(255,255,255,.18);
  --title:var(--brand-d);
  --nav-blur:6px; --nav-rim:17px;
  --gloss:linear-gradient(180deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.06) 42%,rgba(255,255,255,0) 60%);
  /* 材质态三件套：选中不再整块填色，而是"更亮一档的玻璃 + 一圈细彩色内描边 + 彩色文字"。
     整页只留 brand 一个强调色（pop 从此只出现在标签/角标这类**内容**上，不再出现在控件上）。 */
  --on-bg:color-mix(in srgb,var(--brand) 13%,transparent);
  --on-ring:color-mix(in srgb,var(--brand) 52%,transparent);
  --on-txt:var(--brand-d);
  --r0:#b8860b; --r1:#f4779f; --r2:#8f6fd0; --r3:#3d87d4; --r4:#2f9e63;
}
[data-theme=dark]{
  color-scheme:dark;
  --bg:#0f1320; --bg2:#0b0e18; --panel:#171c2e; --panel2:#1e2438; --line:#2b3350;
  --txt:#e6e9f2; --txt2:#b9c3da; --dim:#8b93ad;
  --brand:#4d8bff; --brand-d:#2b6cb0; --brand-l:#18223c;
  --pop:#e94560; --pop-d:#c9304c; --pop-l:#2a1822;
  --ok:#37c26e; --ok-d:#2a8f52;
  --acc:#e94560; --acc2:#4d8bff;
  --sh1:0 2px 8px rgba(0,0,0,.34); --sh2:0 6px 18px rgba(0,0,0,.4);
  --sh3:0 14px 34px rgba(0,0,0,.52);
  --mask:rgba(5,7,14,.82);
  --stage:repeating-conic-gradient(#12172a 0 25%,#0d1120 0 50%) 0 0/28px 28px;
  --bar:rgba(10,13,24,.86);
  --chip:#1e2438; --chip-line:#2b3350; --rar-bg:#1e2438;
  --grad-brand:linear-gradient(180deg,#5f97ff 0%,#2b6cb0 100%);
  --grad-pop:linear-gradient(180deg,#ff6b81 0%,#c9304c 100%);
  --grad-mint:linear-gradient(180deg,#4fd489 0%,#2a8f52 100%);
  --scrim:linear-gradient(0deg,rgba(4,8,18,.94) 0%,rgba(4,8,18,.70) 46%,rgba(4,8,18,0) 100%);
  --scrim-txt:#eaf0ff;
  --w-foam:#eaf6ff; --w-glint:#cfe9ff; --w-deep:#2f6f9f;
  --w-gain:11; --w-foamth:0.008; --w-alpha:1.0;
  /* 夜里面板本来就深，透明度收一点就够"悬空"，再多缩略图就糊在海里了 */
  --card-bg:rgba(10,16,30,.14); --glass-line:rgba(255,255,255,.2);
  --glass-blur:2.5px; --rim-blur:17px;
  --rim-hi:rgba(255,255,255,.16); --spec:rgba(210,232,255,.16);
  --title:#9dc2ff;
  --spec2:linear-gradient(118deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.02) 23%,rgba(255,255,255,0) 46%);
  --body-tint:rgba(10,16,30,.32);
  --sh-float:0 14px 30px rgba(0,0,0,.42);
  --nav-bg:rgba(10,16,30,.2); --nav-line:rgba(255,255,255,.10);
  --nav-blur:6px; --nav-rim:17px;
  --gloss:linear-gradient(180deg,rgba(255,255,255,.08) 0%,rgba(255,255,255,.025) 42%,rgba(255,255,255,0) 60%);
  --on-bg:color-mix(in srgb,var(--brand) 18%,transparent);
  --on-ring:color-mix(in srgb,var(--brand) 46%,transparent);
  --on-txt:#a9c8ff;
  --r0:#c9a24b; --r1:#ff5c8a; --r2:#b07bff; --r3:#5aa2ff; --r4:#37c26e;
}
*{margin:0;padding:0;box-sizing:border-box}
/* 主题切换时给配色加过渡：只在 .theming 期间生效，平时不干扰下面的 hover 弹性 */
html.theming *{transition:background-color var(--t-col),color var(--t-col),
  border-color var(--t-col),box-shadow var(--t-col) !important}
body{font-family:'Segoe UI',"Microsoft YaHei",system-ui,sans-serif;color:var(--txt);height:100vh;
  display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed}
/* 导航栏：和卡片同一块玻璃。⚠️ 上一版它是"一眼就看出是毛玻璃"的元凶——
   62% 白 + 20px 背景模糊，那就是磨砂玻璃的标准配方（模糊越大越像磨砂，越不像玻璃）。
   真玻璃的配方反过来：**几乎不糊**（6px，够让背后的形状保持轮廓）+ **近乎全透**
   （底色只留 16%，够压住文字对比度即可）+ 三样"玻璃特征"：
     ① 下沿一条亮发丝边（玻璃的截面高光）
     ② 下沿 14px 一条更厚的"边墙"，折射强度明显高于栏体
     ③ 一道斜穿整条栏的反光（--spec2，和卡片同一张材质）
   ⚠️ 伪元素是 ::before/::after，栏内所有子元素必须抬到它们上面（下面 header>* 那条）。 */
header{background:var(--nav-bg);
  backdrop-filter:blur(var(--nav-blur)) saturate(1.8) brightness(1.05);
  -webkit-backdrop-filter:blur(var(--nav-blur)) saturate(1.8) brightness(1.05);
  border-bottom:1px solid transparent;padding:9px 14px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  box-shadow:inset 0 -1px 0 var(--rim-hi),
             0 8px 26px color-mix(in srgb,var(--brand) 12%,transparent);
  position:relative;z-index:10}
/* ② 下沿的"边墙"：一条 14px 厚、折射更重的玻璃截面（和卡片 ::before 同一个手法） */
header::before{content:'';position:absolute;left:0;right:0;bottom:0;height:14px;
  pointer-events:none;z-index:-1;
  -webkit-backdrop-filter:blur(var(--nav-rim)) saturate(2.2) brightness(1.14);
  backdrop-filter:blur(var(--nav-rim)) saturate(2.2) brightness(1.14)}
/* ③ 斜穿整条栏的反光：静止就在，不跟鼠标（栏子长，跟着鼠标会太吵） */
header::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:-1;
  background:var(--spec2)}
/* ⚠️ 这里**绝不能给 header 的直接子元素设 z-index**：一设就各自生成层叠上下文，
   下拉面板那个 z-index:40 就被关在自己那个 .ctl 里出不来，于是排在后面的提示文字
   会压在展开的面板上（用户截图里的"混在一起了"就是这个）。
   position:relative 单独用是安全的（z-index:auto 不生成层叠上下文）。 */
header>*{position:relative}
header h1{font-size:16px;color:var(--title);white-space:nowrap;font-weight:800;letter-spacing:.02em}
header .sub{font-size:11px;color:var(--dim)}
.ctl{display:flex;align-items:center;gap:6px}
.ctl label{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.04em}

/* ── 自绘下拉 ──────────────────────────────────────────────────────────
   原生 <select> 展开的那层是**操作系统画的**，CSS 一行都碰不到 ⇒ 想要"落下来"
   的动效只能自己画。做法：原生 select 留在 DOM 里当数据源与状态（只缩成 1px 透明、
   不参与交互），所以 apply() 与它的 change 监听**一行都不用改**；外面套一个
   真按钮 + 绝对定位的面板，选中时回写 select.value 并 dispatch change。 */
.dd{position:relative;display:inline-block}
.dd>select{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;margin:0}
.dd-btn{display:inline-flex;align-items:center;gap:10px;justify-content:space-between;min-width:106px;
  background:var(--panel2);color:var(--txt);border:1.5px solid var(--line);padding:6px 12px;
  border-radius:var(--r-chip);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  transition:border-color .16s var(--spring),box-shadow .16s,background .16s}
.dd-btn:hover{border-color:var(--glass-line);background:var(--panel)}
.dd-btn:focus-visible{outline:none;border-color:var(--brand);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.dd-btn[aria-expanded=true]{border-color:var(--brand);background:var(--panel);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.dd-arw{font-style:normal;font-size:9px;color:var(--dim);transition:transform .24s var(--spring)}
.dd-btn[aria-expanded=true] .dd-arw{transform:rotate(180deg)}
.dd-panel{position:absolute;top:calc(100% + 6px);left:0;z-index:40;min-width:100%;width:max-content;
  max-width:min(330px,72vw);max-height:56vh;overflow:auto;padding:5px;display:none;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh3)}
/* 面板整体"落下并坐定"（overshoot），条目再逐条错开 12ms —— 这两层叠加才像掉下来的 */
.dd.open .dd-panel{display:block;animation:ddrop .26s var(--spring)}
@keyframes ddrop{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}
.dd-opt{display:flex;justify-content:space-between;gap:12px;padding:6px 11px;border-radius:9px;
  font-size:13px;color:var(--txt2);font-weight:600;cursor:pointer;white-space:nowrap;
  animation:ddin .2s ease-out backwards;animation-delay:calc(min(var(--i,0),14)*12ms)}
@keyframes ddin{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.dd-opt:hover,.dd-opt.cur{background:var(--brand-l);color:var(--brand-d)}
.dd-opt .n{color:var(--dim);font-weight:700}
.dd-opt:hover .n{color:var(--brand-d)}
input[type=text],select{background:var(--panel2);color:var(--txt);border:1.5px solid var(--line);
  padding:6px 12px;border-radius:var(--r-chip);font-size:13px;outline:none;font-weight:600;
  transition:border-color .16s var(--spring),box-shadow .16s,background .16s}
input[type=text]:hover,select:hover{border-color:var(--brand);background:var(--panel)}
input[type=text]:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
#search{width:190px;flex:none;transition:width .28s var(--spring-slow),border-color .16s var(--spring),
  box-shadow .16s,background .16s}
#search:focus{width:270px}
.grow{flex:1}
.hint{font-size:11px;color:var(--dim);font-weight:600}
.hint b{color:var(--brand-d)}
/* 底部那条 76px 空带**已按用户要求去掉**（2026-09-28）：卡片改成半透明面板"悬空"在
   海面上，背景从每张卡的底下透出来，不再需要专门空一条没人看的带子。
   padding-bottom 只留 22px 给最后一行喘口气（它跟着内容滚，不是常驻条）。 */
main{flex:1;overflow:auto;padding:16px 16px 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(154px,1fr));gap:14px}
/* 卡片：入场逐张弹起（--i 由 JS 给，超过 24 号不再排队，避免千张卡排到天荒地老）
   ⚠️ 术语纠正（2026-09-28 用户点名）：**毛玻璃 ≠ 玻璃拟态**。我上一版做的是"磨砂白卡"
   （半透明白 + 14px 背景模糊），那东西看着像蒙了层雾，不是玻璃。玻璃拟态的识别特征是：
     ① 面板**几乎全透**（白天只留 13% 白），背后的海直接看得见；
     ② 上沿一道**镜面亮边**（inset 高光），加一圈更厚的"边墙"去折射背后（::before）；
     ③ 一道**常驻的斜向反光**（::after）。
        ⚠️ 原来这里做的是"跟着鼠标跑的高光"，用户 2026-09-29 否掉：
        "不要鼠标发光这个效果" —— 反光是材质自带的，不是一团跟着光标走的光晕。
   原来那圈 1.5px 灰色边框按用户要求去掉：灰边在玻璃上就是"塑料盒"的来源。
     · **跟随鼠标倾斜**：上一版我量到幅度只有 1.4°/1.8°、肉眼约等于零，就把整条删了——
       判错了，用户要的是"看得见"，不是"不要"。现在 ±11°/±9°，perspective 收到 760px。
       倾斜量走 CSS 变量而不是内联 transform：内联会盖掉 :hover/:active 两条规则。
     · 悬停仍然是「描边点亮 + 外圈柔光 + 上浮 + 缩略图微放大」，**不再有名条/动作条**
       （用户：舰名不需要显示两遍 → 直接去掉那条，舰名只在下方出现一次）。 */
.card{position:relative;background:var(--card-bg);border:1px solid var(--glass-line);
  border-radius:var(--r-card);overflow:hidden;cursor:pointer;
  /* 四层：外投影给"浮起来"的深度 + 上沿镜面亮边 + 一圈内侧柔光（玻璃的"体"）+
     下沿一抹厚度色。玻璃是**有厚度的透明体**，这三条 inset 就是那个厚度。 */
  box-shadow:var(--sh2), inset 0 1px 0 var(--rim-hi),
             inset 0 0 30px color-mix(in srgb,var(--panel) 30%,transparent),
             inset 0 -20px 34px color-mix(in srgb,var(--brand) 7%,transparent);
  display:flex;flex-direction:column;
  --rx:0deg;--ry:0deg;--lift:0px;--sc:1;
  transform:perspective(620px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(var(--lift)) scale(var(--sc));
  transition:transform .14s ease-out,box-shadow .24s var(--spring-slow),border-color .18s ease-out;
  animation:pop .34s var(--spring) backwards;animation-delay:calc(min(var(--i,0),24)*16ms)}
/* ① 面板本身：极轻的一层模糊（5px）——玻璃会折射，但不会把背后糊成一团白 */
.card.g{-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.5);
  backdrop-filter:blur(var(--glass-blur)) saturate(1.5)}
/* ② 边墙：一圈 12px 的"更厚的玻璃"，折射强度明显高于面板 —— 玻璃拟态最出特征的一笔。
   做法是 backdrop-filter 挂在 ::before 上，再用两层 mask 做 exclude，只留外圈那一环。
   ⚠️ 厚度从 9px 加到 12px、模糊从 13px 加到 17px：上一版这一圈太薄，看不出"边"和"面"的差别。 */
.card.g::before{content:'';position:absolute;inset:0;z-index:4;pointer-events:none;
  border-radius:inherit;padding:12px;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  -webkit-backdrop-filter:blur(var(--rim-blur)) saturate(2) brightness(1.08);
  backdrop-filter:blur(var(--rim-blur)) saturate(2) brightness(1.08)}
/* ③ 反光：只留**常驻的那道斜向反光**（--spec2）。
   ⚠️ 原来这里还叠了一层"跟着鼠标跑的圆斑"（radial-gradient at var(--mx)/var(--my)），
   用户 2026-09-29 明确否掉："不要鼠标发光这个效果" —— 已删，JS 侧也不再写 --mx/--my。
   玻璃仍然有反光，但反光是材质自带的，不是一团跟着光标走的光晕。 */
.card::after{content:'';position:absolute;inset:0;z-index:5;pointer-events:none;
  background:var(--spec2)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
/* 发光用 box-shadow 两层（贴边描边环 + 扩散投影），不用 outline：outline 会被相邻卡片
   盖住，环在网格上会断。 */
/* 悬停：**不发光**（用户 2026-09-28 明确："划过卡片不用发光"）。
   反馈改成"玻璃被照亮"——描边转纯白高光、反光加强、投影换成中性并加深一点、抬 1px。
   ⚠️ 这条必须把静止态的三条 inset **一起重写**：box-shadow 是整属性替换，
   只写外投影就会把玻璃的厚度一起丢掉，悬停瞬间会塌成一张纸（探针的层数判据抓过）。 */
.card:hover{--lift:-5px;--sc:1.015;border-color:var(--rim-hi);
  box-shadow:var(--sh-float), inset 0 1px 0 var(--rim-hi),
             inset 0 0 34px color-mix(in srgb,var(--panel) 40%,transparent),
             inset 0 -20px 34px color-mix(in srgb,var(--brand) 10%,transparent)}
.card:active{--lift:-1px;--sc:.985;box-shadow:var(--sh1)}   /* 按下只压 1.5%，不回弹 */
/* 键盘走到卡片上给一圈**更实**的环（用 brand-d，浅色下也够对比）——
   这是 §6.18 第 ④ 条：以前键盘导航零可见反馈。 */
.card:focus{outline:none}
.card:focus-visible{--lift:-4px;border-color:var(--brand-d);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-d) 55%,transparent),
             0 12px 28px color-mix(in srgb,var(--brand) 32%,transparent),
             inset 0 1px 0 var(--rim-hi),
             inset 0 -20px 34px color-mix(in srgb,var(--brand) 9%,transparent)}
.card .thumb{aspect-ratio:3/4;background:transparent center/contain no-repeat;position:relative;overflow:hidden}
.card .thumb img{width:100%;height:100%;object-fit:contain;display:block;opacity:0;
  transition:transform .3s var(--spring-slow),opacity .3s ease-out}
.card .thumb img.ld{opacity:1}
.card:hover .thumb img,.card:focus-visible .thumb img{transform:scale(1.06)}
/* 文字区单独压一层淡底：面板全透之后，拼音/标签压在海上会读不清。
   玻璃拟态本来就是这么做的——**内容区有色调，装饰区透明**。 */
.card .body{padding:8px 10px 10px;background:linear-gradient(180deg,transparent,var(--body-tint) 42%)}
.card .nm{font-size:13px;font-weight:800;color:var(--txt);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:9px;padding:2px 7px;border-radius:var(--r-chip);background:var(--rar-bg);
  background:color-mix(in srgb,var(--txt2) 8%,var(--panel));color:var(--txt2);border:1px solid var(--line);font-weight:700}
.tag.f{color:var(--brand-d)}.tag.s{color:var(--pop-d)}
.rar-海上传奇{color:var(--r0)}.rar-超稀有{color:var(--r1)}.rar-精锐{color:var(--r2)}.rar-稀有{color:var(--r3)}.rar-普通{color:var(--r4)}

/* 分段控件：整颗胶囊，选中那颗由一粒会滚的胶囊承担（和弹层标签条同一套语言） */

.opt{display:inline-flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-chip);padding:3px}

#gTheme button.on{background:var(--on-bg);color:var(--on-txt);box-shadow:inset 0 0 0 1px var(--on-ring)}
.view img.full{max-width:100%;max-height:100%;object-fit:contain;user-select:none}

  color:var(--txt2);width:34px;height:34px;border-radius:50%;font-size:19px;cursor:pointer;line-height:1;
  box-shadow:var(--sh1);transition:transform .22s var(--spring),background .18s,color .18s,border-color .18s}

/* Live2D 检查器面板 */
.l2panel{position:absolute;top:52px;right:10px;width:258px;max-height:calc(100% - 116px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-in);z-index:5;font-size:11px;
  padding:8px;display:none;box-shadow:var(--sh2)}

@keyframes slidein{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.l2panel .pf{position:sticky;top:0;background:var(--panel);padding:0 0 6px;margin-bottom:2px;z-index:2}
.l2panel .pf input{width:100%;box-sizing:border-box;background:var(--panel2);border:1.5px solid var(--line);
  color:var(--txt);border-radius:var(--r-chip);padding:4px 10px;font-size:11px;outline:none}

  padding:2px 8px;border-radius:var(--r-chip);font-weight:700}
.note{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;
  text-align:center;color:var(--dim);font-size:13px;line-height:1.7;font-weight:600}

::-webkit-scrollbar{width:10px;height:10px}

::-webkit-scrollbar-thumb:hover{background:#8fb6de;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
[data-theme=dark] ::-webkit-scrollbar-thumb{background:#333a56;background-clip:content-box}
[data-theme=dark] ::-webkit-scrollbar-thumb:hover{background:#465074;background-clip:content-box}
/* ══ 背景层：干净柔色底 + 三团大色块（2026-09-28 拆掉整屏噪声着色器）══════
   上一版是 WebGL2 的 fbm 域扭曲（光柱/海面亮带/焦散/颗粒/暗角全在着色器里）。
   用户判"很丑"，取证后确认**不是参数没调好，是手法本身的问题**：整屏低频噪声 +
/* ══ 背景层：静止的柔色底 + 「一划就起浪」的水面（2026-09-28 第四版）══════
   前三版（气泡+正弦线 / 2D 粒子星野 / WebGL 噪声着色器 / 三团漂移色块）全部被否，
   共同的毛病不是"好不好看"，而是**背景自己在动**：只要它不响应操作，就只是一张装饰壁纸。
   这一版把"动"整个交还给用户：
     · 静止时 = 完全平的（底色渐变 + 三团**不动**的柔色块），没人在划就一帧都不画
     · 滑动时 = 指针轨迹往水高场注入偶极脉冲 → 波动方程向外传播 → 波峰处渲染出白沫
     · 停下后 = 场在 ~2 秒内衰减回平面，循环自己停掉，回到"完全不动"
   ⇒ 于是这版对不对有一条极干脆的硬指标：**静止时任意两帧逐像素完全相同**
     （前几版做不到，它们一直在漂），而**划过之后必须先亮起来、再回到那个静止态**。
   实现：CPU 上跑 240×N 的波动方程（Float32 三缓冲，一次遍历几千次加法），
   高度场当纹理上传，WebGL 只负责按法线画高光与泡沫。零噪声函数、零 fbm、零域扭曲
   ——上一版"蓝色绸缎"的肌理就是从那几个函数里长出来的，这版结构上不存在它们。
   色块仍然纯 CSS、颜色全走 token ⇒ 切主题背景自己跟着换，不需要 JS 参与。
   三条硬约束不变：pointer-events:none；z-index 低于内容；卡片是不透明面板。 */
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
/* ⚠️ 这里**不留四周渐隐遮罩**（上一版留了，是错的）：#bgfx 是 inset:0 的固定层，
   它的四条边就是屏幕的四条边 —— 被裁在屏幕边上根本看不见，遮罩换不来任何东西；
   而它偏偏把**底部那条唯一露着背景的空带**淡掉了 9%，等于把浪藏起来不给看。 */
#bgfx .bfield{position:absolute;inset:-10%}
/* closest-side + 中间停靠点 = 平滑衰减；不用 filter:blur（74vmax 的元素上那是白烧 GPU，
   而且径向渐变本身已经足够软）。**没有 animation**：静止就是这版的卖点。 */
#bgfx .glow{position:absolute;width:74vmax;height:74vmax;border-radius:50%}
#bgfx .g1{left:-24vmax;top:-28vmax;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--brand) 80%,transparent) 0%,
    color-mix(in srgb,var(--brand) 36%,transparent) 40%,transparent 100%)}
#bgfx .g2{right:-26vmax;bottom:-32vmax;width:68vmax;height:68vmax;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--pop) 66%,transparent) 0%,
    color-mix(in srgb,var(--pop) 26%,transparent) 40%,transparent 100%)}
#bgfx .g3{right:2vmax;top:-26vmax;width:54vmax;height:54vmax;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--ok) 56%,transparent) 0%,
    color-mix(in srgb,var(--ok) 22%,transparent) 40%,transparent 100%)}
[data-theme=light] #bgfx .glow{opacity:.8}
[data-theme=dark]  #bgfx .glow{opacity:.62}
/* 水面画布盖在色块之上：静止时它是全透明的，所以看上去就是"柔色底"本身 */
#bgfx canvas{position:absolute;inset:0;width:100%;height:100%}
header{position:relative;z-index:10}   /* 原本就有，这里只是把"内容压在背景上"这件事写全 */
main{position:relative;z-index:1}
/* 弹层开着的时候不再 wake 水面 —— 这条**只在 JS 侧做**（既不注入脉冲也不排下一帧）。
   这里不留 CSS 规则：背景已经没有任何自移动画，没有东西可"暂停"。
   （上一版这条挂在 .glow 的 animation-play-state 上，那时有漂移动画才需要。） */
/* ══ 交互反馈层：一个语义一种表现（§6.18 五条真缺陷的收口）══════════════
   本轮 grep 出来的事实：① 同一个「选中」语义有 5 种颜色 ② Live2D/Spine 两条控制条
   其实是浏览器原生按钮（CSS 只给了 font-size/padding）③ 全文 :active 命中 0 次
   ④ 全文 :focus-visible 命中 0 次，且 `input,select{outline:none}` 连默认焦点环一起杀了
   ⑤ 状态开关与瞬时动作外观一模一样。
   ①②③ 已由上一轮的 token + 弹性曲线顺带解决，这里补 ④ 与 ⑤。 */
/* ④ 键盘焦点环：:focus-visible 只在**键盘**导航时出现，鼠标点击不会留一个环。
   统一用 outline + offset（不是 box-shadow）——环要能盖在卡片自己的发光阴影外面。
   写在 :where() 里是为了让 specificity 归零，任何组件自己的焦点样式都能盖过它。 */
:where(button,input,select,textarea,a,[tabindex]):focus-visible{
  outline:2.5px solid var(--brand-d);outline-offset:2px}
/* 自带「环」语义的几处接管掉，避免同一元素上出现两圈 */
.card:focus-visible,.dd-btn:focus-visible,input[type=text]:focus-visible,select:focus-visible,
.l2panel .pf input:focus-visible{outline:none}
/* ⑤ 状态开关 vs 瞬时动作：以前外观一模一样。这里**不用颜色**区分（颜色已经全部被
   「一个语义一种表现」占用），改用形状 —— 开关左侧一颗 LED（关=空心、开=实心带辉光），
   瞬时动作按钮没有 LED、保持纯胶囊。 */
.opt button::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;
  margin-right:6px;background:transparent;border:1.5px solid currentColor;opacity:.5;
  transition:background .18s,opacity .18s,box-shadow .18s}
.opt button.on::before{background:currentColor;border-color:currentColor;opacity:1;
  box-shadow:0 0 7px currentColor}
/* 昼/夜那两个是「分段单选」，不是开关，不给 LED（否则四个全局开关的语义就糊了） */
#gTheme button::before{content:none;margin:0;border:0;width:0;height:0;box-shadow:none}
/* 查看器里的两个状态开关（判定区 / 参数·部件）由 JS 打上 .tg 走同一套 */
.srcbar button.tg::before,.spine-bar button.tg::before{content:'';display:inline-block;
  width:7px;height:7px;border-radius:50%;margin-right:6px;background:transparent;
  border:1.5px solid currentColor;opacity:.5;transition:background .18s,opacity .18s,box-shadow .18s}
.srcbar button.tg.on::before,.spine-bar button.tg.on::before{background:currentColor;
  border-color:currentColor;opacity:1;box-shadow:0 0 7px currentColor}
/* 剩下两条补齐：控制条里的原生下拉此前没有 hover；标签/皮肤行没有按压反馈 */
.spine-bar select:hover,.spine-bar select:focus{border-color:var(--brand);background:var(--panel)}
.tab:active,.skin:active,.dd-opt:active{filter:brightness(.94);transform:scale(.985)}
/* ══ 动效增补：标签滑块 / 弹层从卡片飞入 / 昼夜圆形擦除 ══════════════
   .diag/q2_style.css 是本块之前的配色正本，这里三段同样只引用 token。 */
/* 标签条：选中那颗的底色换成一条会滑的胶囊，切标签时整条飞过去
   （原来逐颗变背景，视觉上是"闪一下"而不是"换过去"） */
.tabs{position:relative}
.tslide{position:absolute;left:0;top:var(--y,6px);height:var(--h,28px);width:var(--w,0);
  border-radius:var(--r-chip);background:var(--on-bg);
  box-shadow:inset 0 0 0 1px var(--on-ring), var(--sh1);
  transform:translateX(var(--x,0));transition:transform .3s var(--ease-ios),width .3s var(--ease-ios);
  z-index:0;pointer-events:none}
.tabs .tab{position:relative;z-index:1}
.tabs .tab.on{color:var(--on-txt);background:transparent;box-shadow:none}
.tabs .tab.on:hover{background:transparent}
/* 弹层：从被点那张卡片的**缩略图**位置/大小长大到位（FLIP）。
   --fx/--fy/--fs 由 JS 量出来写进变量；只动 transform，不改布局尺寸，
   所以 Live2D / Spine 初始化读到的 clientWidth 与动画无关，不会被压扁。 */
.modal.fly{animation:flyin .36s var(--spring-slow)}
@keyframes flyin{from{opacity:.15;transform:translate(var(--fx,0),var(--fy,0)) scale(var(--fs,.12))}
  to{opacity:1;transform:none}}
/* 关闭时按原路缩回那张卡片（.mask.closing .modal 是原地缩回，这条更具体，覆盖它） */
.mask.closing .modal.flyout{animation:flyout .26s cubic-bezier(.4,0,.75,.4) forwards}
@keyframes flyout{to{opacity:0;transform:translate(var(--fx,0),var(--fy,0)) scale(var(--fs,.12))}}
.mask.on{animation:maskin .2s ease-out}
@keyframes maskin{from{opacity:0}}
/* 昼夜切换：以开关为圆心的圆形擦除 —— 整页快照后让新主题的 clip-path 由 0 涨到全覆盖。
   比交叉溶解更"像天黑下来"，也顺带绕开了渐变不可过渡的问题。 */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}
::view-transition-new(root){z-index:2;animation:vtwipe .52s cubic-bezier(.4,0,.2,1) both}
@keyframes vtwipe{from{clip-path:circle(0% at var(--cx,50%) var(--cy,0%))}
  to{clip-path:circle(150% at var(--cx,50%) var(--cy,0%))}}
/* ══ 交互反馈：iOS 式丝滑（无过冲、无形变）══════════════════════════════
   悬停只做「点亮」——描边亮起 + 底色变化 + 1px 抬升，**不放大、不鼓出**；
   按下只有一下 scale(.97) 的轻压感（iOS 的按钮就是这个手感）；松手平滑回位。
   全程没有回弹、没有压扁，也没有任何弹簧曲线。
   ⚠️ .close 故意不进这组：它自己的 hover 是「转 90° + 放大」，被通用规则一盖就没了。 */
.seg button,.opt button,.tab,.dd-btn,.srcbar button,.spine-bar button,.vbox button,
.l2panel .prow button{
  transition:transform .22s var(--ease-ios),box-shadow .22s var(--ease-ios),
    border-color .18s ease-out,color .16s ease-out,background-color .16s ease-out}
.seg button:hover,.opt button:hover,.tab:hover,.dd-btn:hover,.srcbar button:hover,
.spine-bar button:hover,.vbox button:hover,.l2panel .prow button:hover{filter:brightness(1.06)}
/* 按下：压暗 + 等比缩 .985，**不位移、不形变、不回弹**。
   有回弹/有形变就是果冻，只有亮度变化才是 iOS。 */
.seg button:active,.opt button:active,.tab:active,.dd-btn:active,.srcbar button:active,
.spine-bar button:active,.vbox button:active,.skin:active,.dd-opt:active,
.l2panel .prow button:active{filter:brightness(.94);transform:scale(.985)}
/* 悬停既然只改亮度，过渡必须带上 filter */
.seg button,.opt button,.tab,.dd-btn,.srcbar button,.spine-bar button,.vbox button,
.l2panel .prow button{transition:transform .2s var(--ease-ios),filter .18s var(--ease-ios),
  box-shadow .2s var(--ease-ios),border-color .18s ease-out,color .16s ease-out}
/* 表面高光：只给"有边框的芯片"。选中态用的是 background 简写（渐变），会自然盖掉这层。 */
.dd-btn,.srcbar button,.spine-bar button,.vbox button,.seg,.opt,.tabs,.spine-bar select{
  background-image:var(--gloss)}
/* 材质态之下不再给选中项叠"实心渐变 + 高光"——那正是"整块填色"的来源。
   选中只靠三件事表达：更亮一档的底（--on-bg）、一圈细彩色内描边（--on-ring）、彩色文字。 */
/* 系统要求减少动效时，只留必要的淡入，去掉所有回弹 */
@media (prefers-reduced-motion: reduce){
  .card,.card:hover,.card:active,.skin:hover,.skin .th,.close:hover,.tbtn:hover,.tab:hover,
  .srcbar button:hover,.spine-bar button:hover,.vbox button:hover{transition:none;transform:none}
  /* 果冻的"鼓起/压扁"是形变，减动效下全部退成不动，只留颜色反馈 */
  .seg button:hover,.seg button:active,.opt button:hover,.opt button:active,.tab:hover,.tab:active,
  .dd-btn:hover,.dd-btn:active,.srcbar button:active,.spine-bar button:active,.vbox button:active,
  .skin:active,.dd-opt:active,.l2panel .prow button:hover,.l2panel .prow button:active{
    transition:none;transform:none}
  .card,.modal,.talksub.on,.l2panel.on,.view.swap,.modal.fly,.mask.on{animation:none}
  .card .thumb img{opacity:1}          /* 淡入靠 load 事件，这里必须直接可见，否则图永不显示 */
  /* 背景：色块本来就没有动画；水面那层由 JS 看 RM 决定**根本不初始化**，
     所以这里无需再写退化规则（写了也没东西可退）。 */
  .tslide,.segslide{transition:none}
  #search,#search:focus{width:190px;transition:border-color .16s,box-shadow .16s,background .16s}
  ::view-transition-new(root){animation:none}
}
</style>
</head>
<body>
<div id="bgfx" aria-hidden="true"><div class="bfield"><i class="glow g1"></i><i class="glow g2"></i><i class="glow g3"></i></div></div>
<header>
  <h1>碧蓝航线资产浏览器</h1>
  <div class="ctl"><input type="text" id="search" placeholder="搜索 中文名 / 拼音ID"></div>
  <div class="ctl"><label>类别</label><div class="seg" id="fCat">
    <button data-c="" class="on">全部</button><button data-c="ship">舰船</button><button data-c="story">剧情角色</button>
  </div></div>
  <div class="ctl"><label>阵营</label><select id="fFaction"><option value="">全部</option></select></div>
  <div class="ctl"><label>舰种</label><select id="fType"><option value="">全部</option></select></div>
  <div class="ctl"><label>稀有度</label><select id="fRarity"><option value="">全部</option></select></div>
  <div class="ctl"><label>排序</label><select id="fSort">
    <option value="cn">按名称</option><option value="faction">按阵营</option><option value="type">按舰种</option><option value="rarity">按稀有度</option>
  </select></div>
  <div class="ctl"><label>内容</label><select id="fHas">
    <option value="">全部</option><option value="spine">含Spine</option><option value="live2d">含Live2D</option><option value="voice">含语音</option><option value="cn">有中文名</option>
  </select></div>
  <div class="grow"></div>
  <div class="ctl"><label>全局</label><div class="opt" id="gOpt">
    <button data-k="voice" title="点击立绘 / Live2D 部位时是否播放语音">点击出声</button>
    <button data-k="lines" title="播放台词时是否在画面下方显示中文正文">显示台词</button>
    <button data-k="remember" title="记住每个皮肤上次的缩放与位置，下次打开直接回到那里">记住视角</button>
  </div></div>
  <div class="ctl"><label>配色</label><div class="opt" id="gTheme" title="昼 / 夜配色（状态会记住）">
    <button data-t="light">昼</button><button data-t="dark">夜</button>
  </div></div>
  <div class="hint" id="count"></div>
  <div class="hint" id="modehint"></div>
</header>
<main id="main"></main>

<div class="mask" id="mask">
  <div class="modal">
    <button class="close" id="close">×</button>
    <div class="side">
      <div class="hd"><div class="t" id="mName"></div><div class="p" id="mPy"></div></div>
      <div class="meta" id="mMeta"></div>
      <div class="skinlist" id="mSkins"></div>
    </div>
    <div class="content">
      <div class="tabs" id="mTabs"></div>
      <div class="view" id="mView"></div>
    </div>
  </div>
</div>

<script src="./index.js"></script>
<script src="./vendor/spine/spine-all.js"></script>
<script>
const G = window.GALLERY;
const P = location.protocol === 'file:' ? '../' : '../'; // 图片相对路径前缀（两种协议下均可）
const ships = G.ships;
let view = ships.slice();
let catFilter = '';   // ''=全部 / ship=舰船 / story=剧情角色

/* ---------- 全局交互开关（localStorage 持久化，三个视图共用） ----------
   两条各自独立：关掉「点击出声」后点画面仍然会上字幕（只是不出声），
   关掉「显示台词」则只出声不上字幕。语音标签页里的 <audio> 是用户明确点的，不受①限制。 */
const OPT_KEY = 'gallery.opt.v1';
const RM = matchMedia('(prefers-reduced-motion: reduce)');   // 动效总开关（系统设置）
/* 三个全局开关。⚠️ 这里**不再有 bgfx**：背景现在只在被划的时候才动、不划就完全静止，
   没有"需要关掉的花哨"，所以那颗按钮按用户要求删掉了（2026-09-28）。
   老用户 localStorage 里残留的 `bgfx:false` 会被 Object.assign 塞进来，但没人再读它——
   不清理是故意的：清它要写迁移代码，而那个键无害。 */
let OPT = {voice:true, lines:true, remember:true};
try{ Object.assign(OPT, JSON.parse(localStorage.getItem(OPT_KEY) || '{}')); }catch(e){}
function saveOpt(){ try{ localStorage.setItem(OPT_KEY, JSON.stringify(OPT)); }catch(e){} }
function paintOpt(){ document.querySelectorAll('#gOpt button')
  .forEach(b=>b.classList.toggle('on', !!OPT[b.dataset.k])); }

/* ---------- 昼 / 夜主题 与 筛选栏折叠（各自持久化） ----------
   主题在 <head> 里已先落 data-theme 防闪烁，这里只负责切换与同步按钮文字。
   配色过渡靠临时挂 .theming（见 CSS），不挂时 hover 的弹性曲线才不会被拖慢。 */
const THEME_KEY='gallery.theme';
function paintTheme(){ const t=document.documentElement.dataset.theme||'light';
  document.querySelectorAll('#gTheme button').forEach(b=>b.classList.toggle('on', b.dataset.t===t)); }
function setTheme(t){
  const apply=()=>{ document.documentElement.dataset.theme=t;
    try{ localStorage.setItem(THEME_KEY,t); }catch(e){} paintTheme();
    /* 三团色块是 color-mix 自 token 的，CSS 自己就跟着换了；但**水面参数**
       （泡沫色 / 斜率增益 / 起沫阈值）是 JS 一次性读进 BG.P 的，必须在这里重取一次，
       否则夜里还在用白天那套泡沫色。bgColors 是函数声明，提升得到，放前面也能调。 */
    if(typeof bgColors==='function') bgColors(); };
  /* 渐变类背景（body 的 linear-gradient、选中胶囊的渐变、查看器底纹）在 CSS 里
     **根本不可过渡**，只给 background-color 加 transition 就会一半在淡、一半瞬切 ——
     这就是"不够自然"的来源。View Transition 是对整页做快照再交叉溶解，
     渐变/阴影/底纹一起参与，Chrome・Edge 111+ 原生支持；不支持时退回配色过渡。 */
  if(!RM.matches && document.startViewTransition) document.startViewTransition(apply);
  else if(RM.matches) apply();
  else { const h=document.documentElement; h.classList.add('theming'); apply();
    clearTimeout(setTheme._t); setTheme._t=setTimeout(()=>h.classList.remove('theming'),400); }
}
/* 圆心取被点那颗胶囊的位置：--cx/--cy 写在 html 上，::view-transition-new(root) 继承得到 */
document.querySelectorAll('#gTheme button').forEach(b=>b.onclick=()=>{
  const r=b.getBoundingClientRect();
  const h=document.documentElement;
  h.style.setProperty('--cx',((r.left+r.width/2)/h.clientWidth*100).toFixed(2)+'%');
  h.style.setProperty('--cy',((r.top+r.height/2)/h.clientHeight*100).toFixed(2)+'%');
  setTheme(b.dataset.t);
});

/* ---------- 视角记忆（按 皮肤key|标签页 存相机，下次打开回到这里） ----------
   存的必须是**尺度无关量**，否则换窗口尺寸 / 进全屏后位置会错位：
     painting: s（放大倍率）+ 偏移按视口宽高归一化
     live2d:   z + 偏移按 baseK 归一化（= 模型本地像素，与视口无关）
     spine:    camX/camY 是世界坐标、zoom 无量纲，原样存即可
   皮肤有 1000+ 个，全存会顶穿 localStorage 配额 ⇒ 按访问时间 LRU 截断到 VMEM_MAX 条。 */
const VIEW_KEY = 'gallery.view.v1', VMEM_MAX = 300;
let VMEM = {};
try{ VMEM = JSON.parse(localStorage.getItem(VIEW_KEY) || '{}') || {}; }catch(e){}
function vmemGet(k){ return (OPT.remember && VMEM[k]) || null; }
function vmemSet(k, v){ if(!OPT.remember) return;
  VMEM[k] = Object.assign({}, v, {t: Date.now()});
  const ks = Object.keys(VMEM);
  if(ks.length > VMEM_MAX){ ks.sort((a,b)=>VMEM[a].t - VMEM[b].t);
    for(const x of ks.slice(0, ks.length - VMEM_MAX)) delete VMEM[x]; }
  try{ localStorage.setItem(VIEW_KEY, JSON.stringify(VMEM)); }catch(e){} }
/* 滚轮/拖拽每帧都触发，落盘要合并；视图销毁前必须强制 flush 一次，否则最后一次操作丢 */
function vmemCommitter(key, read){ let t = null;
  return { touch(){ if(!OPT.remember) return; clearTimeout(t); t = setTimeout(()=>{ t=null; vmemSet(key, read()); }, 350); },
            flush(){ if(t){ clearTimeout(t); t = null; vmemSet(key, read()); } } }; }

/* ---------- 工具 ---------- */
function thumbOf(skin){ return skin.cg ? ('thumbs/' + skin.key + '_cg.webp') : skin.image ? ('thumbs/' + skin.key + '.webp') : ''; }
function fullOf(skin){ return skin.cg ? (P + skin.cg) : skin.image ? (P + skin.image) : ''; }
function hasSpine(s){ return s.spineSkins && s.spineSkins.length; }
function hasL2d(s){ return s.live2dSkins && s.live2dSkins.length; }
function defSkin(s){ return s.skins[0]; }
function rarClass(r){ return r ? ('rar-'+r) : ''; }

/* ---------- 筛选下拉填充 ---------- */
function uniqCount(arr){ const m={}; arr.forEach(x=>{if(x)m[x]=(m[x]||0)+1;}); return m; }
(function fillSelects(){
  const fc=uniqCount(ships.map(s=>s.faction)), tp=uniqCount(ships.map(s=>s.type)), rr=uniqCount(ships.map(s=>s.rarity));
  const opt=(sel,m,ph)=>{const e=document.getElementById(sel);Object.keys(m).sort((a,b)=>m[b]-m[a]).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=`${k} (${m[k]})`;e.appendChild(o);});};
  opt('fFaction',fc); opt('fType',tp); opt('fRarity',rr);
})();

/* ---------- 渲染网格（按 category 分区：舰船 / 剧情角色） ---------- */
const mainEl = document.getElementById('main');
function catOf(s){ return s.category==='story' ? 'story' : 'ship'; }
function makeCard(s){
  const card=document.createElement('div'); card.className='card';
  const ds=defSkin(s); const th=thumbOf(ds);
  const badges=[]; if(hasSpine(s))badges.push('<span class="b-spine">SPINE</span>'); if(hasL2d(s))badges.push('<span class="b-l2d">L2D</span>'); if(s.voiceCount)badges.push('<span class="b-voice">🔊'+s.voiceCount+'</span>');
  const tags=[]; if(s.rarity)tags.push(`<span class="tag ${rarClass(s.rarity)}">${s.rarity}</span>`); if(s.faction)tags.push(`<span class="tag f">${s.faction}</span>`); if(s.type)tags.push(`<span class="tag s">${s.type}</span>`);
  card.innerHTML=`<div class="thumb">${th?`<img loading="lazy" src="${th}">`:'<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#555;font-size:12px">无立绘</div>'}<div class="badge">${badges.join('')}</div></div>
    <div class="body"><div class="nm">${s.name}</div><div class="py">${s.id} · ${s.skins.length}皮肤</div><div class="tags">${tags.join('')}</div></div>`;
  /* 卡片可 Tab 聚焦：以前整张网格只有鼠标一条路，键盘走不到任何一张卡（§6.18 ④）。
     Enter/Space 的激活走 mainEl 上的**一个**委托监听器，不给千张卡各挂一个。 */
  if(GLASS_IO) GLASS_IO.observe(card); else card.classList.add('g');   // 毛玻璃按需挂载
  card.tabIndex=0; card.setAttribute('role','button');
  card.setAttribute('aria-label',s.name+' · '+s.skins.length+' 个皮肤');
  card.onclick=()=>openShip(s,card);
  /* 缩略图淡入：懒加载的图到货那一刻不该"啪"地跳出来。
     complete 分支必须有 —— 命中缓存时 load 事件根本不会再发。 */
  const im=card.querySelector('img');
  if(im){ const on=()=>im.classList.add('ld');
    if(im.complete) on();
    else { im.addEventListener('load',on,{once:true}); im.addEventListener('error',on,{once:true}); } }
  return card;
}
function renderGrid(){
  if(GLASS_IO) GLASS_IO.disconnect();   // 卡片整批换新，旧目标必须全摘（见 GLASS_IO 注释）
  mainEl.innerHTML='';
  const cntEl=document.getElementById('count');
  if(!view.length){ mainEl.innerHTML='<div class="empty">没有匹配的内容</div>'; cntEl.textContent='共 0 项'; return; }
  const groups = catFilter==='' ? [['ship','舰船'],['story','剧情角色']] : [[catFilter, catFilter==='ship'?'舰船':'剧情角色']];
  let shown=0; const per={};
  groups.forEach(([key,label])=>{
    const list = view.filter(s=>catOf(s)===key);
    per[key]=list.length;
    if(!list.length) return;
    shown+=list.length;
    const hd=document.createElement('div'); hd.className='sec-hd'+(key==='story'?' story':'');
    hd.innerHTML=`${label} <span class="n">${list.length}</span>`;
    mainEl.appendChild(hd);
    const g=document.createElement('div'); g.className='grid';
    const frag=document.createDocumentFragment();
    list.forEach((s,i)=>{ const c=makeCard(s); c.style.setProperty('--i',i); frag.appendChild(c); });
    g.appendChild(frag); mainEl.appendChild(g);
  });
  if(!shown){ mainEl.innerHTML='<div class="empty">该类别下没有匹配项</div>'; }
  cntEl.textContent = catFilter==='' ? `共 ${shown} 项 · 舰船 ${per.ship||0} / 剧情 ${per.story||0}` : `共 ${shown} 项`;
}

/* ---------- 卡片跟随鼠标倾斜 + 毛玻璃按需挂载 ----------
   倾斜：整张网格只有**一个**委托监听器（1000+ 张卡不能各挂 mousemove），
   只写 --rx/--ry 两个变量，不写内联 transform —— 内联会把 :hover/:active 两条规则
   整个盖掉，抬起和按压就全失效了。
   ⚠️ 幅度：满偏 ±8°/±6.5°（dx*16 / dy*13），perspective 从 760px 收到 620px 再放大
   一点透视感。上一版是 ±4.5°/±3.5°，探针在鼠标停在 0.68/0.32 那个点时量到 1.4°/1.8°
   —— 我当时把"取样点太靠中心"当成了"设计幅度太小"，直接删了整条动效，判错：
   用户要的是"看得见"，不是"不要"。教训记进 TROUBLESHOOTING：判"看不见"要按**满偏**算，
   不能拿一个随手取的点当上限。
   ⚠️ transform 的过渡压到 .14s：跟着鼠标转的东西如果挂上 .24s 的弹性曲线，
   每帧都被重新触发一次回弹，手感是"糊"而不是"跟"。
   ⚠️ 卡面矩形按卡缓存：每帧都 getBoundingClientRect 再写 style 就构成
   「写→读」强制回流，1008 张卡的网格上会掉帧。滚动时把缓存作废即可。 */
let tiltOn=null, tiltRect=null;
function tiltReset(){ if(tiltOn){
  tiltOn.style.setProperty('--rx','0deg');
  tiltOn.style.setProperty('--ry','0deg');
  tiltOn=null; tiltRect=null; } }
mainEl.addEventListener('scroll',()=>{ tiltRect=null; },{passive:true});
mainEl.addEventListener('mousemove',e=>{
  if(RM.matches){ tiltReset(); return; }
  const c=e.target.closest('.card');
  if(!c){ tiltReset(); return; }
  if(c!==tiltOn||!tiltRect){ tiltReset(); tiltOn=c; tiltRect=c.getBoundingClientRect(); }
  const dx=(e.clientX-tiltRect.left)/tiltRect.width-.5, dy=(e.clientY-tiltRect.top)/tiltRect.height-.5;
  c.style.setProperty('--ry',(dx*16).toFixed(2)+'deg');
  c.style.setProperty('--rx',(-dy*13).toFixed(2)+'deg');
});
mainEl.addEventListener('mouseleave',tiltReset);

/* 毛玻璃（backdrop-filter）只给**进过视口**的卡片挂：1008 张各挂一层背景模糊是必掉的帧，
   而 IntersectionObserver 把同时生效的数量压到同屏那几十张。
   ⚠️ 每次重画网格必须先 disconnect()：观察器会持有它 observe 过的元素，
   卡片是每次筛选都整批新建的，不摘就会一路攒下去（泄漏）。 */
const GLASS_IO = ('IntersectionObserver' in window) ? new IntersectionObserver(es=>{
  es.forEach(en=>en.target.classList.toggle('g', en.isIntersecting));
},{rootMargin:'140px'}) : null;

/* ---------- 卡片键盘激活 ----------
   键盘那条路：Enter / Space 激活焦点所在的卡片（整张网格一个委托监听器，不给千张卡各挂）。
   悬停的描边发光 / 上浮 / 缩略图微放大全部由 CSS 的 :hover / :focus-visible 承担；
   JS 在这张网格上只写倾斜的两个变量，不碰别的。 */
mainEl.addEventListener('keydown',e=>{
  if(e.key!=='Enter' && e.key!==' ' && e.key!=='Spacebar') return;
  const c=e.target.closest && e.target.closest('.card');
  if(!c) return;
  e.preventDefault();          // 空格默认会翻页，必须吃掉
  c.click();
});

/* ---------- 搜索/筛选 ---------- */
function apply(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const f=document.getElementById('fFaction').value, t=document.getElementById('fType').value, r=document.getElementById('fRarity').value, hs=document.getElementById('fHas').value;
  view=ships.filter(s=>{
    if(f && s.faction!==f)return false;
    if(t && s.type!==t)return false;
    if(r && s.rarity!==r)return false;
    if(hs==='spine' && !hasSpine(s))return false;
    if(hs==='live2d' && !hasL2d(s))return false;
    if(hs==='voice' && !s.voiceCount)return false;
    if(hs==='cn' && !s.hasCn)return false;
    if(q && s.name.toLowerCase().indexOf(q)<0 && s.id.toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  const sk=document.getElementById('fSort').value;
  const RAR={'海上传奇':0,'超稀有':1,'精锐':2,'稀有':3,'普通':4};
  if(sk==='rarity')view.sort((a,b)=>(RAR[a.rarity]??9)-(RAR[b.rarity]??9)||a.name.localeCompare(b.name,'zh'));
  else if(sk==='faction')view.sort((a,b)=>a.faction.localeCompare(b.faction,'zh')||a.name.localeCompare(b.name,'zh'));
  else if(sk==='type')view.sort((a,b)=>a.type.localeCompare(b.type,'zh')||a.name.localeCompare(b.name,'zh'));
  else view.sort((a,b)=>a.name.localeCompare(b.name,'zh'));
  renderGrid();
}
['search'].forEach(id=>document.getElementById(id).addEventListener('input',debounce(apply,180)));
['fFaction','fType','fRarity','fHas','fSort'].forEach(id=>document.getElementById(id).addEventListener('change',apply));

/* ---------- 把原生 select 包成带动效的下拉 ----------
   状态仍然只存在 select.value 上：选中时回写 value 并 dispatch change，
   所以上面那行 change→apply 的绑定、以及 apply() 读 value 的代码一行都不用改。
   放在这里是因为 fillSelects 已经跑完，阵营/舰种/稀有度的 option 才填好。 */
function enhanceSelect(sel){
  const dd=document.createElement('div'); dd.className='dd';
  sel.parentNode.insertBefore(dd,sel); dd.appendChild(sel);
  const btn=document.createElement('button'); btn.type='button'; btn.className='dd-btn';
  btn.setAttribute('aria-haspopup','listbox'); btn.setAttribute('aria-expanded','false');
  btn.innerHTML='<span class="dd-cur"></span><i class="dd-arw">▼</i>';
  const panel=document.createElement('div'); panel.className='dd-panel'; panel.setAttribute('role','listbox');
  dd.append(btn,panel);
  const cur=btn.querySelector('.dd-cur');
  const build=()=>{ panel.innerHTML='';
    [...sel.options].forEach((o,i)=>{ const d=document.createElement('div');
      d.className='dd-opt'; d.setAttribute('role','option'); d.dataset.v=o.value; d.style.setProperty('--i',i);
      const m=/^(.*?)\s*\((\d+)\)$/.exec(o.textContent.trim());   // "重樱 (161)" → 名字 + 数字分两栏对齐
      d.innerHTML=m?`<span>${m[1]}</span><span class="n">${m[2]}</span>`:`<span>${o.textContent}</span>`;
      panel.appendChild(d); }); };
  const sync=()=>{ const o=sel.selectedOptions[0]; cur.textContent=o?o.textContent:'';
    panel.querySelectorAll('.dd-opt').forEach(d=>d.classList.toggle('cur',d.dataset.v===sel.value)); };
  const open=v=>{ dd.classList.toggle('open',v); btn.setAttribute('aria-expanded',String(v)); if(v) sync(); };
  btn.onclick=()=>{ const willOpen=!dd.classList.contains('open');
    if(willOpen) document.querySelectorAll('.dd.open').forEach(x=>x.classList.remove('open'));  // 一次只开一个
    open(willOpen); };
  panel.onclick=e=>{ const d=e.target.closest('.dd-opt'); if(!d) return;
    sel.value=d.dataset.v; sel.dispatchEvent(new Event('change',{bubbles:true})); open(false); };
  sel.addEventListener('change',sync);
  document.addEventListener('pointerdown',e=>{ if(!dd.contains(e.target)) open(false); },true);
  btn.onkeydown=e=>{ const list=[...panel.children];
    if(e.key==='Escape'){ open(false); return; }
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault();
      if(!dd.classList.contains('open')){ open(true); return; }
      const i=list.findIndex(d=>d.classList.contains('cur'));
      const j=Math.max(0,Math.min(list.length-1, i+(e.key==='ArrowDown'?1:-1)));
      list[j] && list[j].click(); return; }
    if(e.key==='Enter'&&dd.classList.contains('open')){ e.preventDefault();
      const t=panel.querySelector('.dd-opt.cur')||list[0]; if(t) t.click(); } };
  build(); sync();
}
['fFaction','fType','fRarity','fHas','fSort'].forEach(id=>enhanceSelect(document.getElementById(id)));
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}

/* ---------- 详情弹层 ---------- */
let curShip=null, curSkin=null, tab='painting', paintSrc='cg';
let curVM=null;   // 当前视图的「视角记忆」提交器（切视图/关弹层时先 flush，否则最后一次滚轮会丢）
const mask=document.getElementById('mask'), viewEl=document.getElementById('mView');
let flySrc=null;   // 打开弹层那张卡片的缩略图：进场从这里长大，退场缩回这里
/* FLIP 的三段几何：起点(卡片)与终点(弹层)的中心差 + 宽度比，全写进 CSS 变量。
   卡片可能已滚出视口、或这次不是从卡片打开的（键盘/皮肤列表），此时返回 0 用原地动画。 */
function flyGeom(from){
  const m=document.querySelector('.modal');
  if(!m||!from||!from.isConnected||RM.matches) return 0;
  const r=from.getBoundingClientRect(), b=m.getBoundingClientRect();
  if(r.width<3||b.width<3||b.height<3) return 0;
  m.style.setProperty('--fx',((r.left+r.width/2)-(b.left+b.width/2)).toFixed(1)+'px');
  m.style.setProperty('--fy',((r.top+r.height/2)-(b.top+b.height/2)).toFixed(1)+'px');
  m.style.setProperty('--fs',Math.min(1,r.width/b.width).toFixed(4));
  return 1;
}
function openShip(s,from){
  curShip=s; setSkin(defSkin(s)); buildSkinList(s);
  flySrc=from?(from.querySelector('.thumb')||from):null;
  mask.classList.remove('closing'); mask.classList.add('on');
  placeTab(false);   // setSkin 跑在 mask 显示之前，那时量不到尺寸，这里补落位
  const m=document.querySelector('.modal'); if(!m) return;
  /* 开合都要把两个动画类清干净：弹层一旦 display:none，CSS 动画直接停摆、
     animationend 不再触发 ⇒ 只靠动画结束回调摘类会留下永久挂着的 .fly。 */
  m.classList.remove('flyout','fly');
  if(flyGeom(flySrc)){ m.classList.add('fly');
    m.addEventListener('animationend',function h(){ m.classList.remove('fly'); m.removeEventListener('animationend',h); }); }
}
function closeShip(){ if(curVM){ curVM.flush(); curVM=null; }
  stopSpine(); stopLive2D(); hideSub();
  const done=()=>{ mask.classList.remove('on','closing'); viewEl.innerHTML=''; document.getElementById('mTabs').innerHTML='';
    const m=document.querySelector('.modal'); if(m) m.classList.remove('flyout','fly'); };
  const fly=flyGeom(flySrc);
  if(mask.classList.contains('on') && !RM.matches){
    if(fly) document.querySelector('.modal').classList.add('flyout');
    mask.classList.add('closing');
    setTimeout(()=>{ if(mask.classList.contains('closing')) done(); }, fly?250:170);
  } else done(); }
document.getElementById('close').onclick=closeShip;
mask.onclick=e=>{if(e.target===mask)closeShip();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mask.classList.contains('on'))closeShip();});
/* ---------- 弹层内快捷键：换皮肤 / 切标签 / 全屏 / 复位（都是为了少点几次） ----------
   焦点在输入框 / 下拉 / 滑杆里时一律放行，否则打字和调滑杆会被抢走。 */
const TAB_KEYS={'1':'painting','2':'spine','3':'live2d','4':'voice'};
document.addEventListener('keydown',e=>{
  if(!mask.classList.contains('on')||e.ctrlKey||e.metaKey||e.altKey) return;
  const t=e.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;
  const tl=document.getElementById('mTabs').children;
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ const ks=curShip&&curShip.skins; if(!ks||ks.length<2) return;
    let i=ks.indexOf(curSkin)+(e.key==='ArrowRight'?1:-1); i=(i+ks.length)%ks.length;
    setSkin(ks[i]); buildSkinList(curShip); e.preventDefault(); return; }
  if(TAB_KEYS[e.key]){ const el=[...tl].find(c=>c.dataset.k===TAB_KEYS[e.key]);
    if(el&&!el.classList.contains('dis')){ el.click(); e.preventDefault(); } return; }
  if(e.key==='f'||e.key==='F'){ const b=document.getElementById('zFull')||document.getElementById('spFull')||document.getElementById('l2Full');
    if(b){ b.click(); e.preventDefault(); } return; }
  if(e.key==='r'||e.key==='R'){ const b=document.getElementById('zReset')||document.getElementById('spFit')||document.getElementById('l2Fit');
    if(b){ b.click(); e.preventDefault(); } return; }
});

function buildSkinList(s){
  const el=document.getElementById('mSkins'); el.innerHTML='<div class="lab">皮肤 / 变体 ('+s.skins.length+')</div>';
  s.skins.forEach(sk=>{
    const sp=s.spineSkins.includes(sk.key), l2=s.live2dSkins.includes(sk.key);
    const d=document.createElement('div'); d.className='skin'+(sk===curSkin?' on':''); d.dataset.k=sk.key;
    const th=thumbOf(sk);
    d.innerHTML=`<div class="th" style="background-image:${th?`url('${th}')`:'none'}"></div><div class="info">${sk.label}<div class="s2">${sk.key}${sp?' · Spine':''}${l2?' · L2D':''}</div></div>`;
    d.onclick=()=>{setSkin(sk);buildSkinList(s);};
    el.appendChild(d);
  });
}
function setSkin(sk){ curSkin=sk; paintSrc='cg'; const s=curShip;
  document.getElementById('mName').textContent=s.name;
  document.getElementById('mPy').textContent=s.id+(s.hasCn?'':' (未匹配中文名)');
  document.getElementById('mMeta').innerHTML=`${s.rarity?`<span class="${rarClass(s.rarity)}">${s.rarity}</span>`:''}${s.faction?`<span>阵营 <b>${s.faction}</b></span>`:''}${s.type?`<span>舰种 <b>${s.type}</b></span>`:''}<span>语音 <b>${s.voiceCount}</b>${(!s.voiceCount&&s.voiceText)?` / 台词 <b>${s.voiceText}</b>`:''}</span>`;
  const spineOn=!!(sk.spine && sk.spine.parts && sk.spine.parts.length), l2dOn=s.live2dSkins.includes(sk.key);
  /* 语音标签放行判据：有可播音频**或**有台词（主包没下发但表里有正文的那 44 张，见 §57） */
  const canVoice=s.voiceCount>0||s.voiceText>0;
  const tabs=[['painting','静态立绘',!!(sk.image||sk.cg)],['spine','Spine 动态',spineOn],['live2d','Live2D',l2dOn],['voice',s.voiceCount?('语音 '+s.voiceCount):(('台词 '+(s.voiceText||''))||'语音'),canVoice]];
  const tl=document.getElementById('mTabs'); tl.innerHTML='';
  const sl=document.createElement('span'); sl.className='tslide'; tl.appendChild(sl);
  tabs.forEach(([k,lab,en])=>{const d=document.createElement('div');d.className='tab'+(en?'':' dis')+(k===tab?' on':'');d.textContent=lab;d.dataset.k=k;
    d.onclick=()=>{if(!en)return; tab=k; [...tl.children].forEach(c=>c.classList.toggle('on',c.dataset.k===k)); placeTab(true); renderView();}; tl.appendChild(d);});
  const kh=document.createElement('span'); kh.className='kbhint';
  kh.textContent='←/→ 换皮肤 · 1-4 切标签 · F 全屏 · R 复位'; tl.appendChild(kh);
  // 自动切到有内容的标签
  if(!tabs.find(t=>t[0]===tab&&t[2])) tab = tabs.find(t=>t[2])?tabs.find(t=>t[2])[0]:'painting';
  [...tl.children].forEach(c=>c.classList.toggle('on',c.dataset.k===tab));
  placeTab(false);
  renderView();
}
/* 把「会滚的胶囊」落到选中那颗上。一律用 offset*（布局值）：
   getBoundingClientRect 会把弹层飞入动画的 scale(0.12) 乘进去，量到的落位是错的。
   anim=false 时关掉过渡（首次落位 / 标签条重建），否则每次打开弹层它都从上个位置飞一次。 */
function slidePill(sl, on, anim){
  if(!sl||!on) return;
  const set=()=>{ sl.style.setProperty('--x',on.offsetLeft+'px'); sl.style.setProperty('--y',on.offsetTop+'px');
    sl.style.setProperty('--w',on.offsetWidth+'px'); sl.style.setProperty('--h',on.offsetHeight+'px'); };
  if(anim){ set(); return; }
  const t=sl.style.transition; sl.style.transition='none'; set();
  void sl.offsetWidth; sl.style.transition=t;
}
/* 标签条滑块落位。⚠️ 弹层 display:none 时 offset* 全为 0：openShip 里 setSkin 跑得比
   显示早，所以那里补了一次 placeTab(false)。 */
function placeTab(anim){
  const tl=document.getElementById('mTabs'); if(!tl) return;
  slidePill(tl.querySelector('.tslide'), tl.querySelector('.tab.on'), anim);
}
window.addEventListener('resize',()=>placeTab(false));
function renderView(){
  if(curVM){ curVM.flush(); curVM=null; }
  /* 换标签/换皮肤时整块内容淡入一下：强制重排让 animation 每次都能重放 */
  viewEl.classList.remove('swap'); void viewEl.offsetWidth; viewEl.classList.add('swap');
  stopSpine(); stopLive2D(); stopSkinVoice(); const sk=curSkin;
  if(tab==='painting'){
    const hasCg=!!sk.cg, hasRaw=!!sk.image;
    if(!hasCg&&!hasRaw){ viewEl.innerHTML='<div class="note">该皮肤无独立立绘，只有动态资源</div>'; }
    else{
      const useCg = paintSrc==='raw' ? false : hasCg;
      const src = useCg ? P+sk.cg : P+sk.image;
      const sw = (hasCg&&hasRaw)
        ? `<button data-s="cg" class="${useCg?'on':''}">全屏 CG（Spine 合成）</button><button data-s="raw" class="${!useCg?'on':''}">立绘原件（painting）</button>`
        : (hasCg?'<span class="pill">Spine setup pose 全屏 CG</span>':'<span class="pill">painting 立绘</span>');
      viewEl.innerHTML=`<div class="fitwrap" id="imgStage"><img class="full" src="${src}" draggable="false"></div>
        <div class="srcbar">${sw}<span style="flex:1"></span><span class="pill">滚轮缩放 · 拖拽平移 · 双击100% · 全屏</span><button id="zReset">复位</button><button id="zFull">全屏</button></div>`;
      viewEl.querySelectorAll('.srcbar button[data-s]').forEach(b=>b.onclick=()=>{paintSrc=b.dataset.s;renderView();});
      mountImageViewer();
      /* 静态立绘也要能点出声（游戏里点立绘=触摸台词），故与本视图共用语音条 */
      mountSkinVoice(viewEl.querySelector('.srcbar'), document.getElementById('imgStage'), ()=>curSkin.key);
    }
  }
  else if(tab==='voice'){ renderVoice(); }
  else if(tab==='spine'){ viewEl.innerHTML='<div class="note">正在初始化 Spine…</div>'; if(location.protocol==='file:') viewEl.innerHTML='<div class="note">Spine 实时播放需要通过本地服务器加载资源。<br>请运行 <b>启动资产浏览器.bat</b>（或 <b>python -m http.server</b> 于 Output 目录）后，浏览器打开提示的地址访问。</div>'; else startSpine(curShip, sk); }
  else if(tab==='live2d'){ renderLive2D(curShip, sk); }

          Meta.Loop 被无视 → idle 播完即停。此前靠前端定时器「假装循环」，实测该定时器与运行时

    /* ---------- 判定区可视化（l2d.su 同款）：把 HitAreas 的**真实四边形**画在模型上 ----------
       画包围盒会让人以为「框里都能点」，而实际判定已按四边形走 → 可视化必须与判定同源（geomOf）。 */
    const AREA_COL={head:0x4fc3f7,body:0x81c784,special:0xffb74d};
    const areaG=new PIXI.Graphics(); areaG.visible=false; app.stage.addChild(areaG);
    const areaTs=hitAreas.map(()=>{ const tx=new PIXI.Text('',{fontSize:11,fill:0xffffff,stroke:0x0a0d18,strokeThickness:3});
      tx.visible=false; app.stage.addChild(tx); return tx; });
    /* V(顶点原生) → P → stage 像素：P=(Vx+cux/2, cuy/2-Vy)，stage = mdl.pos + P*ppu*scale。
       apply() 只设 mdl.scale/x/y（无旋转无锚点），手工映射即可（等价 toGlobal(P*ppu) 且更可控）。
       scale/x/y 每次重读：判定区随呼吸与动作实时位移。 */
    const toStage=(vx,vy)=>{ const s=mdl.scale.x;
      return [mdl.x+(vx+cux/2)*ppu*s, mdl.y+(cuy/2-vy)*ppu*s]; };
    /* 顶点是**三角带序** (v0,v1,v2,v3)=(TR,TL,BR,BL)，按原序连环会画成自交的蝴蝶结；
       与命中判定同语义 = 三角形 (v0,v1,v2)+(v1,v3,v2)，其无自交环序是 [0,1,3,2]。 */
    const ptsOf=(g)=>g.quad?[0,1,3,2].map(k=>toStage(g.quad.v[k][0],g.quad.v[k][1]))
                           :[toStage(g.x0,g.y1),toStage(g.x1,g.y1),toStage(g.x1,g.y0),toStage(g.x0,g.y0)];
    const rectOf=(pts)=>({x0:Math.min(...pts.map(p=>p[0])), x1:Math.max(...pts.map(p=>p[0])),
                          y0:Math.min(...pts.map(p=>p[1])), y1:Math.max(...pts.map(p=>p[1]))});
    const inView=(r)=>r.x1>0 && r.x0<wrap.clientWidth && r.y1>0 && r.y0<wrap.clientHeight;
    const drawAreas=()=>{ areaG.clear();
      hitAreas.forEach((ha,i)=>{ const g=geomOf(ha), tx=areaTs[i];
        if(!g){ tx.visible=false; return; }
        const pts=ptsOf(g), flat=[]; pts.forEach(p=>flat.push(p[0],p[1]));
        const col=AREA_COL[(ha.name||'').toLowerCase().replace(/^touch_/,'')]||0xba68c8;
        areaG.lineStyle(1.5,col,0.9).beginFill(col,0.07).drawPolygon(flat).endFill();
        /* 标签只在**框与视口相交**时才画（贴边可见的框仍保留 clamp）。
           换装按钮（TouchIdle 与 TouchDrag 系列）挂在会动的道具上：静止态被停在画布外几千像素处，
           播对应动作时才随部件进画面（2026-09-27 实测奇尔沙治皮肤2 全部 42 个动作组）。
           旧代码无条件把 x 夹进 [2, clientWidth-72]，于是出画框的名字被拽到屏幕右边缘，
           看起来就是「角落里有个点不到的判定区」（用户报的现象；同高的两个框还会叠成一行）。 */
        const r=rectOf(pts);
        if(!inView(r)){ tx.visible=false; return; }
        tx.text=ha.name; tx.style.fill=col; tx.visible=true;
        tx.position.set(Math.max(2,Math.min(r.x0,wrap.clientWidth-72)),
                        r.y0-15>=2 ? r.y0-15 : r.y1+3); }); };
    /* 「此刻画得出标签」的清单——与 drawAreas 走同一组判据，探针不许自己复算（§27 同源规则）。
       注意它与 __L2_HITUSE 的分工：USE=可点清单（退化框已被 geomOf 挡掉），
       SHOW=USE 里此刻与视口相交的那批，多边形按 USE 画、标签按 SHOW 画。 */
    window.__L2_HITSHOW=()=>hitAreas.filter(h=>{ const g=geomOf(h);
      return !!g && inView(rectOf(ptsOf(g))); }).map(h=>h.name);
    let areaViz=false;
    document.getElementById('l2AreasBtn').onclick=()=>{ areaViz=!areaViz;
      document.getElementById('l2AreasBtn').classList.toggle('on',areaViz);
      areaG.visible=areaViz; if(!areaViz) areaTs.forEach(t=>t.visible=false); else drawAreas(); };
    app.ticker.add(()=>{ if(areaViz) drawAreas(); });
    /* ---------- 参数/部件检查器（l2d.su 同款）：手调参数=变相表情，部件透明度=换装调试 ---------- */
    const idName=id=>(id&&id.string)||(typeof id==='string'?id:(id&&id.toString())||'?');
    let panelBuilt=false;
    document.getElementById('l2PanelBtn').onclick=()=>{ const pn=document.getElementById('l2panel');
      const on=pn.classList.toggle('on'); document.getElementById('l2PanelBtn').classList.toggle('on',on);
      if(on&&!panelBuilt){ panelBuilt=true;
        try{ buildL2Panel(pn); }catch(e){ pn.innerHTML='<div style="padding:10px;color:#f66">面板构建失败：'+(e.message||e)+'</div>'; } } };
    const buildL2Panel=(pn)=>{
      const pids=core._parameterIds||[], cids=core._partIds||[];   // 实测 wrapper 的自有数组（元素即名字符串）
      pn.innerHTML='<div class="pf"><input type="text" placeholder="过滤名称，如 cheek / hong / 脸红拼音…"></div>';
      const filter=pn.querySelector('.pf input');
      const mkSec=(title)=>{ const h=document.createElement('h5'); h.textContent=title; h.className='open';
        const g=document.createElement('div');
        h.onclick=()=>{ const o=g.style.display!=='none'; g.style.display=o?'none':''; h.classList.toggle('open',!o); };
        pn.append(h,g); return g; };
      const mkRow=(nm,min,max,def,get,set)=>{ const r=document.createElement('div'); r.className='prow'; r.dataset.nm=nm.toLowerCase();
        const n=document.createElement('span'); n.className='nm'; n.title=nm; n.textContent=nm;
        const s=document.createElement('input'); s.type='range'; s.min=min; s.max=max;
        s.step=Math.max(0.001,(max-min)/200); s.value=get();
        const v=document.createElement('span'); v.className='vl'; v.textContent=(+get()).toFixed(2);
        const b=document.createElement('button'); b.textContent='↺'; b.title='复位默认 ('+def+')';
        s.oninput=()=>{ set(+s.value); v.textContent=(+s.value).toFixed(2); };
        b.onclick=()=>{ s.value=def; set(+def); v.textContent=(+def).toFixed(2); };
        r.append(n,s,v,b); return r; };
      const gp=mkSec('参数 '+core.getParameterCount());
      for(let i=0;i<core.getParameterCount();i++){ const nm=idName(pids[i])||('Param'+i);
        gp.append(mkRow(nm, core.getParameterMinimumValue(i), core.getParameterMaximumValue(i), core.getParameterDefaultValue(i),
          ()=>core.getParameterValueByIndex(i), x=>core.setParameterValueByIndex(i,x))); }
      const gc=mkSec('部件 '+core.getPartCount());
      for(let i=0;i<core.getPartCount();i++){ const nm=idName(cids[i])||('Part'+i);
        gc.append(mkRow(nm, 0, 1, 1, ()=>core.getPartOpacityByIndex(i), x=>core.setPartOpacityByIndex(i,x))); }
      filter.oninput=()=>{ const q=filter.value.trim().toLowerCase();
        pn.querySelectorAll('.prow').forEach(r=>{ r.style.display=(!q||r.dataset.nm.includes(q))?'':'none'; }); };
    };
    const clampPan=()=>{ const cw=wrap.clientWidth||1, ch=wrap.clientHeight||1;
      const lim=Math.max(cw,ch)*0.6;
      ox=Math.max(-lim,Math.min(lim,ox)); oy=Math.max(-lim,Math.min(lim,oy)); };
    let dragging=false,px=0,py=0,moved=0;
    const onDown=e=>{ if(e.button!==0) return; dragging=true; moved=0; px=e.clientX; py=e.clientY; };
    const onMove=e=>{ if(!dragging)return; const dx=e.clientX-px,dy=e.clientY-py; moved+=Math.abs(dx)+Math.abs(dy);
      ox+=dx; oy+=dy; px=e.clientX; py=e.clientY; clampPan(); apply(); };
    const onUp=e=>{ if(!dragging) return; dragging=false; if(moved>=6||e.button!==0){ vm.touch(); return; }
      const r=wrap.getBoundingClientRect();
      const lp=mdl.toLocal(new PIXI.Point(e.clientX-r.left, e.clientY-r.top));
      const pv=P2V(lp.x/ppu, lp.y/ppu);
      const name=hitAt(pv.x, pv.y);
      const g = name && (groups.includes(name) ? name : groups.find(x=>x.toLowerCase()===name.toLowerCase())) || (name?null:fallbackG);
      if(!g) return;
      if(play(g)){ sel.value=g; const pill=document.getElementById('l2Hit');
        if(pill) pill.textContent=(name?'部位 '+name+' → ':'')+g; } };
    const onCancel=()=>{ dragging=false; };
    /* 缩放必须按住 Ctrl(或 ⌘/Alt)：裸滚轮要留给页面滚动。
       之前裸滚轮被 preventDefault 劫持，用户浏览列表时鼠标经过模型就会一路放大到 12 倍并累积偏移，
       看起来像「模型乱动/位置不对」 */
    const onWheel=e=>{ if(!(e.ctrlKey||e.metaKey||e.altKey)) return;
      e.preventDefault();
      const r=wrap.getBoundingClientRect(), mx=e.clientX-r.left, myy=e.clientY-r.top;
      const s0=baseK*z, s1=baseK*Math.min(12, Math.max(0.2, z*(e.deltaY>0?0.9:1.111)));
      const tx=mx-(mx-mdl.x)*(s1/s0), ty=myy-(myy-mdl.y)*(s1/s0);
      z=s1/baseK; apply(); ox+=tx-mdl.x; oy+=ty-mdl.y; clampPan(); apply(); vm.touch(); };
    const onDbl=()=>resetFraming();
    wrap.addEventListener('wheel',onWheel,{passive:false});
    wrap.addEventListener('pointerdown',onDown);
    wrap.addEventListener('dblclick',onDbl);
    wrap.addEventListener('pointercancel',onCancel);
    window.addEventListener('pointercancel',onCancel);
    window.addEventListener('blur',onCancel);
    window.addEventListener('pointermove',onMove);
    window.addEventListener('pointerup',onUp);
    my.off=()=>{ stopSkinVoice(); ro.disconnect(); wrap.removeEventListener('wheel',onWheel);
      wrap.removeEventListener('pointerdown',onDown); wrap.removeEventListener('dblclick',onDbl);
      wrap.removeEventListener('pointercancel',onCancel);
      window.removeEventListener('pointercancel',onCancel); window.removeEventListener('blur',onCancel);
      window.removeEventListener('pointermove',onMove); window.removeEventListener('pointerup',onUp); };
    const def=idleGroup;
    if(sel.value!==def) sel.value=def||'';
    /* 语音表回填之前先别开播：否则模型刚就绪那一瞬播的动作（含 idle）拿不到 Sound，
       表现成「第一个动作没声音，之后才有」。表是本地小文件，通常几毫秒就到。
       台词正文要一起等：只等到语音表会出现「有声没字幕」的第一下。 */
    Promise.all([loadVoiceMap(), loadWords()]).then(()=>{ if(my.cancelled||seq!==_l2seq) return;
      if(!played.size && !(mm.state&&mm.state.currentGroup)) play(def); });
    /* 循环与「播完回 idle」全部交给运行时（见上方补丁 ①②），前端不再挂任何定时器 */
  }catch(e){ if(my.cancelled||seq!==_l2seq)return;
    viewEl.innerHTML=`<div class="note">Live2D 加载失败：${e&&(e.stack||e.message||e)}</div>`; return; }
}

/* ---------- Spine 引擎（复用 spine-all.js，单皮肤加载） ---------- */
let spState = null; // {cancelled, raf}
function stopSpine(){ if(spState){ spState.cancelled=true; if(spState.raf)cancelAnimationFrame(spState.raf); spState=null; } }
async function startSpine(s, sk){
  const info=sk.spine||{}; const folder=info.folder||sk.key; const parts=(info.parts&&info.parts.length)?info.parts:[folder];
  const base=P+'Spine_v2/'+folder+'/';
  stopSpine();
  const my={cancelled:false, raf:0}; spState=my;
  try{
    viewEl.innerHTML='<div id="spcwrap"></div>';
    const wrap=document.getElementById('spcwrap'); wrap.style.cssText='position:absolute;inset:0';
    const cv=document.createElement('canvas'); cv.style.cssText='width:100%;height:100%;display:block;cursor:grab'; wrap.appendChild(cv);
    const bar=document.createElement('div'); bar.className='spine-bar'; wrap.appendChild(bar);
    const glctx=new spine.webgl.ManagedWebGLRenderingContext(cv,{alpha:true,premultipliedAlpha:true});
    const scene=new spine.webgl.SceneRenderer(cv,glctx,false);
    const gl=glctx.gl; gl.clearColor(0,0,0,0); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);

    async function loadPart(pn,cfg){
      const skelR=await fetch(base+pn+'.skel'); if(!skelR.ok)throw new Error('skel '+pn+' 404');
      const bytes=new Uint8Array(await skelR.arrayBuffer());
      const atlasR=await fetch(base+pn+'.atlas'); if(!atlasR.ok)throw new Error('atlas '+pn+' 404');
      const atlasTxt=await atlasR.text();
      const pageNames=[];for(const ln of atlasTxt.split('\n')){const t=(ln||'').replace(/\r$/,'');if(/^[A-Za-z0-9_].*\.(png|jpg)$/i.test(t)&&!ln.startsWith(' ')&&!ln.startsWith('\t')&&!t.includes(':'))pageNames.push(t);}
      const textures={};
      for(const pgn of pageNames){const img=new Image();img.crossOrigin='anonymous';await new Promise((rs,rj)=>{img.onload=rs;img.onerror=()=>rj(new Error('tex '+pgn));img.src=base+pgn;});textures[pgn]=new spine.webgl.GLTexture(glctx,img,false);}
      const texLoader=path=>{for(const q in textures){if(q===path||(''+path).endsWith(q)||q.endsWith(''+path))return textures[q];}return textures[pageNames[0]];};
      const atlas=new spine.TextureAtlas(atlasTxt,texLoader);
      const ofind=atlas.findRegion.bind(atlas); atlas.findRegion=n=>{let r=ofind(n);if(r)return r;const t=(''+n).trim();return t!==n?ofind(t):r;};
      let data;
      if(bytes[0]===0x7B){ data=new spine.SkeletonJson(new spine.AtlasAttachmentLoader(atlas)).readSkeletonData(new TextDecoder().decode(bytes)); }
      else { data=new spine.SkeletonBinary(new spine.AtlasAttachmentLoader(atlas)).readSkeletonData(bytes); }
      /* ⚠️ 必须选 skin：spine-ts 3.8 里动画的附件时间线经 `Skeleton.setAttachment`
         → `当前 skin.getAttachment(slotIndex, name)` 解析，不设 skin 时命名 skin 独有的
         附件一律解析成 null → 整块部件不显示（2026-09-26 用户报阿罗芒什缺下半身即此）。
         全库 331 个 part 里 4 个受影响（yunlong_2 +69 槽 / feiteliedadi_5 +52 / 阿罗芒什 +47 /
         月城 II_4 +14）。选法：取「推进若干动画后曾挂上附件的槽位数」最多的那个 skin——
         数据驱动，不写按角色名的例外表。代价约 100~300ms，只在打开时算一次。 */
      const skinNames=(data.skins||[]).map(k=>k.name);
      const coverOf=(sk)=>{ const ever=new Set();
        const an=(data.animations||[]).map(a=>a&&a.name).filter(Boolean).slice(0,6);
        const asd=new spine.AnimationStateData(data);
        for(const n of (an.length?an:[null])){ const t2=new spine.Skeleton(data); const st=new spine.AnimationState(asd);
          try{ if(sk!==null) t2.setSkin(data.findSkin(sk));
            t2.setSlotsToSetupPose(); t2.setBonesToSetupPose();
            if(n) st.setAnimation(0,n,true);
            for(const dt of [0.05,0.5,2.0]){ st.update(dt); st.apply(t2);
              for(const sl of t2.slots) if(sl.getAttachment()) ever.add(sl.data.name); } }catch(e){} }
        return ever.size; };
      let bestSkin=null, bestCov=coverOf(null);
      for(const k of skinNames){ const c=coverOf(k); if(c>bestCov){ bestCov=c; bestSkin=k; } }

      const skeleton=new spine.Skeleton(data);
      if(bestSkin!==null) skeleton.setSkin(data.findSkin(bestSkin));
      skeleton.setSlotsToSetupPose(); skeleton.setBonesToSetupPose();
      /* 各层 localScale 照 prefab 写（§58）。只有**层间不一致**才真的改变画面（全库 5 个目录），
         整目录统一缩放会被 fit() 的取景归一化吃掉。必须在 updateWorldTransform 之前设 ——
         根骨骼那条分支才乘 skeleton.scaleX/Y。 */
      if(cfg&&cfg.localScale){ skeleton.scaleX=cfg.localScale[0]||1; skeleton.scaleY=cfg.localScale[1]||1; }
      skeleton.updateWorldTransform();
      const anim=new spine.AnimationState(new spine.AnimationStateData(data));
      const anims=(data.animations||[]).filter(a=>a.duration>0.01).map(a=>({name:a.name||a,dur:+a.duration.toFixed(1)}));
      return {skeleton,anim,data,anims,skinNames,skin:bestSkin,cov:bestCov,
              startAnim:(cfg&&cfg.startingAnimation)||''};
    }

    /* 分层的权威清单只有一份：`Spine_v2/<目录>/parts.json`（extract_spine_v2.py 从 prefab 落盘）。
       拿不到就报错，**绝不回落到"目录里有哪些 .skel"** —— 那个 glob 正是把本体与和谐版
       叠在一起画、造出 15 对逐像素相同 CG 的根因（docs/TROUBLESHOOTING.md §58）。 */
    const pcfg={};
    {const r=await fetch(base+'parts.json');
     if(!r.ok) throw new Error('缺 parts.json（先跑 py -3 scripts/extract_spine_v2.py --parts-only 补）');
     for(const l of ((await r.json()).layers||[])) pcfg[l.layer]=l;}
    const layers=[]; let loadFail=0;
    for(const pn of parts){ try{ layers.push(await loadPart(pn,pcfg[pn])); if(my.cancelled)return; }catch(e){ loadFail++; console.warn('part fail',pn,e); } }
    if(!layers.length)throw new Error('部件加载失败（'+parts.join(',')+'）');

    let camX=0,camY=0,zoom=1,base1=1,playing=true,last=performance.now();
    /* 视角记忆：camX/camY 是世界坐标、zoom 无量纲 ⇒ 天然与画布尺寸无关，直接原样存 */
    const vkey=sk.key+'|spine';
    const vm=vmemCommitter(vkey, ()=>({camX:+camX.toFixed(2), camY:+camY.toFixed(2), zoom:+zoom.toFixed(4)}));
    curVM=vm;
    function resize(){ cv.width=wrap.clientWidth; cv.height=wrap.clientHeight; scene.resize();
      scene.camera.setViewport(cv.width, cv.height); }  // 关键：scene.resize() 不更新相机视口（比例怪的根因）
    /* ---------- 取景判据：附件"乘完 slot 颜色后有没有落下非近黑的笔" ----------
       两类巨幕会把包围盒撑到可见内容的 2~10 倍（弹窗里画面缩成中间一小块）：
         ① setup alpha=0 的整屏闪黑/白场 —— 一个像素都不落（实测最大 32967×29970 单位），判 alpha 就够；
         ② **不透明的纯色板** —— 它真的在渲染，判 alpha 无效，只能读贴图算。
            且来源有两种：黑色贴图×白乘数（`1heidi`/`heimu`），以及**白色贴图 × rgb=0,0,0 乘数**
            （`yunlong_3` 的 `kkkkk*`，只看贴图 lum=255，完全不像黑底）⇒ 必须乘完颜色再统计。
       判据 = 区域纹素 × slot 颜色后，"落笔里 max(r,g,b)>40 的占比" ≥0.05。
       阈值与影响面的全库取证见 docs/TROUBLESHOOTING.md §45/§46（12 个对照皮肤零误伤）。
       ⚠️ 读 `slot.data.color`（setup 色）不是 `slot.color`（当前色）：后者被动画时间线改写，
       用它会让用户按「复位」时取景框随动画时刻跳。
       ⚠️ 只测"贴着当前包围盒某条边"的附件（不贴边的撑不大了框），从外向里剥 ≤6 轮：
       逐个附件全算实测 300~1000ms/part，弹窗里不可接受。
       ❌ 不要改成"首帧 readPixels 求非透明像素包围盒"（CG 导出层的做法）：弹窗里动画从第一帧就在跑、
       页纹理又是首次 draw 才上传，读回来是"局部已就绪"的渲染 —— 实测把 mojiaduoer_5 放大成
       一屏模糊色块。CG 层能用是因为它渲静止姿态且 draw 后显式 sleep 等 GPU。 */
    const inkCache=new Map(), inkCv={c:null,ctx:null};
    function inksOf(a,col){ const reg=a.region; if(!reg||!reg.page)return true;
      const key=reg.page.name+'|'+reg.name+'|'+(reg.index||0)+'|'+col.r+','+col.g+','+col.b+','+col.a;
      const seen=inkCache.get(key); if(seen!==undefined)return seen;
      let hit=true;
      try{ const pg=reg.page, img=pg.texture&&(pg.texture.image||(pg.texture.getImage&&pg.texture.getImage()));
        let sw=reg.width, sh=reg.height;
        if(pg.texture&&pg.texture.getImage&&!img)throw new Error('no img');
        if(reg.degrees===90||reg.rotate){const t=sw;sw=sh;sh=t;}   // 旋转区域打包矩形里宽高互换
        if(img&&img.width&&sw>0&&sh>0){
          const n=Math.min(48,Math.max(4,sw)), m=Math.min(48,Math.max(4,sh));
          if(!inkCv.ctx){inkCv.c=document.createElement('canvas');inkCv.c.width=48;inkCv.c.height=48;
                         inkCv.ctx=inkCv.c.getContext('2d',{willReadFrequently:true});}
          inkCv.ctx.clearRect(0,0,48,48);
          inkCv.ctx.drawImage(img,reg.x,reg.y,sw,sh,0,0,n,m);
          const px=inkCv.ctx.getImageData(0,0,n,m).data;
          let inked=0,nb=0;
          for(let i=0;i<n*m;i++){ const o=i*4;
            if(px[o+3]*col.a<=8)continue; inked++;
            if(Math.max(px[o]*col.r,px[o+1]*col.g,px[o+2]*col.b)>40)nb++; }
          hit=inked>0 && (nb/inked)>=0.05;
        }
      }catch(e){}   // 读不到贴图就按"有内容"算：宁可取景保守，也不要裁掉画面
      inkCache.set(key,hit); return hit; }
    function extents(L){ const arr=[];
      for(const slot of L.skeleton.slots){ const a=slot.getAttachment(); if(!a||!slot.bone||!slot.bone.active)continue;
        const col=(slot.data&&slot.data.color)||{r:1,g:1,b:1,a:1};
        if(col.a<=0.001)continue;
        let v,c;
        try{ if(a instanceof spine.RegionAttachment){ v=spine.Utils.newFloatArray(8); c=8; a.computeWorldVertices(slot.bone,v,0,2); }
          else if(a instanceof spine.MeshAttachment&&a.worldVerticesLength){ c=a.worldVerticesLength; v=spine.Utils.newFloatArray(c); a.computeWorldVertices(slot,0,c,v,0,2); }
          else continue; }catch(e){continue;}
        let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
        for(let j=0;j<c;j+=2){ if(v[j]<x0)x0=v[j]; if(v[j]>x1)x1=v[j]; if(v[j+1]<y0)y0=v[j+1]; if(v[j+1]>y1)y1=v[j+1]; }
        if(x1<x0||y1<y0)continue;
        arr.push({a,col,r:[x0,y0,x1,y1]});
      } return arr; }
    let frameBox=null;
    function computeFrameBox(){ let cur=[]; layers.forEach(L=>{ try{ cur=cur.concat(extents(L)); }catch(e){} });
      const union=(list)=>{ if(!list.length)return null; const r=[1e9,1e9,-1e9,-1e9];
        for(const e of list){ if(e.r[0]<r[0])r[0]=e.r[0]; if(e.r[1]<r[1])r[1]=e.r[1];
                              if(e.r[2]>r[2])r[2]=e.r[2]; if(e.r[3]>r[3])r[3]=e.r[3]; } return r; };
      let box=union(cur);
      for(let round=0;round<6&&box;round++){ const w=box[2]-box[0], h=box[3]-box[1], T=Math.max(w,h)*0.02;
        const kill=new Set(cur.filter(e=> (e.r[0]<=box[0]+T||e.r[1]<=box[1]+T||e.r[2]>=box[2]-T||e.r[3]>=box[3]-T)
                                          && !inksOf(e.a,e.col)));
        if(!kill.size)break;
        const rest=cur.filter(e=>!kill.has(e)), nb=union(rest);
        if(!nb)break;                       // 全剥光就保留上一轮的框（实测 yunlong_3 会走到这里）
        cur=rest; box=nb; }
      frameBox=box; }
    /* SPINE_PAD：取景留白。原为 1.1（画面四周各空 5%，实测内容只占视口高 65%），
       收紧到 1.05 —— 再小就会在部件贴边时看着挤，且「复位 / 滚轮」都还在。 */
    const SPINE_PAD=1.05;
    function fit(){ if(!frameBox){ base1=1; return; }
      camX=(frameBox[0]+frameBox[2])/2; camY=(frameBox[1]+frameBox[3])/2;
      base1=Math.min(cv.width/((frameBox[2]-frameBox[0])*SPINE_PAD), cv.height/((frameBox[3]-frameBox[1])*SPINE_PAD)); }
    resize();
    // 动画：取各层「有时长」动画名并集（空占位 0 秒动画已过滤）
    const animUnion=[]; layers.forEach(L=>L.anims.forEach(a=>{if(animUnion.indexOf(a.name)<0)animUnion.push(a.name);}));
    bar.innerHTML=`<label>动画</label><select id="spAnim"></select><label id="spSkinLbl" style="display:none">皮肤</label><select id="spSkin" style="display:none"></select><button id="spPlay">暂停</button><button id="spFit">复位</button><button id="spFull">全屏</button><span class="pill">${layers.length} 层部件${loadFail?' · '+loadFail+' 层失败':''}</span><span class="pill">滚轮缩放 · 拖拽平移</span>`;
    document.getElementById('spFull').onclick=()=>{ if(document.fullscreenElement) document.exitFullscreen(); else viewEl.requestFullscreen().catch(()=>{}); };
    document.addEventListener('fullscreenchange', resize);
    const sel=document.getElementById('spAnim');
    (animUnion.length?animUnion:['']).forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n||'(setup pose)';sel.appendChild(o);});
    function setAnim(n){ layers.forEach(L=>{ try{
        if(n && L.anims.some(a=>a.name===n)) L.anim.setAnimation(0,n,true);
        else if(L.anims.some(a=>a.name==='normal')) L.anim.setAnimation(0,'normal',true);
      }catch(e){} }); }
    /* 默认起播按 prefab **逐层**写的 startingAnimation（§58：buleisite/buleisite_hx=idle、
       pulimaosi 两层各播各的 idle2/normal），不再一律优先 'normal'。
       下拉框仍是「选一个、全层跟」的简单语义 —— 用户手动改时覆盖 prefab 的写法。 */
    const firstStart=layers.map(L=>L.startAnim).find(n=>n&&animUnion.indexOf(n)>=0)||'';
    const def=firstStart||(animUnion.indexOf('normal')>=0?'normal':animUnion[0]);
    layers.forEach(L=>{ const n=(L.startAnim&&L.anims.some(a=>a.name===L.startAnim))?L.startAnim:def;
                        if(n){ try{ L.anim.setAnimation(0,n,true); }catch(e){} } });
    sel.value=def||'';
    sel.onchange=()=>setAnim(sel.value);
    /* skin 下拉：默认用上面算出的覆盖最多者，允许手动切着对比
       （'1'/'2' 是不同变体，覆盖数可能相同——阿罗芒什就是 201 vs 201 平手，需人工判） */
    const skinUnion=[]; layers.forEach(L=>(L.skinNames||[]).forEach(k=>{if(skinUnion.indexOf(k)<0)skinUnion.push(k);}));
    const ssk=document.getElementById('spSkin'), sskLbl=document.getElementById('spSkinLbl');
    const setLayerSkin=(L,name)=>{ try{
        L.skeleton.setSkin(name===null?null:L.data.findSkin(name));
        L.skeleton.setSlotsToSetupPose(); L.skeleton.setBonesToSetupPose(); L.skin=name; }catch(e){} };
    if(skinUnion.length){
      const mk=(v,txt)=>{const o=document.createElement('option');o.value=v;o.textContent=txt;ssk.appendChild(o);};
      mk('\u2205','(不设 skin)');
      skinUnion.forEach(k=>mk(k, k+(layers.every(L=>L.skin!==k)?'':(layers.some(L=>L.skin===k)?' ✓':''))));
      ssk.value=layers.find(L=>L.skin)?.skin ?? '\u2205';
      sskLbl.style.display=''; ssk.style.display='';
      ssk.onchange=()=>{ const v=ssk.value;
        layers.forEach(L=>{ if(v==='\u2205') setLayerSkin(L,null);
                            else if((L.skinNames||[]).indexOf(v)>=0) setLayerSkin(L,v); });
        computeFrameBox();   // 换 skin 会换附件集合，取景框要重算
        fit(); };
    }
    document.getElementById('spPlay').onclick=e=>{playing=!playing;e.target.textContent=playing?'暂停':'播放';};
    document.getElementById('spFit').onclick=()=>{fit();zoom=1;vm.touch();};
    mountSkinVoice(bar, cv, ()=>sk.key);   // Spine 动态立绘同样点画面=触摸台词
    let drag=false,pmx=0,pmy=0;
    cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.05,Math.min(60,zoom*(e.deltaY>0?.9:1.1)));vm.touch();},{passive:false});
    cv.addEventListener('mousedown',e=>{drag=true;pmx=e.clientX;pmy=e.clientY;cv.style.cursor='grabbing';});
    const mm=e=>{if(!drag)return;camX-=(e.clientX-pmx)/(base1*zoom);camY+=(e.clientY-pmy)/(base1*zoom);pmx=e.clientX;pmy=e.clientY;};
    const mu=()=>{ if(!drag) return; drag=false; cv.style.cursor='grab'; vm.touch(); };
    window.addEventListener('mousemove',mm); window.addEventListener('mouseup',mu); window.addEventListener('resize',resize);
    function frame(now){ if(my.cancelled){window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);return;} my.raf=requestAnimationFrame(frame);
      const dt=Math.min((now-last)/1000,.1);last=now;
      if(playing)layers.forEach(L=>{L.anim.update(dt);L.anim.apply(L.skeleton);L.skeleton.updateWorldTransform();});
      gl.clear(gl.COLOR_BUFFER_BIT); scene.camera.position.set(camX,camY,0); scene.camera.zoom=1/(base1*zoom); scene.camera.update(); scene.begin();
      layers.forEach(L=>scene.drawSkeleton(L.skeleton,true)); scene.end(); }
    computeFrameBox(); fit();
    (function(){ const m=vmemGet(vkey);   // 回到上次看这个皮肤时的机位（世界坐标，换窗口尺寸不错位）
      if(m && isFinite(m.camX) && isFinite(m.camY))
        { camX=m.camX; camY=m.camY; zoom=Math.max(.05, Math.min(60, m.zoom||1)); } })();
    my.raf=requestAnimationFrame(frame);
  }catch(err){ if(my.cancelled)return; viewEl.innerHTML='<div class="note">Spine 加载失败：'+(err.message||err)+'<br><span class="hint">'+(location.protocol==='file:'?'请用 启动资产浏览器.bat 以本地服务器方式打开。':'请确认该皮肤已导出 Spine 资源。')+'</span></div>'; }
}
