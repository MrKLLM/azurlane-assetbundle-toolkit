<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>碧蓝航线资产浏览器 · Azur Lane Asset Browser</title>
<script>/* 先定主题再渲染，否则刷新会闪一下默认色 */try{document.documentElement.dataset.theme=localStorage.getItem('gallery.theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
<style>
@import 'theme.css';
*{margin:0;padding:0;box-sizing:border-box}
/* 主题切换时给配色加过渡：只在 .theming 期间生效，平时不干扰下面的 hover 弹性 */
html.theming *{transition:background-color var(--t-col),color var(--t-col),
  border-color var(--t-col),box-shadow var(--t-col) !important}
body{font-family:'Segoe UI',"Microsoft YaHei",system-ui,sans-serif;color:var(--txt);height:100vh;
  display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed}
/* 顶栏不再铺连续色板：只保留轻微背景折射感，控件各自承载玻璃面，空白处让画面透出。
   页头禁止额外挂「厚边墙」：照片暗部会被抬亮成一条杠（§138）；折射盒数也不在此增加。 */
header{background:transparent;
  backdrop-filter:none;-webkit-backdrop-filter:none;
  border:0;padding:9px 14px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  box-shadow:none;position:relative;z-index:10}
header::after{content:none}
/* ⚠️ 这里**绝不能给 header 的直接子元素设 z-index**：一设就各自生成层叠上下文，
   下拉面板那个 z-index:40 就被关在自己那个 .ctl 里出不来，于是排在后面的提示文字
   会压在展开的面板上（用户截图里的"混在一起了"就是这个）。
   position:relative 单独用是安全的（z-index:auto 不生成层叠上下文）。 */
header>*{position:relative}
header h1{font-size:16px;color:var(--title);white-space:nowrap;font-weight:800;letter-spacing:.02em}
header .sub{font-size:11px;color:var(--dim)}
.ctl{display:flex;align-items:center;gap:6px}
.ctl label{font-size:11px;color:var(--brand-d);font-weight:750;letter-spacing:.06em;
  padding:3px 5px;border-radius:7px;background:transparent;text-shadow:0 1px 3px color-mix(in srgb,var(--panel) 72%,transparent)}
/* 顶栏筛选行名用纯字形 + 品牌色与晕影，避免在透明玻璃上再叠一块小贴纸；
   可点项则保留各自半透胶囊面，层级靠形状与材质区分。 */

/* ── 自绘下拉 ──────────────────────────────────────────────────────────
   原生 <select> 展开的那层是**操作系统画的**，CSS 一行都碰不到 ⇒ 想要"落下来"
   的动效只能自己画。做法：原生 select 留在 DOM 里当数据源与状态（只缩成 1px 透明、
   不参与交互），所以 apply() 与它的 change 监听**一行都不用改**；外面套一个
   真按钮 + 绝对定位的面板，选中时回写 select.value 并 dispatch change。 */
.dd{position:relative;display:inline-block}
.dd>select{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;margin:0}
.dd-btn{display:inline-flex;align-items:center;gap:10px;justify-content:space-between;min-width:106px;
  background:color-mix(in srgb,var(--panel) 56%,transparent);color:var(--txt);
  border:1px solid color-mix(in srgb,var(--glass-line) 78%,transparent);padding:6px 12px;
  border-radius:var(--r-chip);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  box-shadow:inset 0 1px 0 var(--rim-hi),var(--sh1);
  transition:border-color .16s var(--spring),box-shadow .16s,background .16s}
.dd-btn:hover{border-color:var(--glass-line);background:color-mix(in srgb,var(--panel) 72%,transparent)}
.dd-btn:focus-visible{outline:none;border-color:var(--brand);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.dd-btn[aria-expanded=true]{border-color:var(--on-ring);background:var(--on-bg);
  box-shadow:inset 0 0 0 1px var(--on-ring),var(--sh1)}
.dd-arw{font-style:normal;font-size:9px;color:var(--dim);transition:transform .24s var(--spring)}
.dd-btn[aria-expanded=true] .dd-arw{transform:rotate(180deg)}
.dd-panel{position:absolute;top:calc(100% + 6px);left:0;z-index:40;min-width:100%;width:max-content;
  max-width:min(330px,72vw);max-height:56vh;overflow:auto;padding:5px;display:none;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh3)}
/* 面板整体"落下并坐定"（overshoot），条目再逐条错开 12ms —— 这两层叠加才像掉下来的 */
.dd.open .dd-panel{display:block;animation:ddrop .26s var(--spring)}
@keyframes ddrop{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}
.dd-opt{display:flex;justify-content:space-between;gap:12px;padding:6px 11px;border-radius:9px;
  font-size:13px;color:var(--txt2);font-weight:600;cursor:pointer;white-space:nowrap;
  animation:ddin .2s ease-out backwards;animation-delay:calc(min(var(--i,0),14)*12ms)}
@keyframes ddin{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.dd-opt:hover,.dd-opt.cur{background:var(--brand-l);color:var(--brand-d)}
.dd-opt .n{color:var(--dim);font-weight:700}
.dd-opt:hover .n{color:var(--brand-d)}
input[type=text],select{background:color-mix(in srgb,var(--panel) 56%,transparent);color:var(--txt);
  border:1px solid color-mix(in srgb,var(--glass-line) 78%,transparent);
  padding:6px 12px;border-radius:var(--r-chip);font-size:13px;outline:none;font-weight:600;
  box-shadow:inset 0 1px 0 var(--rim-hi),var(--sh1);
  transition:border-color .16s var(--spring),box-shadow .16s,background .16s}
input[type=text]:hover,select:hover{border-color:var(--brand);background:color-mix(in srgb,var(--panel) 72%,transparent)}
input[type=text]:focus,select:focus{border-color:var(--brand);background:color-mix(in srgb,var(--panel) 78%,transparent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent),inset 0 1px 0 var(--rim-hi)}
#search{width:190px;flex:none;transition:width .28s var(--spring-slow),border-color .16s var(--spring),
  box-shadow .16s,background .16s}
#search:focus{width:270px}
.grow{flex:1}
.hint{font-size:11px;color:var(--dim);font-weight:600}
.hint b{color:var(--brand-d)}
/* 底部那条 76px 空带**已按用户要求去掉**（2026-09-28）：卡片改成半透明面板"悬空"在
   海面上，背景从每张卡的底下透出来，不再需要专门空一条没人看的带子。
   padding-bottom 只留 22px 给最后一行喘口气（它跟着内容滚，不是常驻条）。 */
main{flex:1;overflow:auto;padding:16px 16px 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(154px,1fr));gap:14px}
/* 卡片：入场逐张弹起（--i 由 JS 给，超过 24 号不再排队，避免千张卡排到天荒地老）
   ⚠️ 术语纠正（2026-09-28 用户点名）：**毛玻璃 ≠ 玻璃拟态**。我上一版做的是"磨砂白卡"
   （半透明白 + 14px 背景模糊），那东西看着像蒙了层雾，不是玻璃。玻璃拟态的识别特征是：
     ① 面板**几乎全透**（白天只留 13% 白），背后的海直接看得见；
     ② 上沿一道**镜面亮边**（inset 高光），加一圈更厚的"边墙"去折射背后（::before）；
     ③ 一道**常驻的斜向反光**（::after）。
        ⚠️ 原来这里做的是"跟着鼠标跑的高光"，用户 2026-09-29 否掉：
        "不要鼠标发光这个效果" —— 反光是材质自带的，不是一团跟着光标走的光晕。
   原来那圈 1.5px 灰色边框按用户要求去掉：灰边在玻璃上就是"塑料盒"的来源。
     · **跟随鼠标倾斜**：上一版我量到幅度只有 1.4°/1.8°、肉眼约等于零，就把整条删了——
       判错了，用户要的是"看得见"，不是"不要"。现在 ±11°/±9°，perspective 收到 760px。
       倾斜量走 CSS 变量而不是内联 transform：内联会盖掉 :hover/:active 两条规则。
     · 悬停仍然是「描边点亮 + 外圈柔光 + 上浮 + 缩略图微放大」，**不再有名条/动作条**
       （用户：舰名不需要显示两遍 → 直接去掉那条，舰名只在下方出现一次）。 */
.card{position:relative;background:var(--card-bg);border:1px solid var(--glass-line);
  border-radius:var(--r-card);overflow:hidden;cursor:pointer;
  /* 四层：外投影给"浮起来"的深度 + 上沿镜面亮边 + 一圈内侧柔光（玻璃的"体"）+
     下沿一抹厚度色。玻璃是**有厚度的透明体**，这三条 inset 就是那个厚度。 */
  box-shadow:var(--sh2), inset 0 1px 0 var(--rim-hi),
             inset 0 0 30px color-mix(in srgb,var(--panel) 30%,transparent),
             inset 0 -20px 34px color-mix(in srgb,var(--brand) 7%,transparent);
  display:flex;flex-direction:column;
  --rx:0deg;--ry:0deg;--lift:0px;--sc:1;
  /* ⚠️ **静止时不给 .card 挂 transform**（2026-10-14 改，判据见 docs/TROUBLESHOOTING.md §143 补十一）：
     挂在 `.card` 上等于给全屏 1021 张卡各一个**非恒等 3D transform**，也就是合成器 property tree
     上的 1021 个节点。改任何一个 transform 都要触发一次完整提交，而这次提交得挨个过这 1021 个节点
     ⇒ 实测单次约 13~27ms（真机划鼠标 23.4ms，其中这一条占 +13.4ms）。
     ⇒ 挪到 `:hover/:active/:focus-visible` 上：静止全页 0 个 transform 节点，悬停时只有 1 个。
     实测真机划鼠标 23.4ms → **10.0ms**（42.7 → 100fps），**倾斜/缓动/缩略图放大全部保留**。
     ⚠️ `isolation:isolate` 是**必需的**：原来那个 transform 顺带给卡片提供了层叠上下文，
        拿掉后 `.card::after{z-index:5}`（斜向反光）会跑到相邻卡片上面去。
     ⚠️ 别改成 `will-change:transform` 去"提升合成层"——那只会让节点更多，实测更糟（§143 补六/补九）。 */
  isolation:isolate;
  transition:transform .14s ease-out,box-shadow .24s var(--spring-slow),border-color .18s ease-out;
  animation:pop .34s var(--spring) backwards;animation-delay:calc(min(var(--i,0),24)*16ms)}
/* 跟手倾斜 + 悬停抬起：只在"真的在跟指针互动"时才挂 transform（见上面那条注释）。
   `:focus-visible` 也要带上，否则键盘导航时卡片不再抬起（那是 §6.18 第 ④ 条补的反馈）。 */
.card:hover,.card:active,.card:focus-visible{
  transform:perspective(620px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(var(--lift)) scale(var(--sc))}
/* 边墙：**卡片上不再挂任何 backdrop-filter**（2026-10-11 定，判据与八态对照表见 docs/TROUBLESHOOTING.md §136）。
   原来这一圈是 ::before 挂 blur，再用两层 mask 做 exclude 只留外圈 12px。它撞上一条浏览器行为：
   **卡片一旦真的转起来（rotateX/rotateY ≠ 0），Chrome 就把这层 mask 整个丢掉，模糊铺满整张卡**
   —— 静态转 8° 就够触发，与遮罩坐标怎么算、图元重不重叠、有没有并成一层遮罩都无关。
   ⇒ 以后要加回"厚边"，只能走**不依赖遮罩**的实现（内容内缩一圈当相框，让模糊只从没被盖住的带子露出来）；
      别再往会被旋转的盒子里接 mask + backdrop-filter 这一组合。
   ⚠️ 导航栏那条边墙不受影响：它自己从不被旋转，量出来一直是锐的。 */
/* ⚠️ 卡面**故意不做折射**（2026-10-11 用户看过实机否掉："卡面边缘还是不要折射的，看着脏脏的"）。
   根因不是参数：卡片四周 14px 缝隙外就是邻卡的高对比立绘，折射会把那些画面拽进这一圈，
   读起来是污渍而不是玻璃。折射只在"背后是滚动内容/天空"这种**低频背景**上才干净——
   所以下面 ②-b 只留给导航栏那条边墙。别把这条再往卡片上接。 */
/* ③ 反光：只留**常驻的那道斜向反光**（--spec2）。
   ⚠️ 原来这里还叠了一层"跟着鼠标跑的圆斑"（radial-gradient at var(--mx)/var(--my)），
   用户 2026-09-29 明确否掉："不要鼠标发光这个效果" —— 已删，JS 侧也不再写 --mx/--my。
   玻璃仍然有反光，但反光是材质自带的，不是一团跟着光标走的光晕。 */
.card::after{content:'';position:absolute;inset:0;z-index:5;pointer-events:none;
  background:var(--spec2)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
/* 发光用 box-shadow 两层（贴边描边环 + 扩散投影），不用 outline：outline 会被相邻卡片
   盖住，环在网格上会断。 */
/* 悬停：**不发光**（用户 2026-09-28 明确："划过卡片不用发光"）。
   反馈改成"玻璃被照亮"——描边转纯白高光、反光加强、投影换成中性并加深一点、抬 1px。
   ⚠️ 这条必须把静止态的三条 inset **一起重写**：box-shadow 是整属性替换，
   只写外投影就会把玻璃的厚度一起丢掉，悬停瞬间会塌成一张纸（探针的层数判据抓过）。 */
.card:hover{--lift:-5px;--sc:1.015;border-color:var(--rim-hi);
  box-shadow:var(--sh-float), inset 0 1px 0 var(--rim-hi),
             inset 0 0 34px color-mix(in srgb,var(--panel) 40%,transparent),
             inset 0 -20px 34px color-mix(in srgb,var(--brand) 10%,transparent)}
.card:active{--lift:-1px;--sc:.985;box-shadow:var(--sh1)}   /* 按下只压 1.5%，不回弹 */
/* 键盘走到卡片上给一圈**更实**的环（用 brand-d，浅色下也够对比）——
   这是 §6.18 第 ④ 条：以前键盘导航零可见反馈。 */
.card:focus{outline:none}
.card:focus-visible{--lift:-4px;border-color:var(--brand-d);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-d) 55%,transparent),
             0 12px 28px color-mix(in srgb,var(--brand) 32%,transparent),
             inset 0 1px 0 var(--rim-hi),
             inset 0 -20px 34px color-mix(in srgb,var(--brand) 9%,transparent)}
.card .thumb{aspect-ratio:3/4;background:transparent center/contain no-repeat;position:relative;overflow:hidden}
.card .thumb img{width:100%;height:100%;object-fit:contain;display:block;opacity:0;
  transition:transform .3s var(--spring-slow),opacity .3s ease-out}
.card .thumb img.ld{opacity:1}
.card:hover .thumb img,.card:focus-visible .thumb img{transform:scale(1.06)}
/* 文字区单独压一层淡底：面板全透之后，拼音/标签压在海上会读不清。
   玻璃拟态本来就是这么做的——**内容区有色调，装饰区透明**。 */
.card .body{padding:8px 10px 10px;background:linear-gradient(180deg,transparent,var(--body-tint) 42%)}
.card .nm{font-size:13px;font-weight:800;color:var(--txt);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .py{font-size:10px;color:var(--dim);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:9px;padding:2px 7px;border-radius:var(--r-chip);background:var(--rar-bg);
  background:color-mix(in srgb,var(--txt2) 8%,var(--panel));color:var(--txt2);border:1px solid var(--line);font-weight:700}
.tag.f{color:var(--brand-d)}.tag.s{color:var(--pop-d)}
.rar-海上传奇{color:var(--r0)}.rar-超稀有{color:var(--r1)}.rar-精锐{color:var(--r2)}.rar-稀有{color:var(--r3)}.rar-普通{color:var(--r4)}
.badge{position:absolute;top:7px;right:7px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.badge span{font-size:9px;padding:2px 7px;border-radius:var(--r-chip);font-weight:800;
  background:var(--panel);box-shadow:var(--sh1);border:1px solid var(--line)}
.b-spine{color:var(--ok-d)}.b-l2d{color:var(--pop-d)}.b-voice{color:var(--brand-d)}
.empty{color:var(--dim);text-align:center;padding:44px;font-size:14px;font-weight:600}

/* 分段控件：整颗胶囊，选中那颗由一粒会滚的胶囊承担（和弹层标签条同一套语言） */
.seg{display:inline-flex;gap:4px;background:color-mix(in srgb,var(--panel) 56%,transparent);
  border:1px solid color-mix(in srgb,var(--glass-line) 78%,transparent);
  border-radius:var(--r-chip);padding:3px;position:relative;box-shadow:var(--sh1)}
.seg>span.segslide{position:absolute;left:0;top:var(--y,3px);width:var(--w,0);height:var(--h,26px);
  border-radius:var(--r-chip);background:var(--on-bg);
  box-shadow:inset 0 0 0 1px var(--on-ring), var(--sh1);
  transform:translateX(var(--x,0));transition:transform .32s var(--spring),width .32s var(--spring);z-index:0}
.seg button{background:transparent;color:var(--dim);border:none;padding:5px 13px;font-size:12px;
  font-weight:700;border-radius:var(--r-chip);cursor:pointer;transition:all .18s var(--spring);position:relative;z-index:1}
.seg button:hover{color:var(--brand-d);background:color-mix(in srgb,var(--panel) 44%,transparent)}
.seg button.on{background:transparent;color:var(--on-txt)}
.seg button.on:hover{background:transparent;color:var(--on-txt)}
.sec-hd{font-size:15px;color:var(--txt);font-weight:800;margin:20px 4px 11px;display:flex;align-items:center;gap:9px}
.sec-hd:first-child{margin-top:2px}
.sec-hd .n{color:#fff;font-weight:800;font-size:11px;background:var(--grad-brand);
  border-radius:var(--r-chip);padding:1px 9px;box-shadow:var(--sh1)}
.sec-hd::before{content:'';width:10px;height:10px;background:var(--grad-pop);border-radius:50%;box-shadow:var(--sh1)}
.sec-hd.story::before{background:var(--grad-brand)}

/* modal */
.mask{position:fixed;inset:0;background:var(--mask);backdrop-filter:blur(3px);
  display:none;align-items:stretch;justify-content:center;z-index:50}
.mask.on{display:flex}
/* 弹层入场：从 96% 弹到位 + 淡入；关闭时缩回去（.closing 由 JS 加，动画跑完再真关） */
.modal{background:var(--panel);width:min(1900px,96vw);height:min(1400px,96vh);border-radius:var(--r-panel);
  border:1px solid var(--line);display:flex;overflow:hidden;box-shadow:var(--sh3);
  animation:zoomin .28s var(--spring)}
@keyframes zoomin{from{opacity:0;transform:scale(.955) translateY(14px)}to{opacity:1;transform:none}}
.mask.closing .modal{animation:zoomout .18s ease-in forwards}
@keyframes zoomout{to{opacity:0;transform:scale(.96) translateY(8px)}}
.side{width:264px;flex:none;background:var(--panel2);border-right:1px solid var(--line);display:flex;flex-direction:column}
.side .hd{padding:15px 14px 10px}
/* 弹窗头部的两个动作：收藏星标 + 「设为网站背景」。放在标题右侧，
   不跟 .skinlist（皮肤列表）挤在一起——那个列表会换行，动作按钮要一直够得着。 */
.side .hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.side .hd .t{flex:1 1 auto;min-width:0}
.macts{display:flex;gap:6px;align-items:center;flex:none;margin-left:auto}
.bgbtn{font:inherit;font-size:11.5px;color:var(--txt2);cursor:pointer;white-space:nowrap;

/* ══ 背景层：干净柔色底 + 三团大色块（2026-09-28 拆掉整屏噪声着色器）══════
   上一版是 WebGL2 的 fbm 域扭曲（光柱/海面亮带/焦散/颗粒/暗角全在着色器里）。
   用户判"很丑"，取证后确认**不是参数没调好，是手法本身的问题**：整屏低频噪声 +
/* ══ 背景层：静止的柔色底 + 「一划就起浪」的水面（2026-09-28 第四版）══════
   前三版（气泡+正弦线 / 2D 粒子星野 / WebGL 噪声着色器 / 三团漂移色块）全部被否，
   共同的毛病不是"好不好看"，而是**背景自己在动**：只要它不响应操作，就只是一张装饰壁纸。
   这一版把"动"整个交还给用户：
     · 静止时 = 完全平的（底色渐变 + 三团**不动**的柔色块），没人在划就一帧都不画
     · 滑动时 = 指针轨迹往水高场注入偶极脉冲 → 波动方程向外传播 → 波峰处渲染出白沫
     · 停下后 = 场在 ~2 秒内衰减回平面，循环自己停掉，回到"完全不动"
   ⇒ 于是这版对不对有一条极干脆的硬指标：**静止时任意两帧逐像素完全相同**
     （前几版做不到，它们一直在漂），而**划过之后必须先亮起来、再回到那个静止态**。
   ⚠️ 2026-10-15：样式与实现**已抽到 `water_bg.js`**（音乐库/背景库也要这一层，
   不能在这三页各留一份正本）。这一页只留 `#bgfx` 宿主与这一行说明，
   模块自己注入上面那套 CSS（`#bgfx` / `.bfield` / 三团光晕 / canvas）并按需起停循环。 */
header{position:relative;z-index:10}   /* 原本就有，这里只是把"内容压在背景上"这件事写全 */
main{position:relative;z-index:1}
/* 弹层开着的时候不再 wake 水面 —— 这条**只在 JS 侧做**（既不注入脉冲也不排下一帧）。
   这里不留 CSS 规则：背景已经没有任何自移动画，没有东西可"暂停"。
   （上一版这条挂在 .glow 的 animation-play-state 上，那时有漂移动画才需要。） */
/* ══ 交互反馈层：一个语义一种表现（§6.18 五条真缺陷的收口）══════════════
   本轮 grep 出来的事实：① 同一个「选中」语义有 5 种颜色 ② Live2D/Spine 两条控制条
   其实是浏览器原生按钮（CSS 只给了 font-size/padding）③ 全文 :active 命中 0 次
   ④ 全文 :focus-visible 命中 0 次，且 `input,select{outline:none}` 连默认焦点环一起杀了
   ⑤ 状态开关与瞬时动作外观一模一样。
   ①②③ 已由上一轮的 token + 弹性曲线顺带解决，这里补 ④ 与 ⑤。 */
/* ④ 键盘焦点环：:focus-visible 只在**键盘**导航时出现，鼠标点击不会留一个环。
   统一用 outline + offset（不是 box-shadow）——环要能盖在卡片自己的发光阴影外面。
   写在 :where() 里是为了让 specificity 归零，任何组件自己的焦点样式都能盖过它。 */
:where(button,input,select,textarea,a,[tabindex]):focus-visible{
  outline:2.5px solid var(--brand-d);outline-offset:2px}
/* 自带「环」语义的几处接管掉，避免同一元素上出现两圈 */
.card:focus-visible,.dd-btn:focus-visible,input[type=text]:focus-visible,select:focus-visible,
.l2panel .pf input:focus-visible{outline:none}
/* ⑤ 状态开关 vs 瞬时动作：以前外观一模一样。这里**不用颜色**区分（颜色已经全部被
   「一个语义一种表现」占用），改用形状 —— 开关左侧一颗 LED（关=空心、开=实心带辉光），
   瞬时动作按钮没有 LED、保持纯胶囊。 */
.opt button::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;
  margin-right:6px;background:transparent;border:1.5px solid currentColor;opacity:.5;
  transition:background .18s,opacity .18s,box-shadow .18s}
.opt button.on::before{background:currentColor;border-color:currentColor;opacity:1;
  box-shadow:0 0 7px currentColor}
/* 昼/夜那两个是「分段单选」，不是开关，不给 LED（否则四个全局开关的语义就糊了） */
#gTheme button::before{content:none;margin:0;border:0;width:0;height:0;box-shadow:none}
/* 查看器里的两个状态开关（判定区 / 参数·部件）由 JS 打上 .tg 走同一套 */
.srcbar button.tg::before,.spine-bar button.tg::before{content:'';display:inline-block;
  width:7px;height:7px;border-radius:50%;margin-right:6px;background:transparent;
  border:1.5px solid currentColor;opacity:.5;transition:background .18s,opacity .18s,box-shadow .18s}
.srcbar button.tg.on::before,.spine-bar button.tg.on::before{background:currentColor;
  border-color:currentColor;opacity:1;box-shadow:0 0 7px currentColor}
/* 剩下两条补齐：控制条里的原生下拉此前没有 hover；标签/皮肤行没有按压反馈 */
.spine-bar select:hover,.spine-bar select:focus{border-color:var(--brand);background:var(--panel)}
.tab:active,.skin:active,.dd-opt:active{filter:brightness(.94);transform:scale(.985)}
/* ══ 动效增补：标签滑块 / 弹层从卡片飞入 / 昼夜圆形擦除 ══════════════
   .diag/q2_style.css 是本块之前的配色正本，这里三段同样只引用 token。 */
/* 标签条：选中那颗的底色换成一条会滑的胶囊，切标签时整条飞过去
   （原来逐颗变背景，视觉上是"闪一下"而不是"换过去"） */
.tabs{position:relative}
.tslide{position:absolute;left:0;top:var(--y,6px);height:var(--h,28px);width:var(--w,0);
  border-radius:var(--r-chip);background:var(--on-bg);
  box-shadow:inset 0 0 0 1px var(--on-ring), var(--sh1);
  transform:translateX(var(--x,0));transition:transform .3s var(--ease-ios),width .3s var(--ease-ios);
  z-index:0;pointer-events:none}
.tabs .tab{position:relative;z-index:1}
.tabs .tab.on{color:var(--on-txt);background:transparent;box-shadow:none}
.tabs .tab.on:hover{background:transparent}
/* 弹层：从被点那张卡片的**缩略图**位置/大小长大到位（FLIP）。
   --fx/--fy/--fs 由 JS 量出来写进变量；只动 transform，不改布局尺寸，
   所以 Live2D / Spine 初始化读到的 clientWidth 与动画无关，不会被压扁。 */
.modal.fly{animation:flyin .36s var(--spring-slow)}
@keyframes flyin{from{opacity:.15;transform:translate(var(--fx,0),var(--fy,0)) scale(var(--fs,.12))}
  to{opacity:1;transform:none}}
/* 关闭时按原路缩回那张卡片（.mask.closing .modal 是原地缩回，这条更具体，覆盖它） */
.mask.closing .modal.flyout{animation:flyout .26s cubic-bezier(.4,0,.75,.4) forwards}
@keyframes flyout{to{opacity:0;transform:translate(var(--fx,0),var(--fy,0)) scale(var(--fs,.12))}}
.mask.on{animation:maskin .2s ease-out}
@keyframes maskin{from{opacity:0}}
/* 昼夜切换：以开关为圆心的圆形擦除 —— 整页快照后让新主题的 clip-path 由 0 涨到全覆盖。
   比交叉溶解更"像天黑下来"，也顺带绕开了渐变不可过渡的问题。 */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}
::view-transition-new(root){z-index:2;animation:vtwipe .52s cubic-bezier(.4,0,.2,1) both}
@keyframes vtwipe{from{clip-path:circle(0% at var(--cx,50%) var(--cy,0%))}
  to{clip-path:circle(150% at var(--cx,50%) var(--cy,0%))}}
/* ══ 交互反馈：iOS 式丝滑（无过冲、无形变）══════════════════════════════
   悬停只做「点亮」——描边亮起 + 底色变化 + 1px 抬升，**不放大、不鼓出**；
   按下只有一下 scale(.97) 的轻压感（iOS 的按钮就是这个手感）；松手平滑回位。
   全程没有回弹、没有压扁，也没有任何弹簧曲线。
   ⚠️ .close 故意不进这组：它自己的 hover 是「转 90° + 放大」，被通用规则一盖就没了。 */
.seg button,.opt button,.tab,.dd-btn,.srcbar button,.spine-bar button,.vbox button,
.l2panel .prow button{
  transition:transform .22s var(--ease-ios),box-shadow .22s var(--ease-ios),
    border-color .18s ease-out,color .16s ease-out,background-color .16s ease-out}
.seg button:hover,.opt button:hover,.tab:hover,.dd-btn:hover,.srcbar button:hover,
.spine-bar button:hover,.vbox button:hover,.l2panel .prow button:hover{filter:brightness(1.06)}
/* 按下：压暗 + 等比缩 .985，**不位移、不形变、不回弹**。
   有回弹/有形变就是果冻，只有亮度变化才是 iOS。 */
.seg button:active,.opt button:active,.tab:active,.dd-btn:active,.srcbar button:active,
.spine-bar button:active,.vbox button:active,.skin:active,.dd-opt:active,
.l2panel .prow button:active{filter:brightness(.94);transform:scale(.985)}
/* 悬停既然只改亮度，过渡必须带上 filter */
.seg button,.opt button,.tab,.dd-btn,.srcbar button,.spine-bar button,.vbox button,
.l2panel .prow button{transition:transform .2s var(--ease-ios),filter .18s var(--ease-ios),
  box-shadow .2s var(--ease-ios),border-color .18s ease-out,color .16s ease-out}
/* 表面高光：只给"有边框的芯片"。选中态用的是 background 简写（渐变），会自然盖掉这层。 */
.dd-btn,.srcbar button,.spine-bar button,.vbox button,.seg,.opt,.tabs,.spine-bar select{
  background-image:var(--gloss)}
/* 材质态之下不再给选中项叠"实心渐变 + 高光"——那正是"整块填色"的来源。
   选中只靠三件事表达：更亮一档的底（--on-bg）、一圈细彩色内描边（--on-ring）、彩色文字。 */
/* 系统要求减少动效时，只留必要的淡入，去掉所有回弹 */
@media (prefers-reduced-motion: reduce){
  .card,.card:hover,.card:active,.skin:hover,.skin .th,.close:hover,.tbtn:hover,.tab:hover,
  .srcbar button:hover,.spine-bar button:hover,.vbox button:hover{transition:none;transform:none}
  /* 果冻的"鼓起/压扁"是形变，减动效下全部退成不动，只留颜色反馈 */
  .seg button:hover,.seg button:active,.opt button:hover,.opt button:active,.tab:hover,.tab:active,
  .dd-btn:hover,.dd-btn:active,.srcbar button:active,.spine-bar button:active,.vbox button:active,
  .skin:active,.dd-opt:active,.l2panel .prow button:hover,.l2panel .prow button:active{
    transition:none;transform:none}
  .card,.modal,.talksub.on,.l2panel.on,.view.swap,.modal.fly,.mask.on{animation:none}
  .card .thumb img{opacity:1}          /* 淡入靠 load 事件，这里必须直接可见，否则图永不显示 */
  /* 背景：色块本来就没有动画；水面那层由 JS 看 RM 决定**根本不初始化**，
     所以这里无需再写退化规则（写了也没东西可退）。 */
  .tslide,.segslide{transition:none}
  #search,#search:focus{width:190px;transition:border-color .16s,box-shadow .16s,background .16s}
  ::view-transition-new(root){animation:none}
}
</style>
</head>
<body>
<div id="bgfx" aria-hidden="true"><div class="bfield"><i class="glow g1"></i><i class="glow g2"></i><i class="glow g3"></i></div></div>
<header class="main-toolbar">
  <h1>碧蓝航线资产浏览器</h1>
  <div class="ctl"><input type="text" id="search" placeholder="搜索 中文名 / 拼音ID"></div>
  <div class="ctl"><label>类别</label><div class="seg" id="fCat">
    <button data-c="" class="on">全部</button><button data-c="ship">舰船</button><button data-c="story">剧情角色</button><button data-c="other">其他</button>
  </div></div>
  <div class="ctl"><label>阵营</label><select id="fFaction"><option value="">全部</option></select></div>
  <div class="ctl"><label>舰种</label><select id="fType"><option value="">全部</option></select></div>
  <div class="ctl"><label>稀有度</label><select id="fRarity"><option value="">全部</option></select></div>
  <div class="ctl"><label>排序</label><select id="fSort">
    <option value="cn">按名称</option><option value="faction">按阵营</option><option value="type">按舰种</option><option value="rarity">按稀有度</option>
  </select></div>
  <div class="ctl"><label>内容</label><select id="fHas">
    <option value="">全部</option><option value="spine">含Spine</option><option value="live2d">含Live2D</option><option value="voice">含语音</option><option value="cn">有中文名</option><option value="fav">已收藏</option>
  </select></div>
  <div class="grow"></div>
  <div class="ctl"><label>全局</label><div class="opt" id="gOpt">
    <button data-k="voice" title="点击立绘 / Live2D 部位时是否播放语音">点击出声</button>
    <button data-k="lines" title="播放台词时是否在画面下方显示中文正文">显示台词</button>
    <button data-k="remember" title="记住每个皮肤上次的缩放与位置，下次打开直接回到那里">记住视角</button>
  </div></div>
  <div class="ctl"><label>配色</label><div class="opt" id="gTheme" title="昼 / 夜配色（状态会记住）">
    <button data-t="light">昼</button><button data-t="dark">夜</button>
  </div></div>
  <div class="ctl"><label>页面</label><div class="opt"><button onclick="location.href='bgm.html'" title="游戏原声 BGM（opus，536 首）在线试听">音乐库</button><button onclick="location.href='backgrounds.html'" title="场景/界面背景图 1897 张，带配置表来的中文命名">背景库</button></div></div>
  <div class="ctl"><label>背景</label><div class="opt"><button id="clearBg" title="取消站用背景图，回到水面背景（等于在背景库里取消选中的那张）">去掉背景图</button></div></div>
  <div class="hint" id="count"></div>
  <div class="hint" id="modehint"></div>
</header>
<main id="main"></main>

<div class="mask" id="mask">
  <div class="modal">
    <button class="close" id="close">×</button>
    <div class="side">
      <div class="hd"><div class="t" id="mName"></div><div class="p" id="mPy"></div><div class="macts" id="mActs"></div></div>
      <div class="meta" id="mMeta"></div>
      <div class="skinlist" id="mSkins"></div>
    </div>
    <div class="content">
      <div class="tabs" id="mTabs"></div>
      <div class="view" id="mView"></div>
    </div>
  </div>
</div>

<script src="./favorites.js"></script>
<script src="water_bg.js"></script>   <!-- 水面背景（三页共用，正本 gallery_src/water_bg.js） -->
<script src="./index.js"></script>
<script src="./vendor/spine/spine-all.js"></script>
<script>
const G = window.GALLERY;
const P = location.protocol === 'file:' ? '../' : '../'; // 图片相对路径前缀（两种协议下均可）
/* ---------- 「其他」档的两类条目：剧情剪影（`_hei`）与认不出归属的组件立绘 ----------
   §88 查清：`_hei` 是剧情里的**黑脸剪影**，不是角色、没有配音。2026-10-03 曾为它们单开一档，
   2026-10-05 用户改判三档制（舰船 / 剧情角色 / 其他）⇒ 档位由**索引里的 `category`** 决定，
   前端不再自己发明类别（前端发明一份，就永远和索引那份漂移）。
   仍然包成"单皮肤伪船"，好让卡片 / 搜索 / 弹层复用同一条渲染路径，不另写一套 UI。 */
const HEI = (G.silhouettes||[]).map(s=>({
  id:s.key, name:(s.shipName||'')+' · 剧情剪影', hasCn:false, npc:false,
  type:'', rarity:'', faction:'', category:s.category||'other', voiceCount:0, sil:s,
  skins:[{key:s.key, label:'剧情剪影', image:s.image, spine:false, live2d:''}],
  spineSkins:[], live2dSkins:[]}));
/* ---------- 形态族（`_alter`/`_memory`/`_dark`）：另一张卡的立绘，不是宿主船的皮肤 ----------
   索引层按归属判的外迁（`E.form_root(key)` 剥完画法层仍带形态后缀、且不等于卡 id）。
   三档制下它们不再自成一档：`category` 由索引按**它自己那个 root** 给（自机→舰船 / 其余→剧情角色 /
   `npc`·左中右分身→其他）。 */
const VAR = (G.variants||[]).map(s=>({
  id:s.key, name:(s.name||s.key)+' · '+s.familyCn, hasCn:false, npc:false,
  type:'', rarity:'', faction:'', category:s.category||'story', voiceCount:s.voiceCount||0,
  voiceText:s.voiceText||0, var:s,
  skins:[{key:s.key, label:s.label||s.familyCn, image:s.image, spine:false, live2d:'',
          voiceCount:s.voiceCount||0}],
  spineSkins:[], live2dSkins:[]}));
const ships = G.ships.concat(HEI, VAR);
let view = ships.slice();
let catFilter = '';   // ''=全部 / ship=舰船 / story=剧情角色 / other=其他

/* ---------- 全局交互开关（localStorage 持久化，三个视图共用） ----------
   两条各自独立：关掉「点击出声」后点画面仍然会上字幕（只是不出声），
   关掉「显示台词」则只出声不上字幕。语音标签页里的 <audio> 是用户明确点的，不受①限制。 */
const OPT_KEY = 'gallery.opt.v1';
const RM = matchMedia('(prefers-reduced-motion: reduce)');   // 动效总开关（系统设置）
/* 三个全局开关。⚠️ 这里**不再有 bgfx**：背景现在只在被划的时候才动、不划就完全静止，
   没有"需要关掉的花哨"，所以那颗按钮按用户要求删掉了（2026-09-28）。
   老用户 localStorage 里残留的 `bgfx:false` 会被 Object.assign 塞进来，但没人再读它——
   不清理是故意的：清它要写迁移代码，而那个键无害。 */
let OPT = {voice:true, lines:true, remember:true};
try{ Object.assign(OPT, JSON.parse(localStorage.getItem(OPT_KEY) || '{}')); }catch(e){}
function saveOpt(){ try{ localStorage.setItem(OPT_KEY, JSON.stringify(OPT)); }catch(e){} }
function paintOpt(){ document.querySelectorAll('#gOpt button')
  .forEach(b=>b.classList.toggle('on', !!OPT[b.dataset.k])); }

/* 「去掉背景图」：一键取消站用背景（=背景库选中的那张），回到水面。
   没设背景时**置灰**：按钮点了没反应比按钮不存在更让人困惑。
   状态只有两个来源：本页点它、或从背景库/立绘页改了背景 ⇒ 统一听 sitebgchange。 */
function paintClearBg(){ const b=document.getElementById('clearBg'); if(!b) return;
  const on=!!(window.SiteBg&&SiteBg.get()); b.disabled=!on; b.classList.toggle('on',on); }
{ const b=document.getElementById('clearBg');
  if(b) b.onclick=()=>{ if(window.SiteBg&&SiteBg.get()) SiteBg.clear(); }; }
document.addEventListener('sitebgchange',()=>paintClearBg());

/* ---------- 昼 / 夜主题 与 筛选栏折叠（各自持久化） ----------
   主题在 <head> 里已先落 data-theme 防闪烁，这里只负责切换与同步按钮文字。
   配色过渡靠临时挂 .theming（见 CSS），不挂时 hover 的弹性曲线才不会被拖慢。 */
const THEME_KEY='gallery.theme';
function paintTheme(){ const t=document.documentElement.dataset.theme||'light';
  document.querySelectorAll('#gTheme button').forEach(b=>b.classList.toggle('on', b.dataset.t===t)); }
function setTheme(t){
  const apply=()=>{ document.documentElement.dataset.theme=t;
    try{ localStorage.setItem(THEME_KEY,t); }catch(e){} paintTheme();
    /* 三团色块是 color-mix 自 token 的，CSS 自己就跟着换了；但**水面参数**
       （泡沫色 / 斜率增益 / 起沫阈值）是 JS 一次性读进 BG.P 的，必须重取一次，
       否则夜里还在用白天那套泡沫色。⚠️ 2026-10-15 起水面搬进 `water_bg.js`，
       那个模块**自己**用 MutationObserver 盯 data-theme ⇒ 这里不必再手动调；
       保留这一句只是兜底（模块没起来时它是空操作，不会报错）。 */
    if(window.WaterBg&&WaterBg.colors) WaterBg.colors(); };
  /* 渐变类背景（body 的 linear-gradient、选中胶囊的渐变、查看器底纹）在 CSS 里
     **根本不可过渡**，只给 background-color 加 transition 就会一半在淡、一半瞬切 ——
     这就是"不够自然"的来源。View Transition 是对整页做快照再交叉溶解，
     渐变/阴影/底纹一起参与，Chrome・Edge 111+ 原生支持；不支持时退回配色过渡。 */
  if(!RM.matches && document.startViewTransition) document.startViewTransition(apply);
  else if(RM.matches) apply();
  else { const h=document.documentElement; h.classList.add('theming'); apply();
    clearTimeout(setTheme._t); setTheme._t=setTimeout(()=>h.classList.remove('theming'),400); }
}
/* 圆心取被点那颗胶囊的位置：--cx/--cy 写在 html 上，::view-transition-new(root) 继承得到 */
document.querySelectorAll('#gTheme button').forEach(b=>b.onclick=()=>{
  const r=b.getBoundingClientRect();
  const h=document.documentElement;
  h.style.setProperty('--cx',((r.left+r.width/2)/h.clientWidth*100).toFixed(2)+'%');
  h.style.setProperty('--cy',((r.top+r.height/2)/h.clientHeight*100).toFixed(2)+'%');
  setTheme(b.dataset.t);
});

/* ---------- 视角记忆（按 皮肤key|标签页 存相机，下次打开回到这里） ----------
   存的必须是**尺度无关量**，否则换窗口尺寸 / 进全屏后位置会错位：
     painting: s（放大倍率）+ 偏移按视口宽高归一化
     live2d:   z + 偏移按 baseK 归一化（= 模型本地像素，与视口无关）
     spine:    camX/camY 是世界坐标、zoom 无量纲，原样存即可
   皮肤有 1000+ 个，全存会顶穿 localStorage 配额 ⇒ 按访问时间 LRU 截断到 VMEM_MAX 条。 */
const VIEW_KEY = 'gallery.view.v1', VMEM_MAX = 300;
let VMEM = {};
try{ VMEM = JSON.parse(localStorage.getItem(VIEW_KEY) || '{}') || {}; }catch(e){}
function vmemGet(k){ return (OPT.remember && VMEM[k]) || null; }
function vmemSet(k, v){ if(!OPT.remember) return;
  VMEM[k] = Object.assign({}, v, {t: Date.now()});
  const ks = Object.keys(VMEM);
  if(ks.length > VMEM_MAX){ ks.sort((a,b)=>VMEM[a].t - VMEM[b].t);
    for(const x of ks.slice(0, ks.length - VMEM_MAX)) delete VMEM[x]; }
  try{ localStorage.setItem(VIEW_KEY, JSON.stringify(VMEM)); }catch(e){} }
/* 滚轮/拖拽每帧都触发，落盘要合并；视图销毁前必须强制 flush 一次，否则最后一次操作丢 */
function vmemCommitter(key, read){ let t = null;
  return { touch(){ if(!OPT.remember) return; clearTimeout(t); t = setTimeout(()=>{ t=null; vmemSet(key, read()); }, 350); },
            flush(){ if(t){ clearTimeout(t); t = null; vmemSet(key, read()); } } }; }

/* ---------- 工具 ---------- */
function thumbOf(skin){ return skin.cg ? ('thumbs/' + skin.key + '_cg.webp') : skin.image ? ('thumbs/' + skin.key + '.webp') : ''; }
function fullOf(skin){ return skin.cg ? (P + skin.cg) : skin.image ? (P + skin.image) : ''; }
function hasSpine(s){ return s.spineSkins && s.spineSkins.length; }
function hasL2d(s){ return s.live2dSkins && s.live2dSkins.length; }
function defSkin(s){ return s.skins[0]; }
function rarClass(r){ return r ? ('rar-'+r) : ''; }

/* ---------- 筛选下拉填充 ---------- */
function uniqCount(arr){ const m={}; arr.forEach(x=>{if(x)m[x]=(m[x]||0)+1;}); return m; }
(function fillSelects(){
  const fc=uniqCount(ships.map(s=>s.faction)), tp=uniqCount(ships.map(s=>s.type)), rr=uniqCount(ships.map(s=>s.rarity));
  const opt=(sel,m,ph)=>{const e=document.getElementById(sel);Object.keys(m).sort((a,b)=>m[b]-m[a]).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=`${k} (${m[k]})`;e.appendChild(o);});};
  opt('fFaction',fc); opt('fType',tp); opt('fRarity',rr);
})();

/* ---------- 渲染网格（按 category 分区：舰船 / 剧情角色） ---------- */
const mainEl = document.getElementById('main');
function catOf(s){ return s.category==='other' ? 'other' : (s.category==='story' ? 'story' : 'ship'); }
/* 伪船（剪影 / 特殊形态）在卡片副标题上要说清"它不是皮肤"，两种一起判，别再各写一遍三元 */
function pseudoKind(s){ return s.sil?'剧情剪影':(s.var?'特殊形态':''); }
function makeCard(s){
  const card=document.createElement('div'); card.className='card';
  const ds=defSkin(s); const th=thumbOf(ds);
  const badges=[]; if(hasSpine(s))badges.push('<span class="b-spine">SPINE</span>'); if(hasL2d(s))badges.push('<span class="b-l2d">L2D</span>'); if(s.voiceCount)badges.push('<span class="b-voice">🔊'+s.voiceCount+'</span>');
  const tags=[]; if(s.rarity)tags.push(`<span class="tag ${rarClass(s.rarity)}">${s.rarity}</span>`); if(s.faction)tags.push(`<span class="tag f">${s.faction}</span>`); if(s.type)tags.push(`<span class="tag s">${s.type}</span>`);
  card.innerHTML=`<div class="thumb">${th?`<img loading="lazy" src="${th}">`:'<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#555;font-size:12px">无立绘</div>'}<div class="badge">${badges.join('')}</div>${window.Fav?Fav.btn('skin',s.id,s.name,'corner'):''}</div>
    <div class="body"><div class="nm">${s.name}</div><div class="py">${s.id} · ${pseudoKind(s)||s.skins.length+'皮肤'}</div><div class="tags">${tags.join('')}</div></div>`;
  /* 卡片可 Tab 聚焦：以前整张网格只有鼠标一条路，键盘走不到任何一张卡（§6.18 ④）。
     Enter/Space 的激活走 mainEl 上的**一个**委托监听器，不给千张卡各挂一个。 */
  card.tabIndex=0; card.setAttribute('role','button');
  card.setAttribute('aria-label',s.name+' · '+(pseudoKind(s)||s.skins.length+' 个皮肤'));
  card.onclick=()=>openShip(s,card);
  /* 缩略图淡入：懒加载的图到货那一刻不该"啪"地跳出来。
     complete 分支必须有 —— 命中缓存时 load 事件根本不会再发。 */
  const im=card.querySelector('img');
  if(im){ const on=()=>im.classList.add('ld');
    if(im.complete) on();
    else { im.addEventListener('load',on,{once:true}); im.addEventListener('error',on,{once:true}); } }
  return card;
}
function renderGrid(){
  mainEl.innerHTML='';
  const cntEl=document.getElementById('count');
  if(!view.length){ mainEl.innerHTML='<div class="empty">没有匹配的内容</div>'; cntEl.textContent='共 0 项'; return; }
  const CATL={ship:'舰船',story:'剧情角色',other:'其他'};
  const groups = catFilter==='' ? [['ship','舰船'],['story','剧情角色'],['other','其他']]
                                : [[catFilter, CATL[catFilter]||catFilter]];
  let shown=0; const per={};
  groups.forEach(([key,label])=>{
    const list = view.filter(s=>catOf(s)===key);
    per[key]=list.length;
    if(!list.length) return;
    shown+=list.length;
    const hd=document.createElement('div'); hd.className='sec-hd'+(key==='story'?' story':'');
    hd.innerHTML=`${label} <span class="n">${list.length}</span>`;
    mainEl.appendChild(hd);
    const g=document.createElement('div'); g.className='grid';
    const frag=document.createDocumentFragment();
    list.forEach((s,i)=>{ const c=makeCard(s); c.style.setProperty('--i',i); frag.appendChild(c); });
    g.appendChild(frag); mainEl.appendChild(g);
  });
  if(!shown){ mainEl.innerHTML='<div class="empty">该类别下没有匹配项</div>'; }
  cntEl.textContent = catFilter==='' ? `共 ${shown} 项 · 舰船 ${per.ship||0} / 剧情 ${per.story||0} / 其他 ${per.other||0}` : `共 ${shown} 项`;
}

/* ---------- 卡片跟随鼠标倾斜 + 毛玻璃按需挂载 ----------
   倾斜：整张网格只有**一个**委托监听器（1000+ 张卡不能各挂 mousemove），
   只写 --rx/--ry 两个变量，不写内联 transform —— 内联会把 :hover/:active 两条规则
   整个盖掉，抬起和按压就全失效了。
   ⚠️ 幅度：满偏 ±8°/±6.5°（dx*16 / dy*13），perspective 从 760px 收到 620px 再放大
   一点透视感。上一版是 ±4.5°/±3.5°，探针在鼠标停在 0.68/0.32 那个点时量到 1.4°/1.8°
   —— 我当时把"取样点太靠中心"当成了"设计幅度太小"，直接删了整条动效，判错：
   用户要的是"看得见"，不是"不要"。教训记进 TROUBLESHOOTING：判"看不见"要按**满偏**算，
   不能拿一个随手取的点当上限。
   ⚠️ transform 的过渡压到 .14s：跟着鼠标转的东西如果挂上 .24s 的弹性曲线，
   每帧都被重新触发一次回弹，手感是"糊"而不是"跟"。
   ⚠️ 卡面矩形按卡缓存：每帧都 getBoundingClientRect 再写 style 就构成
   「写→读」强制回流，1008 张卡的网格上会掉帧。滚动时把缓存作废即可。 */
let tiltOn=null, tiltRect=null;
function tiltReset(){ if(tiltOn){
  tiltOn.style.setProperty('--rx','0deg');
  tiltOn.style.setProperty('--ry','0deg');
  tiltOn=null; tiltRect=null; } }
mainEl.addEventListener('scroll',()=>{ tiltRect=null; },{passive:true});
mainEl.addEventListener('mousemove',e=>{
  if(RM.matches){ tiltReset(); return; }
  const c=e.target.closest('.card');
  if(!c){ tiltReset(); return; }
  if(c!==tiltOn||!tiltRect){ tiltReset(); tiltOn=c; tiltRect=c.getBoundingClientRect(); }
  const dx=(e.clientX-tiltRect.left)/tiltRect.width-.5, dy=(e.clientY-tiltRect.top)/tiltRect.height-.5;
  c.style.setProperty('--ry',(dx*16).toFixed(2)+'deg');
  c.style.setProperty('--rx',(-dy*13).toFixed(2)+'deg');
});
mainEl.addEventListener('mouseleave',tiltReset);

/* ---------- 液态玻璃：真折射（当前只挂在导航栏那条边墙上） ----------
   为什么非自己画法线图不可：挂在 backdrop-filter 上的 SVG 滤镜，它的 SourceGraphic
   就是「身后那张已经合成好的背景图」——滤镜**拿不到元素自己的形状**。所以那一圈的坡度
   只能预先按元素的实测尺寸算成一张图（R=横向推多少、G=纵向推多少），再用 feImage 喂给
   feDisplacementMap。CSS 模糊永远推不动像素，这就是前几轮"还是毛玻璃"的物理原因。
   ⚠️ 折射只给边墙那一圈，不给整块面板：实测整面折射 56.6ms/帧、边墙 20.0ms/帧（预算 16.7ms）。
   ⚠️ 卡片**故意不接**（2026-10-11 用户否掉，理由见上面 ② 那条注释）：卡片缝隙外就是邻卡的
      高对比立绘，折射会把画面拽进那一圈读成污渍。⇒ 只给"背后是滚动内容"这种低频背景用。
   ⚠️ 成本主因是**同时存在几个不同滤镜**，不是滤镜复杂度：按精确尺寸分 5 桶 = 83.4ms，
      归并成 2 桶 + 法线图降采样 = 30.1ms。别改回精确分桶。 */
const LGNS='http://www.w3.org/2000/svg', XLINKNS='http://www.w3.org/1999/xlink';
const LG = { on:!!(window.CSS&&CSS.supports&&CSS.supports('backdrop-filter','blur(1px) url(#lgprobe)')),
             svg:null, buckets:new Map(), max:2, gen:0, cv:null, mpx:96 };
if(LG.on) document.documentElement.classList.add('lg');
function lgTok(){
  const cs=getComputedStyle(document.documentElement);
  const num=(n,d)=>{const v=parseFloat(cs.getPropertyValue(n)); return Number.isFinite(v)?v:d;};
  LG.mpx=Math.max(16,num('--lg-mpx',96));      // 顺手写回：lgMapURI 从这里取，避免一路传参
  return {depth:num('--lg-depth',26), ring:num('--lg-ring',12), rad:num('--r-card',16)};
}
/* 圆角矩形带符号距离场：中心原点，bx/by 是已扣掉圆角的半宽/半高；负值在内部 */
function lgSDF(x,y,bx,by,r){
  const dx=Math.abs(x)-bx, dy=Math.abs(y)-by;
  return Math.min(Math.max(dx,dy),0)+Math.hypot(Math.max(dx,0),Math.max(dy,0))-r;
}
function lgMapURI(w,h,rad,ring){
  w=Math.max(8,Math.round(w)); h=Math.max(8,Math.round(h));
  rad=Math.max(0,Math.min(rad,Math.min(w,h)/2-0.5));
  /* 图按 CSS 空间算、再降采样落盘：feImage 会把它拉伸铺满滤镜区，所以低分辨率不改变
     环的位置，只是让坡度更平滑。⚠️ 梯度必须在 CSS 单位下差分——先在图空间缩小坐标，
     再用 1 图像素当步长，会把坡度按缩放比一起缩小，等于偷偷改了折射强度。 */
  const s=Math.min(1, LG.mpx/Math.max(w,h));
  const mw=Math.max(8,Math.round(w*s)), mh=Math.max(8,Math.round(h*s));
  const cv=LG.cv||(LG.cv=document.createElement('canvas'));
  cv.width=mw; cv.height=mh;
  const ctx=cv.getContext('2d'), im=ctx.createImageData(mw,mh), px=im.data;
  const bx=w/2-rad, by=h/2-rad, inv=1/Math.max(1,ring);
  for(let j=0;j<mh;j++){ const cy=(j+0.5)/s-h/2;
    for(let i=0;i<mw;i++){ const cx=(i+0.5)/s-w/2;
      const e=-lgSDF(cx,cy,bx,by,rad);                // 到边框的内距离
      const t=e<=0?0:(e<ring?1-e*inv:0);              // 环带内 1→0，带外不推
      let nx=0,ny=0;
      if(t>0){ nx=(lgSDF(cx+1,cy,bx,by,rad)-lgSDF(cx-1,cy,bx,by,rad))*0.5;
               ny=(lgSDF(cx,cy+1,bx,by,rad)-lgSDF(cx,cy-1,bx,by,rad))*0.5; }
      const k=((j*mw+i)<<2);
      px[k]=128+nx*t*127; px[k+1]=128+ny*t*127; px[k+2]=128; px[k+3]=255;
    } }
  ctx.putImageData(im,0,0);
  return cv.toDataURL('image/png');
}
function lgDefs(){
  if(LG.svg) return LG.svg;
  const s=document.createElementNS(LGNS,'svg');
  s.setAttribute('aria-hidden','true');
  s.style.cssText='position:absolute;width:0;height:0;overflow:hidden';
  document.body.appendChild(s);
  return LG.svg=s;
}
function lgBuild(id,w,h,rad,ring,depth){
  const f=document.createElementNS(LGNS,'filter');
  f.setAttribute('id',id);
  /* 滤镜区域往外扩：位移要从元素外面取像素，贴着边取就会被裁成一条糊带 */
  f.setAttribute('x','-16%'); f.setAttribute('y','-16%');
  f.setAttribute('width','132%'); f.setAttribute('height','132%');
  const fi=document.createElementNS(LGNS,'feImage');
  fi.setAttribute('x','0'); fi.setAttribute('y','0');
  fi.setAttribute('width',String(w)); fi.setAttribute('height',String(h));
  fi.setAttribute('preserveAspectRatio','none'); fi.setAttribute('result','n');
  const uri=lgMapURI(w,h,rad,ring);
  fi.setAttribute('href',uri); fi.setAttributeNS(XLINKNS,'xlink:href',uri);
  const dm=document.createElementNS(LGNS,'feDisplacementMap');
  dm.setAttribute('in','SourceGraphic'); dm.setAttribute('in2','n');
  /* 位移 = scale×(通道/255 − 0.5)，图里峰值是 ±127 ⇒ 最大推开 scale/2 像素 */
  dm.setAttribute('scale',String(depth*2));
  dm.setAttribute('xChannelSelector','R'); dm.setAttribute('yChannelSelector','G');
  f.appendChild(fi); f.appendChild(dm); lgDefs().appendChild(f);
}
function lgPick(kind,w,h,rad,ring,depth){
  /* 桶按粗粒度归并。feImage 是**拉伸铺满**滤镜区的，尺寸差十几像素只会让环跟着缩放几个百分点，
     不会跑位——上一版按精确尺寸分桶（实测 5 桶 5 张图）把帧时从 33ms 顶到 83ms，
     成本主因是**同时存在几个不同滤镜**，精确分桶是白做的过度设计。 */
  const key=kind+'|'+Math.round(w/24)+'|'+Math.round(h/48)+'|'+Math.round(depth);
  const hit=LG.buckets.get(key); if(hit) return hit.id;
  if(LG.buckets.size>=LG.max){
    let best=null;
    LG.buckets.forEach(v=>{ const d=Math.abs(v.h-h)+Math.abs(v.w-w)*2;
      if(!best||d<best.d) best={d:d,id:v.id}; });
    if(best) return best.id;
    return null;
  }
  const id='lg'+(++LG.gen);
  lgBuild(id,w,h,rad,ring,depth);
  LG.buckets.set(key,{id,w,h});
  return id;
}
function lgApply(el,kind){
  if(!LG.on||!el) return;
  const T=lgTok(), r=el.getBoundingClientRect();
  const w=Math.round(r.width);
  let h, rad, ring;
  if(kind==='nav'){ const cs=getComputedStyle(el,'::before');
    h=Math.round(parseFloat(cs.height)||14); rad=0; ring=h; }   // 栏子那条是 14px 高的实心带
  else { h=Math.round(r.height); rad=T.rad; ring=T.ring; }
  const cls=kind==='nav'?'hglg':'lgr';
  /* 只挡退化尺寸。⚠️ 别顺手写成 h<16：导航栏那条边墙实测就是 14px，会被这道守卫整个挡掉。 */
  if(w<8||h<8){ el.classList.remove(cls); return; }
  const id=lgPick(kind,w,h,rad,ring,T.depth);
  if(!id){ el.classList.remove(cls); return; }
  /* 必须先写 --lgf 再加类：反了会让 backdrop-filter 在空变量上解析失败，那一圈整个消失 */
  el.style.setProperty('--lgf','url(#'+id+')');
  el.classList.add(cls);
}
function lgRefresh(){
  if(!LG.on) return;
  LG.buckets.clear();
  if(LG.svg) while(LG.svg.firstChild) LG.svg.removeChild(LG.svg.firstChild);
  lgApplyAll();
}
/* 本页现在**没有任何折射挂载点**了：卡片那条撤于 §136（一转就整块糊），导航栏那条撤于 §138
   （读作一条杠）。lgApplyAll() 因此是空的 —— 留着它是因为上面那套内联 LG 机制还没拆干净，
   拆的时机是"首页空下来"（`liquid_glass.js` 头部注释里那条切换点），届时整段一起删。
   ⚠️ 别顺手往这里加挂载：要先过 §138 那条判据（身后有照片时会不会又变成一条杠）。 */
function lgApplyAll(){}
if(LG.on){
  lgApplyAll();
  let lgPend=0;
  addEventListener('resize',()=>{ if(lgPend) return;
    lgPend=requestAnimationFrame(()=>{ lgPend=0; lgRefresh(); }); });

/* ---------- 卡片键盘激活 ----------
   键盘那条路：Enter / Space 激活焦点所在的卡片（整张网格一个委托监听器，不给千张卡各挂）。
   悬停的描边发光 / 上浮 / 缩略图微放大全部由 CSS 的 :hover / :focus-visible 承担；
   JS 在这张网格上只写倾斜的两个变量，不碰别的。 */
mainEl.addEventListener('keydown',e=>{

/* ---------- 搜索/筛选 ---------- */
function apply(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const f=document.getElementById('fFaction').value, t=document.getElementById('fType').value, r=document.getElementById('fRarity').value, hs=document.getElementById('fHas').value;
  view=ships.filter(s=>{
    if(f && s.faction!==f)return false;
    if(t && s.type!==t)return false;
    if(r && s.rarity!==r)return false;
    if(hs==='spine' && !hasSpine(s))return false;
    if(hs==='live2d' && !hasL2d(s))return false;
    if(hs==='voice' && !s.voiceCount)return false;
    if(hs==='cn' && !s.hasCn)return false;
    /* 「已收藏」：单位是一张卡 = 一个角色（键用 s.id），不是它下面的某个皮肤。
       模块没加载（离线/被拦）时这一档筛出空表，而不是把全部放过来——
       放过来会变成"收藏坏了但看着像好的"。 */
    if(hs==='fav' && !(window.Fav&&Fav.has('skin',s.id)))return false;
    if(q && s.name.toLowerCase().indexOf(q)<0 && s.id.toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  const sk=document.getElementById('fSort').value;
  const RAR={'海上传奇':0,'超稀有':1,'精锐':2,'稀有':3,'普通':4};
  if(sk==='rarity')view.sort((a,b)=>(RAR[a.rarity]??9)-(RAR[b.rarity]??9)||a.name.localeCompare(b.name,'zh'));
  else if(sk==='faction')view.sort((a,b)=>a.faction.localeCompare(b.faction,'zh')||a.name.localeCompare(b.name,'zh'));
  else if(sk==='type')view.sort((a,b)=>a.type.localeCompare(b.type,'zh')||a.name.localeCompare(b.name,'zh'));
  else view.sort((a,b)=>a.name.localeCompare(b.name,'zh'));
  renderGrid();
}
['search'].forEach(id=>document.getElementById(id).addEventListener('input',debounce(apply,180)));
['fFaction','fType','fRarity','fHas','fSort'].forEach(id=>document.getElementById(id).addEventListener('change',apply));

/* ---------- 把原生 select 包成带动效的下拉 ----------
   状态仍然只存在 select.value 上：选中时回写 value 并 dispatch change，
   所以上面那行 change→apply 的绑定、以及 apply() 读 value 的代码一行都不用改。
   放在这里是因为 fillSelects 已经跑完，阵营/舰种/稀有度的 option 才填好。 */
function enhanceSelect(sel){
  const dd=document.createElement('div'); dd.className='dd';
  sel.parentNode.insertBefore(dd,sel); dd.appendChild(sel);
  const btn=document.createElement('button'); btn.type='button'; btn.className='dd-btn';
  btn.setAttribute('aria-haspopup','listbox'); btn.setAttribute('aria-expanded','false');
  btn.innerHTML='<span class="dd-cur"></span><i class="dd-arw">▼</i>';
  const panel=document.createElement('div'); panel.className='dd-panel'; panel.setAttribute('role','listbox');
  dd.append(btn,panel);
  const cur=btn.querySelector('.dd-cur');
  const build=()=>{ panel.innerHTML='';
    [...sel.options].forEach((o,i)=>{ const d=document.createElement('div');
      d.className='dd-opt'; d.setAttribute('role','option'); d.dataset.v=o.value; d.style.setProperty('--i',i);
      const m=/^(.*?)\s*\((\d+)\)$/.exec(o.textContent.trim());   // "重樱 (161)" → 名字 + 数字分两栏对齐
      d.innerHTML=m?`<span>${m[1]}</span><span class="n">${m[2]}</span>`:`<span>${o.textContent}</span>`;
      panel.appendChild(d); }); };
  const sync=()=>{ const o=sel.selectedOptions[0]; cur.textContent=o?o.textContent:'';
    panel.querySelectorAll('.dd-opt').forEach(d=>d.classList.toggle('cur',d.dataset.v===sel.value)); };
  const open=v=>{ dd.classList.toggle('open',v); btn.setAttribute('aria-expanded',String(v)); if(v) sync(); };
  btn.onclick=()=>{ const willOpen=!dd.classList.contains('open');
    if(willOpen) document.querySelectorAll('.dd.open').forEach(x=>x.classList.remove('open'));  // 一次只开一个
    open(willOpen); };
  panel.onclick=e=>{ const d=e.target.closest('.dd-opt'); if(!d) return;
    sel.value=d.dataset.v; sel.dispatchEvent(new Event('change',{bubbles:true})); open(false); };
  sel.addEventListener('change',sync);
  document.addEventListener('pointerdown',e=>{ if(!dd.contains(e.target)) open(false); },true);
  btn.onkeydown=e=>{ const list=[...panel.children];
    if(e.key==='Escape'){ open(false); return; }
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault();
      if(!dd.classList.contains('open')){ open(true); return; }
      const i=list.findIndex(d=>d.classList.contains('cur'));
      const j=Math.max(0,Math.min(list.length-1, i+(e.key==='ArrowDown'?1:-1)));
      list[j] && list[j].click(); return; }
    if(e.key==='Enter'&&dd.classList.contains('open')){ e.preventDefault();
      const t=panel.querySelector('.dd-opt.cur')||list[0]; if(t) t.click(); } };
  build(); sync();
}
['fFaction','fType','fRarity','fHas','fSort'].forEach(id=>enhanceSelect(document.getElementById(id)));
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}

/* ---------- 详情弹层 ---------- */
let curShip=null, curSkin=null, tab='painting', paintSrc='cg';
let curVM=null;   // 当前视图的「视角记忆」提交器（切视图/关弹层时先 flush，否则最后一次滚轮会丢）
const mask=document.getElementById('mask'), viewEl=document.getElementById('mView');
let flySrc=null;   // 打开弹层那张卡片的缩略图：进场从这里长大，退场缩回这里
/* FLIP 的三段几何：起点(卡片)与终点(弹层)的中心差 + 宽度比，全写进 CSS 变量。
   卡片可能已滚出视口、或这次不是从卡片打开的（键盘/皮肤列表），此时返回 0 用原地动画。 */
function flyGeom(from){
  const m=document.querySelector('.modal');
  if(!m||!from||!from.isConnected||RM.matches) return 0;
  const r=from.getBoundingClientRect(), b=m.getBoundingClientRect();
  if(r.width<3||b.width<3||b.height<3) return 0;
  m.style.setProperty('--fx',((r.left+r.width/2)-(b.left+b.width/2)).toFixed(1)+'px');
  m.style.setProperty('--fy',((r.top+r.height/2)-(b.top+b.height/2)).toFixed(1)+'px');
  m.style.setProperty('--fs',Math.min(1,r.width/b.width).toFixed(4));
  return 1;
}
function openShip(s,from){
  curShip=s; setSkin(defSkin(s)); buildSkinList(s);
  flySrc=from?(from.querySelector('.thumb')||from):null;
  mask.classList.remove('closing'); mask.classList.add('on');
  placeTab(false);   // setSkin 跑在 mask 显示之前，那时量不到尺寸，这里补落位
  const m=document.querySelector('.modal'); if(!m) return;
  /* 开合都要把两个动画类清干净：弹层一旦 display:none，CSS 动画直接停摆、
     animationend 不再触发 ⇒ 只靠动画结束回调摘类会留下永久挂着的 .fly。 */
  m.classList.remove('flyout','fly');
  if(flyGeom(flySrc)){ m.classList.add('fly');
    m.addEventListener('animationend',function h(){ m.classList.remove('fly'); m.removeEventListener('animationend',h); }); }
}
function closeShip(){ if(curVM){ curVM.flush(); curVM=null; }
  stopSpine(); stopLive2D(); hideSub();
  const done=()=>{ mask.classList.remove('on','closing'); viewEl.innerHTML=''; document.getElementById('mTabs').innerHTML='';
    const m=document.querySelector('.modal'); if(m) m.classList.remove('flyout','fly'); };
  const fly=flyGeom(flySrc);
  if(mask.classList.contains('on') && !RM.matches){
    if(fly) document.querySelector('.modal').classList.add('flyout');

  } else done(); }
document.getElementById('close').onclick=closeShip;
mask.onclick=e=>{if(e.target===mask)closeShip();};

/* 弹窗头部动作：收藏（单位 = 这个角色）+ 把当前皮肤的立绘设成网站背景。

/* 把「会滚的胶囊」落到选中那颗上。一律用 offset*（布局值）：
   getBoundingClientRect 会把弹层飞入动画的 scale(0.12) 乘进去，量到的落位是错的。
   anim=false 时关掉过渡（首次落位 / 标签条重建），否则每次打开弹层它都从上个位置飞一次。 */
function slidePill(sl, on, anim){
  if(!sl||!on) return;
  const set=()=>{ sl.style.setProperty('--x',on.offsetLeft+'px'); sl.style.setProperty('--y',on.offsetTop+'px');
    sl.style.setProperty('--w',on.offsetWidth+'px'); sl.style.setProperty('--h',on.offsetHeight+'px'); };
  if(anim){ set(); return; }
  const t=sl.style.transition; sl.style.transition='none'; set();
  void sl.offsetWidth; sl.style.transition=t;
}
/* 标签条滑块落位。⚠️ 弹层 display:none 时 offset* 全为 0：openShip 里 setSkin 跑得比
   显示早，所以那里补了一次 placeTab(false)。 */
function placeTab(anim){
  const tl=document.getElementById('mTabs'); if(!tl) return;
  slidePill(tl.querySelector('.tslide'), tl.querySelector('.tab.on'), anim);
}
window.addEventListener('resize',()=>placeTab(false));
function renderView(){

  viewEl.classList.remove('swap'); void viewEl.offsetWidth; viewEl.classList.add('swap');
  stopSpine(); stopLive2D(); stopSkinVoice(); const sk=curSkin;
  if(tab==='painting'){
    const hasCg=!!sk.cg, hasRaw=!!sk.image;

    else{

      const sw = (hasCg&&hasRaw)
        ? `<button data-s="cg" class="${useCg?'on':''}">全屏 CG（Spine 合成）</button><button data-s="raw" class="${!useCg?'on':''}">立绘原件（painting）</button>`

      viewEl.querySelectorAll('.srcbar button[data-s]').forEach(b=>b.onclick=()=>{paintSrc=b.dataset.s;renderView();});
      mountImageViewer();

      mountSkinVoice(viewEl.querySelector('.srcbar'), document.getElementById('imgStage'), ()=>curSkin.key);

/* 静态立绘/CG 交互浏览：滚轮缩放(以光标为中心) · 拖拽平移 · 双击100% · 全屏 */
function mountImageViewer(){
  const stage=document.getElementById('imgStage'); if(!stage)return;
  const img=stage.querySelector('img');
  let s=1,x=0,y=0;
  const vkey=(curSkin&&curSkin.key)+'|painting';
  /* 存的是「偏移 ÷ 视口宽高」，不是像素：换窗口尺寸、进全屏后 init() 重算时比例不变 */
  const vm=vmemCommitter(vkey, ()=>{ const r=stage.getBoundingClientRect();
    return {s:+s.toFixed(4), nx:r.width?+(x/r.width).toFixed(5):0, ny:r.height?+(y/r.height).toFixed(5):0}; });
  curVM=vm;
  function relayout(){ const r=stage.getBoundingClientRect();
    if(!img.naturalWidth) return false;
    /* 上限 2 倍而不是 1：立绘原件多为 800~1100px 宽，在 2560 屏放大后的弹窗里
       按「不放大」只能画到自然尺寸 → 四周大片留白，就是用户说的「缩得有点小」。
       像素保真没有丢：双击仍然是 1:1 像素（下面 dblclick 用 naturalWidth/clientWidth 反算）。 */
    const k=Math.min(r.width/img.naturalWidth, r.height/img.naturalHeight, 2);
    img.style.width=Math.round(img.naturalWidth*k)+'px';
    img.style.height=Math.round(img.naturalHeight*k)+'px';
    return true; }
  const apply=()=>{ img.style.transformOrigin='0 0';
    img.style.transform=`translate(${x}px,${y}px) scale(${s})`;
    stage.style.cursor=s>1.001?'grab':'zoom-in'; };
  const reset=()=>{ s=1; x=0; y=0; apply(); };
  function init(){ if(!relayout()) return;
    const m=vmemGet(vkey);
    if(!m){ reset(); return; }
    const r=stage.getBoundingClientRect();
    s=Math.min(24, Math.max(0.15, m.s||1)); x=(m.nx||0)*r.width; y=(m.ny||0)*r.height; apply(); }
  img.addEventListener('load',init);
  stage.addEventListener('wheel',e=>{ e.preventDefault();
    const r=stage.getBoundingClientRect(), offX=img.offsetLeft, offY=img.offsetTop;
    const mx=e.clientX-r.left, my=e.clientY-r.top;
    const ns=Math.min(24, Math.max(0.15, s*(e.deltaY>0?0.9:1.125)));
    x=mx-offX-(mx-offX-x)*(ns/s); y=my-offY-(my-offY-y)*(ns/s); s=ns; apply(); vm.touch();
  },{passive:false});
  let drag=false,dx=0,dy=0;
  stage.addEventListener('pointerdown',e=>{ drag=true; dx=e.clientX; dy=e.clientY;
    stage.setPointerCapture(e.pointerId); stage.style.cursor='grabbing'; });
  stage.addEventListener('pointermove',e=>{ if(!drag)return; x+=e.clientX-dx; y+=e.clientY-dy;
    dx=e.clientX; dy=e.clientY; apply(); });
  const up=()=>{ if(!drag)return; drag=false; apply(); vm.touch(); };
  stage.addEventListener('pointerup',up); stage.addEventListener('pointercancel',up);
  stage.addEventListener('dblclick',e=>{ const r=stage.getBoundingClientRect(), offX=img.offsetLeft, offY=img.offsetTop;
    const mx=e.clientX-r.left, my=e.clientY-r.top;
    if(s>1.02){ reset(); vm.touch(); return; }
    const ns=Math.min(24, (img.naturalWidth/img.clientWidth)||2);   // 放大到 1:1 像素
    x=mx-offX-(mx-offX-x)*(ns/s); y=my-offY-(my-offY-y)*(ns/s); s=ns; apply(); vm.touch(); });
  document.getElementById('zReset').onclick=()=>{ reset(); vm.touch(); };
  document.getElementById('zFull').onclick=()=>{
    if(document.fullscreenElement) document.exitFullscreen();
    else viewEl.requestFullscreen().catch(()=>{});
  };
  stage.addEventListener('fullscreenchange',init);
  init();
}
function renderVoice(){
  const sk=curSkin||{}, key=sk.key;
  viewEl.innerHTML='';
  const wrap=document.createElement('div'); wrap.className='audwrap'; viewEl.appendChild(wrap);
  const row=(labText, src, tw)=>{
    const d=document.createElement('div'); d.className='aud';
    const lab=document.createElement('span'); lab.className='lbl'; lab.textContent=labText;
    const col=document.createElement('div'); col.className='col';
    if(tw){ const t=document.createElement('div'); t.className='tw'; t.textContent=tw; col.appendChild(t); }
    if(src){                                   // src 为空 = 这一条只有正文、没有可播音频
      const au=document.createElement('audio'); au.controls=true; au.preload='none'; au.src=vsrc(src);
      col.appendChild(au); }
    d.appendChild(lab); d.appendChild(col); wrap.appendChild(d); };
  const draw=()=>{
    wrap.innerHTML='';
    const e=(SV||{})[key]||{}, lines=e.lines||[], w=wordsOf(key)||{};
    /* `_ex` 活动版是**另一条录音**，台词表里没有它的位置（全表只有 6 行带 `*_replace` 字段）
       ⇒ 不许顶用本句的正文，否则同一个「普通触摸」出两行、字幕一模一样（实测 17802 行）。 */
    const withText=lines.filter(l=>!l.ev && w[l.cat]).length;
    const tk=Object.keys(w);
    const h=document.createElement('h4');
    h.textContent = lines.length
      ? `台词 ${lines.length} 条（${withText} 条有中文正文） · ${sk.label||key}`
      : (location.protocol==='file:'
          ? 'file:// 下取不到台词表：请运行「启动资产浏览器.bat」后在浏览器里看台词'
          : tk.length
              ? `台词 ${tk.length} 条（该皮肤的语音主包未随资产下发，所以只能读不能播） · ${sk.label||key}`
              : `该皮肤本地没有语音包（主包 cv-${(e.cv||'?')} 未随包导出） · ${sk.label||key}`);
    wrap.appendChild(h);
    /* 活动版那一行改后只有声音没有字幕（正文没随配置表下发），不解释一句会被当成"字幕坏了"。 */
    if(lines.some(l=>l.ev)){
      const n=document.createElement('div'); n.className='hint';
      n.textContent='标「活动版」的是活动限定录音：正文没有随配置表下发，所以只有声音、不配字幕。';
      wrap.appendChild(n); }
    lines.forEach(l=>row((l.label||l.cat)+(l.ev?' · 活动版':''), l.f,
                         OPT.lines&&!l.ev?w[l.cat]:''));
    /* 「有表行、主包没下发」那 44 张：正文取自 character_voice 的字段名，中文类别名同源。
       这里**不造播放器**——没有对应音频文件，装了就是个点了没响的假控件。 */
    if(!lines.length && tk.length && !sk.voiceCount)
      tk.forEach(n=>row(SW.L[n]||n, '', OPT.lines?w[n]:''));
    /* 主包缺失、盘上只剩变体包（-gift/-battle）的船：这些是 v1 时代就导出好的旧 wav，
       不并进台词表（整包一条，对不到具体类别），但也不该因为换口径就听不见了。 */
    const extra=sk.voiceExtra||[];
    if(extra.length){
      const t=document.createElement('h4'); t.textContent='其它已导出语音（变体包整包，未按条切分故无对应正文）';
      wrap.appendChild(t);
      extra.forEach(p=>row('变体包 · '+(p.match(/cv-\d+-(\w+)\.wav$/)||[,'?'])[1], p, ''));
    }
    if(!lines.length && !extra.length && !tk.length){
      const n=document.createElement('div'); n.className='hint';
      n.textContent='可点开的语音为 0：本地资产里这艘船的主语音包缺失（详见 docs/TROUBLESHOOTING.md §49）。';
      wrap.appendChild(n); }
  };
  Promise.all([loadVoiceMap(), loadWords()]).then(draw,draw);
}
/* ---------- 皮肤语音（skin_voice.json，由 scripts/extract_cv_voice.py 从 cue/cv-*.b 导出）----------

                  lines:[{cat,label,f,ev}]}}。
   音频按「船级语音包」去重存放（Audio/CV2/cv-<n>/），皮肤只写引用；同一包不再重复导出。
   ⚠️ `_N` 后缀是**皮肤序号**不是随机变体：取词在导出侧已按皮肤序号选档，前端一律直取、不得随机抽。 */

   皮肤行id 是**皮肤表主键**，由生成侧按 painting 查表得到（⚠️ 不是 `cv*10+idx`：那是「语音包号 +

          Raycaster/Live2dChar）里根本没有 Breath，而 74~85% 的 idle 已自带动 ParamAngleX/Y/Z +
          ParamBodyAngleX 曲线，这层会在动作之后再叠 ±4~7.5° 的 3.2~6.5s 高频摆动 → 头部双驱动。 */
    if(im.breath&&im.breath.setParameters) im.breath.setParameters([]);
    /* ⑤ 循环相位参数按量程**回绕**（取证见 docs/TROUBLESHOOTING.md §123）：Cubism 官方语义是
          "值超出 [min,max] 就按量程取模回绕"（Unity 原生 framework 走 CubismMath::ModF），而 vendored
          pixi-live2d-display 0.4.0 的 setParameterValueByIndex 只做 min/max 硬钳——整包 119,922 字节里
          字符串 "repeat" 出现 **0 次**，它压根不知道有这回事。安土因此丢掉的动作：
          MB_wutixialuoxunhuangz 量程 [0,3] 而 idle 曲线是 0→5.867 的一条直线 ⇒ 花瓣掉到 11.25s 就冻住
          （实测在 max 上的平台 11.1s，占一个 22s 循环的 44%）；GL1~GL14 光扫、bowen 波纹同理。
          ⚠️ 判据**不是 moc3 的 repeat 标志**：安土 52 个 repeat=1 参数里混着 ParamForearmRAngle
          （右前臂角，量程 [-30,30]，home 曲线 -59…9 带 8 次复位）这类**振荡型**参数，一律回绕会让它
          从 -59° 瞬间跳到 +1° —— 用户实测症状是「选 home 时手会消失」。所以只对上面 markPhase 登记的

    (()=>{ try{ const CP=im.coreModel&&Object.getPrototypeOf(im.coreModel);
        if(!CP||CP.__repeatWrap||typeof CP.setParameterValueByIndex!=='function') return;
        const orig=CP.setParameterValueByIndex;
        CP.setParameterValueByIndex=function(ix,val,w){
          const S=this.__phaseSet;                                // 逐模型登记，见上面 markPhase
          if(S&&S.has(ix)&&typeof val==='number'&&isFinite(val)){
            const PR=this&&this._model&&this._model.parameters;   // 打在原型上，必须用 this 取自己那份缓冲
            if(PR){ const mn=PR.minimumValues[ix], mx=PR.maximumValues[ix], sp=mx-mn;
              if(sp>0&&(val>mx||val<mn)) val=mn+((val-mn)%sp+sp)%sp; } }

      }catch(e){} })();
    /* startMotion 必须显式给 index：传 null 会让库取 motion[group][null] → undefined 而静默失败。
       用户触发的动作一律 FORCE：库的 state.reserve() 会拒绝 ≤ 当前优先级的请求（idle 占 IDLE=1），
       不 FORCE 就连点第二个部位都放不出来。回落 idle 交给运行时（见 ②），不再需要定时器。 */
    const played=new Set();
    const play=g=>{ if(!g) return false;
      if(l2Paused) l2SetPaused(false);         // 用户重新挑动作=明确要放开冻结（运行时自己回落 idle 不走这里）
      try{ playVoice(g);
        mm.startMotion(g,0,MP.FORCE);
        if(g!==idleGroup) played.add(g); return true; }catch(e){ return false; } };
    /* ---------- 非 idle 动作的参数残留复位（docs/TROUBLESHOOTING.md §21 末段） ----------
       touch_idle1（安土「午夜的瑰色电梯」）动画 252 条曲线，其中 15 条 idle 从不驱动；clip 播完
       没有任何曲线把它们写回去 → 整体位移停在末帧 → 57 个判定区全部被甩出画布，用户「进去就出不来」。
       游戏侧靠 change_in/home 状态机复位，我们没有状态机，于是按「刚播过的 clip 驱动、而 idle 不驱动」
       的参数回落到 moc3 默认值（= 加载时的静止位，因为这些参数在静止态本就没人动）。
       两条约束防止误伤：① 只碰播过的 clip 驱动过的参数，物理/眨眼/口型等 clip 无关参数一律不动；
       ② 只在回到 idle（或队列空）时才复位，且先等 REST_DELAY 让上一条 clip 的淡出跑完，再线性渐变过去。 */
    const REST_DELAY=400, REST_MS=700, cm=im.coreModel;
    /* 暂停态：真正的按钮与存档在下面的「控制条」一节，但 restTick / play 这两个每帧或随时会跑的
       回调要靠它自检，所以状态声明在这里（放在后面会让本文件早期就存在跨引用）。
       l2Now() = 模型时钟（暂停期间不推进），用来报「这一帧是这条动作的第几秒」。 */
    let l2Paused=false, l2PauseT0=0, l2HeldMs=0, l2GroupT0=0, l2GroupLast=null;
    const l2Now=()=>performance.now()-l2HeldMs;
    let rest=null;
    /* window.__noRest=true 关掉这层复位（无头取证开关，与 __ambOff 同类）：
       用来做「部件闪一下」的 A/B —— 见 scripts/diag/l2d_part_flicker_probe.py。 */
    const restTick=()=>{ if(window.__noRest){ rest=null; return; }
      if(l2Paused) return;                       // 暂停期间冻住复位渐变，否则恢复瞬间会跳（t0 平移见 l2SetPaused）
      const cg=mm.state&&mm.state.currentGroup;
      if(cg&&cg!==idleGroup){ rest=null; return; }
      if(!rest){ const idleS=paramSets[idleGroup]; if(!idleS||!played.size) return;
        const want=new Set(); played.forEach(g=>{ (paramSets[g]||new Set()).forEach(p=>{ if(!idleS.has(p)) want.add(p); }); });
        played.clear();
        const items=[];
        want.forEach(p=>{ let i=-1; try{ i=cm.getParameterIndex(p); }catch(e){}
          if(i>=0&&!ambIdx.has(i))
            try{ items.push([i, cm.getParameterValueByIndex(i), cm.getParameterDefaultValue(i)]); }catch(e){} });
        if(!items.length) return;
        rest={items, t0:performance.now()+REST_DELAY}; return; }
      const el=performance.now()-rest.t0; if(el<0) return;
      const k=Math.min(1, el/REST_MS);

    /* 探针专用：把产品自己的复位状态交出去（暂停门要判"渐变在飞时恢复会不会跳"，

    window.__restDbg=()=>rest?{items:rest.items.length, el:Math.round(performance.now()-rest.t0)}:null;
    /* ---------- 环境层（effect）常驻叠加 ----------
       源包 AnimatorController 里 `effect` 不是「一条可选动作」，而是**独立一层的默认状态**
       （层权重 1.0、Override、Loop=true；判据与全库普查见 §117，本轮又逐状态核过 m_Speed 全为 1.0）。
       画廊只播 pose 层的动作 ⇒ 只有环境层会动的参数全停在初始位——用户圈的"钉在底画上的 5 片花瓣"
       就是这一类：`Paramfh`（量程 [0,10]）只在 effect 里是 0→2000 的单调斜坡，idle/home/main 全是常量 0。
       ⚠️ 写谁：**effect 里非常值、且任何 pose clip 都不动**的参数（`poseDriven` 之外）。
         上一版这里默认"照源包语义盖住 pose 层"，实测虽然运动量更接近游戏（47.7‰ vs 35.6‰，
         游戏角色区 125.8‰），但会把 pose 正在动的参数逐帧硬写到环境层的值上——用户报的
         "有的组件蠢蠢欲动/突然消失一下"正是这个形状，所以这次**默认让位**，
         要复现盖住行为用 `window.__ambMask=true`（反向 A/B 开关，量运动量时用）。
         常量曲线一律不写：它会把 pose 正在动的参数钉死（实测 15 个模型受影响，mingji_2 达 70 个）。
       写在 afterMotionUpdate（库在 motionManager.update 之后、coreModel.update 之前 emit），
       并且**不进队列管理器**：进了队列，播一次 touch_* 就把环境层挤到末位，回落时反过来盖住它。
       `window.__ambOff=true` 是无头取证的关闭开关，UI 上没有入口。 */
    const ambIdx=new Set();
    const cubic=(a,b,c,d,u)=>{ const m=1-u; return m*m*m*a+3*m*m*u*b+3*m*u*u*c+u*u*u*d; };
    const segValue=(x,t)=>{ if(t<=x.t0) return x.v0; if(t>=x.t1) return x.v1;
      if(x.c1x===undefined){ const d=x.t1-x.t0; return d<=0? x.v1 : x.v0+(x.v1-x.v0)*(t-x.t0)/d; }
      let lo=0, hi=1;                       // 控制点 x 落在段内 ⇒ 单调，二分必收敛
      for(let k=0;k<26;k++){ const mid=(lo+hi)/2;

      return cubic(x.v0,x.c1y,x.c2y,x.v1,(lo+hi)/2); };
    let amb=null, ambDur=0, ambT0=0;
    (async()=>{ const defs=(mm.definitions||{})[AMB]; if(!defs||!defs.length) return;
      let j=null;
      try{ const r=await fetch(P+model+'/'+defs[0].File); if(!r.ok) return; j=await r.json(); }
      catch(e){ return; }
      const dur=j&&j.Meta&&+j.Meta.Duration; if(!(dur>0)||!j.Curves) return;
      markPhase(j);                          // 让补丁 ⑤ 认识 effect 里的相位参数（Paramfh/bowen 这类长坡）
      const list=[];
      for(const c of j.Curves){
        if(c.Target!=='Parameter') continue;
        const id=curveId(c), s=c.Segments; if(!id||!s||s.length<4) continue;
        const sg=motionSegs(s); if(!sg) continue;
        const rg=curveRange(sg); if(rg[1]-rg[0]<=1e-6) continue;        // 常量曲线不写
        let idx=-1; try{ idx=cm.getParameterIndex(id); }catch(e){}
        if(idx<0) continue;

        held:amb.filter(c=>!poseDriven.has(c.id)).length,
        yieldToPose:amb.filter(c=>poseDriven.has(c.id)).map(c=>c.id).slice(0,20) });

        const t=((performance.now()-ambT0)/1000)%ambDur;

          try{ cm.setParameterValueByIndex(c.idx,v); }catch(e){} } });
    })();

       `Animator.Play()` 瞬时切换，值一帧跳过去、从不落进死区；我们为了治 §6.35 的"姿态硬跳"把库的交叉
       淡化留住了 ⇒ 值被平滑插值 ⇒ **必穿死区** ⇒ 观感就是"切动作那一下两只手一起没"。
       ⇒ 只把**开关类**参数改成瞬时，姿态类照常淡化。开关类由离线判据算（脚本见表里的 generatedBy）：
         ① 该参数在探针臂 ⑤ 的「参数→mesh 显隐」台账里（它真的会改变某个 ArtMesh 的不透明度）；
         ② 切换前后跨过台账里的翻转点（= 这一淡会改变"哪些美术在画"）；
         ③ 探针臂 ⑨ 实测它在量程内的**几何位移**够小 —— `ParamForearmLAngle` 这类"既绑显隐又形变"的

       ⚠️ 表文件不存在 = 这层完全不存在：没跑过判据的模型，行为与改动前逐帧相同（不留"空表跑过"的假成功）。
       `window.__snapOff=true` 是取证用的反向开关（A/B 靠它，UI 上没有入口）；表里 maxjump 之外的参数不钉。 */
    const snapP=Object.create(null);                  // 参数索引 -> {flips,mn,mx,step,maxjump}

    const snapReadyP=new Promise(r=>{ snapReadyResolve=r; });
    const finishSnapReady=()=>{ if(!snapReadyDone){ snapReadyDone=true; snapReadyResolve(); } };
    const snapUrl=P+model+'/'+String(model).split('/').pop()+'.snapswitch.json';
    window.__snapDbg=()=>({url:snapUrl, state:'loading'});
    (async()=>{ let j=null;
      try{ const r=await fetch(snapUrl);
        if(!r.ok){ window.__snapDbg=()=>({url:snapUrl, state:'http-'+r.status}); finishSnapReady(); return; }
        j=await r.json(); }
      catch(e){ window.__snapDbg=()=>({url:snapUrl, state:'err '+String(e)}); finishSnapReady(); return; }
      const ps=j&&j.params, cl=j&&j.clips;
      if(!ps||!cl){ window.__snapDbg=()=>({url:snapUrl, state:'no-params-or-clips'}); finishSnapReady(); return; }
      const mj=(+j.maxjump>0)? +j.maxjump:0.5, ix=Object.create(null);
      for(const name in ps){ let k=-1; try{ k=cm.getParameterIndex(name); }catch(e){}

        for(const name in row){ const k=ix[name]; if(k===undefined) continue; o[k]=row[name]; nn++; }

    const loadSnapKeys=(g,i)=>{
      const key=snapClipKey(g,i);
      if(snapKeyLoads[key]) return snapKeyLoads[key].promise||Promise.resolve(snapKeyLoads[key]);
      const defs=mm.definitions&&mm.definitions[g], d=defs&&defs[i];
      const rec={state:'loading',group:g,index:i,file:d&&d.File||null,curves:0,parameterCurves:0,error:'',promise:null};
      snapKeyLoads[key]=rec;
      if(!d||!d.File){ rec.state='no-file'; return Promise.resolve(rec); }
      rec.promise=(async()=>{ try{
        const r=await fetch(P+model+'/'+d.File);
        if(!r.ok) throw new Error('HTTP '+r.status);
        const j=await r.json(); if(!Array.isArray(j.Curves)) throw new Error('no-Curves');
        const sets=Object.create(null), ids=Object.create(null);
        for(const c of j.Curves){ if(!c||c.Target!=='Parameter') continue;
          const id=curveId(c); if(!id) continue;
          let idx=-1; try{ idx=cm.getParameterIndex(id); }catch(e){}
          if(idx<0) continue;
          const sg=motionSegs(c.Segments||[]); if(!sg) continue;
          const values=[sg[0].v0]; for(const x of sg) values.push(x.v1);
          const finite=values.filter(Number.isFinite); if(!finite.length) continue;

    };

      const st=mm.state||{}, g=st.currentGroup||null, raw=Number(st.currentIndex);
      const i=Number.isInteger(raw)&&raw>=0?raw:null, key=(g&&i!==null)?snapClipKey(g,i):null;
      const rec=key?snapKeyLoads[key]:null, book=key?snapKeyBooks[key]:null;
      const targets=book?Object.keys(book.keys).filter(k=>Object.prototype.hasOwnProperty.call(snapP,k)):[];

        switchKeys:targets.reduce((n,k)=>n+book.keys[k].length,0),
        switchParams:targets.map(k=>({id:book.ids[k],keys:book.keys[k]})),gate:snapMidGate.slice(),
        frames:snapKeyStats.frames,writes:snapKeyStats.writes,changed:snapKeyStats.changed,
        changedIds:Array.from(snapKeyStats.changedIds).sort(),last:snapKeyStats.last,error:rec&&rec.error||''};
    };
    window.__snapKeyWait=async()=>{
      await snapReadyP;
      const st=mm.state||{}, g=st.currentGroup||null, raw=Number(st.currentIndex);
      if(!g||!Number.isInteger(raw)||raw<0) return window.__snapKeyDbg();
      return await loadSnapKeys(g,raw), window.__snapKeyDbg();
    };
    const fadeOf=(g,key)=>{ const d=g&&mm.definitions&&mm.definitions[g]&&mm.definitions[g][0];
      return d&&typeof d[key]==='number'? d[key]:0.5; };
const origStartMotion=mm.startMotion.bind(mm);
    mm.startMotion=(g,i,mode,opt)=>{
      /* snapPending 不再在这里无条件置位：reserve() 拒绝（同 group+index 正在播、优先级不足）
         时 `_startMotion` 不会执行，置位了就会让 beforeMotionUpdate 误触发 snapHold ——
         把正在播动作的 Param25/27 钉回 clip 起点 0.5/0.7（手势短暂错误 / 手消失瞬态）。

    /* 抓"切换前的实际值"必须写在 beforeMotionUpdate：afterMotionUpdate 之后缓冲里已经是混合值了。

       且**不许超过该值在源 clip 里恒定的秒数** —— 超过就钉到了一个 clip 自己后面会走的值上。 */
    im.on('beforeMotionUpdate',()=>{
      const st=mm.state, g=st? st.currentGroup:null;
      const changed=snapPending||(g!==snapPrevG);

      if(!changed) return;

      snapHold=null;
      if(!rows||window.__snapOff||!Object.keys(snapP).length) return;
      /* 淡化窗口：实测 idle↔home 的交叉淡化跑满 ~2s（库取的是两条动作各自 fade 的较大者，
         不止入参那条的 FadeInTime），所以四个值全取大者再 +0.2 余量；上限是该值在源 clip 里
         真正恒定的秒数（表里 clips[g][p][1]），钉过头会钉到一个 clip 自己后面会走的值上。 */
      const win=Math.max(fadeOf(g,'FadeInTime'), fadeOf(g,'FadeOutTime'),
                         fadeOf(prevG,'FadeInTime'), fadeOf(prevG,'FadeOutTime'))+0.2;
      const items=[];
      for(const k in rows){ const idx=+k, hv=rows[k], cfg=snapP[idx];
        if(!cfg||!hv||!(cfg.mx>cfg.mn)) continue;
        const from=cm.getParameterValueByIndex(idx), to=+hv[0], sp=cfg.mx-cfg.mn;
        if(!(Math.abs(to-from)>1e-6)) continue;
        const lo=Math.min(from,to), hi=Math.max(from,to);
        let cross=0; for(const f of cfg.flips) if(f>lo+1e-4*sp&&f<hi-1e-4*sp) cross++;
        if(!cross) continue;
        let jump=0; const step=cfg.step, n=step.length-1;
