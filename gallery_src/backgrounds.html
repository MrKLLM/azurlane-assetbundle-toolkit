<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>背景库 · 碧蓝航线资产浏览器</title>
<script>/* 与 index.html 同一条规则：先定主题再渲染，否则刷新闪一下默认色 */try{document.documentElement.dataset.theme=localStorage.getItem('gallery.theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
<!-- 配色/圆角/弹性只有正本 theme.css（与 index.html、bgm.html 共用）。
     ⚠️ 本文件的组件规则里不许出现字面颜色：所有透明层都用 color-mix() 从 token 派生，
        这样「昼/夜」两套主题会一起动，不会只有一边对。 -->
<link rel="stylesheet" href="theme.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Segoe UI',"Microsoft YaHei",system-ui,sans-serif;color:var(--txt);
  min-height:100vh;overflow-x:hidden;
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed}

/* ── 环境光：与音乐库同一条规则，只有透明度在动 ── */
.amb{position:fixed;inset:-20% -10%;z-index:-1;pointer-events:none;overflow:hidden}
.amb i{position:absolute;display:block;border-radius:50%;filter:blur(70px);opacity:.45;
  animation:drift 52s var(--ease-ios) infinite alternate}
.amb i:nth-child(1){width:50vw;height:50vw;left:-8vw;top:-12vw;
  background:radial-gradient(circle at 40% 40%,color-mix(in srgb,var(--brand) 38%,transparent),transparent 68%)}
.amb i:nth-child(2){width:42vw;height:42vw;right:-6vw;top:24vh;animation-duration:67s;animation-delay:-16s;
  background:radial-gradient(circle at 60% 45%,color-mix(in srgb,var(--pop) 26%,transparent),transparent 66%)}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(4vw,-3vh,0) scale(1.12)}}

header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:14px 22px;background:var(--nav-bg);border-bottom:1px solid var(--nav-line);
  backdrop-filter:blur(var(--nav-blur)) saturate(1.5);-webkit-backdrop-filter:blur(var(--nav-blur)) saturate(1.5)}
/* 下沿那条"厚边墙"：14px 实心带，折射强度明显高于栏体 —— 与首页导航栏同一手法（§133/§136）。
   z-index:-1 才落在"栏体背景之上、栏内文字之下"：header 自己有 z-index ⇒ 它是层叠上下文，
   负值子元素会压回背景上面，不会钻到背景底下去（那样这条带子就整个看不见）。
   ⚠️ 这条带子从不被 3D 旋转，所以它可以挂遮罩/折射；卡片行不行见 §136。 */
header::before{content:'';position:absolute;left:0;right:0;bottom:0;height:var(--nav-rim-h,14px);
  pointer-events:none;z-index:-1;
  -webkit-backdrop-filter:blur(var(--nav-rim)) saturate(2.2) brightness(1.14);
  backdrop-filter:blur(var(--nav-rim)) saturate(2.2) brightness(1.14)}
/* var() 一律带兜底：自定义属性解析失败是**整条声明作废**，兜底写成上一版那条纯模糊，
   最坏情况退回旧观感，而不是那一圈整个消失。 */
html.lg header.hglg::before{
  -webkit-backdrop-filter:blur(var(--lg-blur,1px)) saturate(1.9) brightness(1.10) var(--lgf,blur(17px) saturate(2.2) brightness(1.14));
  backdrop-filter:blur(var(--lg-blur,1px)) saturate(1.9) brightness(1.10) var(--lgf,blur(17px) saturate(2.2) brightness(1.14))}
header h1{font-size:19px;font-weight:650;color:var(--title);letter-spacing:.4px}
header .back{font-size:13px;color:var(--txt2);text-decoration:none;padding:6px 12px;border-radius:var(--r-chip);
  border:1px solid var(--chip-line);background:var(--chip);transition:color var(--t-col) var(--ease-ios),
  transform .16s var(--ease-ios)}
header .back:hover{color:var(--on-txt)}
header .back:active{transform:scale(.97)}
header .sub{font-size:12.5px;color:var(--dim)}
header .sp{flex:1}

.opt{display:inline-flex;background:var(--chip);border:1px solid var(--chip-line);border-radius:var(--r-chip);
  padding:3px;gap:2px}
.opt button{border:0;background:transparent;color:var(--txt2);font-size:12.5px;padding:5px 12px;
  border-radius:var(--r-chip);cursor:pointer;transition:all var(--t-col) var(--ease-ios)}
.opt button.on{background:var(--on-bg);color:var(--on-txt);box-shadow:inset 0 0 0 1px var(--on-ring)}

.wrap{max-width:1560px;margin:0 auto;padding:18px 22px 56px}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.q{flex:1;min-width:240px;font-size:14px;color:var(--txt);background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r-in);padding:10px 14px;outline:none;
  transition:box-shadow var(--t-col) var(--ease-ios),border-color var(--t-col) var(--ease-ios)}
.q:focus{border-color:var(--on-ring);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 16%,transparent)}
.grp{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.grp>span{font-size:12px;color:var(--dim);margin-right:2px}
.chip{font-size:12.5px;color:var(--txt2);background:var(--chip);border:1px solid var(--chip-line);
  border-radius:var(--r-chip);padding:5px 12px;cursor:pointer;
  transition:all var(--t-col) var(--ease-ios)}
.chip:hover{color:var(--txt)}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--on-bg);color:var(--on-txt);box-shadow:inset 0 0 0 1px var(--on-ring)}
.chip b{font-weight:600;opacity:.7;margin-left:5px;font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);
  overflow:hidden;cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 190px;
  box-shadow:var(--sh1);transition:transform .2s var(--ease-ios),box-shadow .2s var(--ease-ios)}
.card:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.card .ph{width:100%;aspect-ratio:16/9;background:var(--panel2);display:block;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
/* 缩略图缺失要**看得见**：画一条斜纹底 + 一行字，不留"格子在但空着"的静默失败 */
.card.miss .ph{background:var(--stage)}
.card.miss .ph::after{content:'缩略图缺失';display:block;padding:14px;font-size:11px;color:var(--dim)}
.card.miss .ph img{display:none}
.card .nm{padding:9px 11px 10px}
.card .t1{font-size:13.5px;font-weight:600;color:var(--txt);line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:18px}
.card .t2{font-size:11px;color:var(--dim);margin-top:3px;font-family:ui-monospace,Consolas,monospace;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:8px;left:8px;font-size:10.5px;font-weight:600;padding:3px 8px;
  border-radius:var(--r-chip);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.badge.exact{background:color-mix(in srgb,var(--ok) 78%,transparent);color:var(--panel)}
.badge.baked{background:color-mix(in srgb,var(--pop) 78%,transparent);color:var(--panel)}
.badge.inferred{background:color-mix(in srgb,var(--brand) 74%,transparent);color:var(--panel)}
.badge.none{background:color-mix(in srgb,var(--dim) 62%,transparent);color:var(--panel)}
/* 变体角标与命名档徽章同位但不同色：`_hx` 是和谐版、`__N` 是同名另一张，都不是"另一档名字" */
.badge.var{top:auto;bottom:8px;left:8px;background:color-mix(in srgb,var(--pop) 70%,transparent);color:var(--panel)}

/* ── 二级下拉（「其他」展开成子类目 / 场景背景按词根细分）── */
.sel{font:inherit;font-size:12.5px;color:var(--txt);background:var(--chip);border:1px solid var(--chip-line);
  border-radius:var(--r-chip);padding:5px 10px;cursor:pointer;max-width:340px;
  transition:box-shadow var(--t-col) var(--ease-ios)}
.sel:focus{outline:none;border-color:var(--on-ring);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 16%,transparent)}
.grp[hidden]{display:none}

/* ── 「默认藏了多少」必须常驻可见 ──
   筛选把图藏起来而页面上没有任何痕迹，是这类图库最恶性的失效：用户会以为库里有 1,139 张。
   所以隐藏条数不是一句 toast，而是与 chip 同区的常驻行，且**按当前搜索范围**算
   （搜"温泉"结果空了，得能看出是被「画面」筛掉的，而不是"库里没有"）。 */
.hint{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--txt2);
  background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-in);
  padding:8px 12px;margin:0 0 12px}
.hint[hidden]{display:none}
.hint b{font-weight:600;color:var(--txt);font-variant-numeric:tabular-nums}
.hint button{font:inherit;font-size:12px;color:var(--on-txt);background:var(--chip);
  border:1px solid var(--chip-line);border-radius:var(--r-chip);padding:4px 10px;cursor:pointer}

/* ── 全屏壁纸模式：只留图，UI 全隐 ── */
.fs{position:fixed;inset:0;z-index:90;display:none;background:var(--stage)}
.fs.on{display:block}
.fs img{width:100%;height:100%;object-fit:contain;display:block}
.fs .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 20px;font-size:13px;color:var(--on-txt);
  background:linear-gradient(0deg,color-mix(in srgb,var(--stage) 82%,transparent),transparent);
  display:flex;gap:14px;align-items:center}
.fs .cap b{font-weight:600}
.fs .cap .sp{flex:1}
.fs button{font:inherit;font-size:12.5px;color:var(--on-txt);cursor:pointer;
  background:color-mix(in srgb,var(--stage) 55%,transparent);border:1px solid color-mix(in srgb,var(--txt) 22%,transparent);
  border-radius:var(--r-chip);padding:6px 12px}

/* ── 详情层 ── */
.ov{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:var(--mask);padding:24px}
.ov.open{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-panel);
  box-shadow:var(--sh3);max-width:1180px;width:100%;max-height:92vh;overflow:auto;
  display:grid;grid-template-columns:1fr 320px;gap:0}
/* ⚠️ overflow:hidden 必须有：放大是靠 transform 做的，**不改变布局尺寸**，
   不加这一条放大的图会直接盖到右边的信息栏上（而且不会出现滚动条，看不出越界）。 */
.sheet .imgbox{background:var(--stage);display:flex;align-items:center;justify-content:center;
  min-height:320px;position:relative;overflow:hidden}
.sheet .imgbox img{max-width:100%;max-height:88vh;display:block}
/* 缩放/平移：光标下那个点要跟着光标走，所以 transform-origin 固定 0 0，位移自己算 */
.sheet .imgbox img,.fs img{transform-origin:0 0;transition:none;will-change:transform}
.sheet .imgbox img{cursor:zoom-in}
.sheet .imgbox.zoomed img,.fs.zoomed img{cursor:grab}
.sheet .imgbox.grabbing img,.fs.grabbing img{cursor:grabbing}
.zbadge{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;
  min-width:46px;text-align:center;align-self:center}
.zhint{font-size:11px;color:var(--dim);margin-left:auto;align-self:center}
.sheet .side{padding:20px;border-left:1px solid var(--line)}
.sheet h2{font-size:17px;color:var(--title);margin-bottom:4px;line-height:1.35}
.sheet .en{font-size:12px;color:var(--dim);font-family:ui-monospace,Consolas,monospace;word-break:break-all}
.kv{margin:16px 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px}
.kv dt{color:var(--dim)}.kv dd{color:var(--txt2)}
.ev{margin-top:14px}
.ev h3{font-size:12px;color:var(--dim);font-weight:600;margin-bottom:8px;letter-spacing:.4px}
.ev .row{font-size:12px;color:var(--txt2);padding:7px 10px;background:var(--panel2);
  border-radius:var(--r-in);margin-bottom:6px;line-height:1.45}
.ev .row .src{display:block;color:var(--dim);font-size:10.5px;font-family:ui-monospace,Consolas,monospace;
  margin-top:2px;word-break:break-all}
.nav{display:flex;gap:8px;margin-top:18px}
.nav button,.nav a.dl{flex:1;font-size:12.5px;color:var(--txt2);background:var(--chip);
  border:1px solid var(--chip-line);text-decoration:none;text-align:center;
  border-radius:var(--r-in);padding:9px;cursor:pointer;transition:all var(--t-col) var(--ease-ios)}
.nav button:hover,.nav a.dl:hover{color:var(--on-txt);box-shadow:inset 0 0 0 1px var(--on-ring)}
.nav button:active{transform:scale(.97)}
.warn{margin-top:14px;font-size:11.5px;color:var(--dim);line-height:1.6;
  border-left:2px solid var(--line);padding-left:10px}
.empty{text-align:center;color:var(--dim);padding:60px 0;font-size:13px}
@media (max-width:900px){.sheet{grid-template-columns:1fr}.sheet .side{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div class="amb"><i></i><i></i></div>
<header>
  <a class="back" href="index.html">← 资产浏览器</a>
  <h1>背景库</h1>
  <span class="sub" id="sub">载入中…</span>
  <span class="sp"></span>
  <div class="opt" id="gTheme" title="昼 / 夜配色（状态会记住）">
    <button data-t="light">昼</button><button data-t="dark">夜</button>
  </div>
</header>

<div class="wrap">
  <div class="tools"><input class="q" id="q" placeholder="搜中文名 / 英文资源名 / 系列名   （/ 聚焦）" autocomplete="off"></div>
  <div class="grp" id="gTier"><span>命名档</span></div>
  <div class="grp" id="gChar" hidden><span>画面</span></div>
  <div class="grp" id="gGroup"><span>类目</span></div>
  <div class="grp" id="gSub" hidden><span id="gSubLab">细分</span><select class="sel" id="gSubSel"></select></div>
  <div class="hint" id="gHint" hidden></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">没有符合条件的背景图</div>
</div>

<div class="fs" id="fs">
  <img id="fsimg" alt="">
  <div class="cap"><b id="fsname"></b><span id="fsen"></span><span class="zbadge" id="fsz">适配</span>
    <span class="sp"></span>
    <button id="fsprev">← 上一张</button><button id="fsnext">下一张 →</button>
    <button id="fsdl">下载原图</button><button id="fsclose">退出全屏（Esc）</button></div>
</div>

<div class="ov" id="ov">
  <div class="sheet">
    <div class="imgbox" id="ovbox"><img id="ovimg" alt=""></div>
    <div class="side">
      <h2 id="ovname"></h2>
      <div class="en" id="oven"></div>
      <dl class="kv" id="ovkv"></dl>
      <div class="ev"><h3>配置表里的出处</h3><div id="ovev"></div></div>
      <div class="warn" id="ovwarn"></div>
      <div class="nav">
        <button id="ovprev">← 上一张</button>
        <button id="ovnext">下一张 →</button>
        <button id="ovfs">全屏看壁纸</button>
        <a class="dl" id="ovdl" download>下载原图</a>
        <button id="ovclose">关闭（Esc）</button>
        <span class="zbadge" id="ovz">适配</span>
        <span class="zhint">滚轮缩放 · 拖拽平移 · 双击 1:1</span>
      </div>
    </div>
  </div>
</div>

<script src="liquid_glass.js"></script>
<script>
/* 命名四档的语义（与 scripts/build_bg_meta.py 一致，页面不许自己升档）：
   exact    这张图自己被配置表的背景字段整值引用，且那行有中文名 → 中文关卡名
   inferred 这张图自己没有引用，同词根兄弟图有 → 只给「系列名」，不冒充具体关卡
   baked    配置表查不到、但名字烤在横幅像素里（`*_tip` 那一族）→ 单列一档，
            它是**第二条源**（OCR + 目视双路径），证据强度与"表字段整值"不同，不许并进「确定」
   none     三档都没有 → 显示类目的中文说明。⚠️ 类目说明是**我对目录名的归类描述**，
            不是这张图的资产名，所以徽章单列一档，页面上也必须写出来 */
const $=id=>document.getElementById(id);
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
const mb=b=>b>=2**20?(b/2**20).toFixed(1)+' MB':(b/2**10).toFixed(0)+' KB';
/* 游戏里写的是「起舞于天原之上·下篇|| ||CHAPTER EX||E.X.」——`||` 之后是排版串，不是名字 */
const clean=s=>(s||'').split('||')[0].trim();
const TIER={exact:'确定',baked:'图内文字',inferred:'推断',none:'类目说明'};

let ALL=[],view=[],fTier='',fGroup='',fSub='',fChar='shown',q='',cur=-1,META=null;
/* 「画面」这一维是**人工逐格标注**（inputs/gamecfg/bg_char_flags.json，经 build_bg_meta 透传）。
   默认 `shown` = 只藏起明确判过「无角色」的，**没判过的照常显示**（用户 2026-10-07 定的口径）：
   标注只覆盖 1,305 张场景背景，登录/其他类目共 604 张从没判过，把"没字段"当 0 就是静默藏图。
   索引缺这个字段时（发布件没跑）整组 chip 不建、fChar 退回 ''，页面显示全部 —— 不假装在筛。 */
function charOk(it){
  if(fChar==='shown')return it.has_char!==0;
  if(fChar==='has')return it.has_char===1;
  if(fChar==='no')return it.has_char===0;
  if(fChar==='unk')return it.has_char==null;
  return true;
}
/* 隐藏条数按**其余筛选都作用之后**的池子算：搜「温泉」搜空了，要能看出是「画面」筛挡的 */
function charHidden(){
  const kw=q.trim().toLowerCase();
  const pool=ALL.filter(it=>(!fTier||it.tier===fTier)&&(!fGroup||it.group===fGroup)
                            &&(!fSub||subVal(it)===fSub)&&(!kw||hay(it).includes(kw)));
  return pool.length-pool.filter(charOk).length;
}
/* 一级只剩 3 个类目（scene/login/other），二级用下拉：
   other → 6 个子类目；scene → 词根分组（`META.roots`，中文名来自 P3 词典，拿不到就是词根原文）。
   下拉而不是平铺 chip：other 的 6 类与 scene 的 117 个词根铺出来会把网格挤出首屏。 */
const SUB_LABELS={other:'子类目',scene:'系列（词根）'};

/* 懒加载交给浏览器原生两件套：卡片 `content-visibility:auto`（屏幕外不解码）+ 图 `loading="lazy"`。
   这里**不再挂 IntersectionObserver** —— 实测连着的应用内浏览器页 `innerHeight=0`，
   IO 于是永远不判相交，靠 IO 出图的网格会整页空白（2026-10-07 抓到）。
   直接写 src 就没有"探针不触发就没画面"这条失效路径，省内存的活由 content-visibility 做。
   缩略图缺失时给 `.miss` 标记，不留"看着有格子其实点不开"的伪装成功。 */

function title(it){
  /* `X__2` 是「同一个包里另一张同名但内容不同的画」（见 export_assets 的 dedupe=distinct）。
     它没有自己的资产名 —— 配置表按名字引用，同一个名字对应两张画时分不清是哪一张，
     所以这里只报"同名另一张"，不冒充有名字。 */
  if(it.same_name_of) return it.same_name_of+'（同名另一张）';
  if(it.tier==='exact'||it.tier==='baked') return clean(it.cn[0] && it.cn[0].cn) || it.name;
  if(it.tier==='inferred') return it.series || ('同系列 ' + (it.root || it.name));
  return (META.dirs[it.dir] && META.dirs[it.dir].cn) || it.dir;
}
function hay(it){
  return [it.name,it.root,it.series,it.dir,it.group,title(it),
          (META.dirs[it.dir]||{}).cn||'',(META.roots[it.root]||{}).cn||'',
          (it.cn||[]).map(x=>clean(x.cn)).join(' ')].join(' ').toLowerCase();
}
let ROOT_BIG=new Set();
function subVal(it){
  if(it.group==='other')return it.dir;
  if(it.group!=='scene')return '';
  const r=it.root||'';
  return r?(ROOT_BIG.has(r)?r:'__rest'):'__';
}
function apply(){
  const kw=q.trim().toLowerCase();
  view=ALL.filter(it=>(!fTier||it.tier===fTier)&&(!fGroup||it.group===fGroup)
                       &&(!fSub||subVal(it)===fSub)&&(!kw||hay(it).includes(kw))&&charOk(it));
  const g=$('grid'); g.innerHTML='';
  const frag=document.createDocumentFragment();
  for(const it of view){
    const c=document.createElement('div'); c.className='card'; c.dataset.k=it.key;
    const ar=(it.w&&it.h)?(it.w+'/'+it.h):'16/9';
    const vt=it.variant==='hx'?'和谐版':(it.same_name_of?'同名另一张':'');
    c.innerHTML='<span class="badge '+it.tier+'">'+TIER[it.tier]+'</span>'+
      (vt?'<span class="badge var">'+vt+'</span>':'')+
      '<div class="ph" style="aspect-ratio:'+ar+'"><img src="'+it.thumb+'" alt="" loading="lazy"></div>'+
      '<div class="nm"><div class="t1">'+esc(title(it))+'</div>'+
      '<div class="t2">'+esc(it.name)+' · '+mb(it.bytes)+'</div></div>';
    c.addEventListener('click',()=>open(it.key));
    const im=c.querySelector('img');
    im.addEventListener('error',()=>{c.classList.add('miss');
      c.title='缩略图取不到: '+it.thumb;},{once:true});
    frag.appendChild(c);
  }
  g.appendChild(frag);
  $('empty').style.display=view.length?'none':'';
  $('sub').textContent=view.length+' / '+ALL.length+' 张 · '
    +['exact','baked','inferred','none'].map(t=>TIER[t]+' '+(META.counts[t]||0)).join(' · ');
  paintHint();
}
function paintHint(){
  const h=$('gHint'), hid=META.char?charHidden():0;
  if(!hid){ h.hidden=true; h.innerHTML=''; 
    if(!view.length&&q.trim()) $('empty').textContent='没有符合条件的背景图';
    return; }
  h.hidden=false;
  const why=fChar==='has'?'（仅确认有角色，未标注的也一并藏了）'
          :(q.trim()?'（按当前搜索范围算）':'');
  h.innerHTML='<span>「画面」筛选正藏着 <b>'+hid+'</b> 张'+why+(META.char.unlabeled
      ?'；另有 <b>'+META.char.unlabeled+'</b> 张登录/其他类目从没标注，仍照常显示':'')
    +'。</span><button id="hintAll">看全部</button>';
  $('hintAll').addEventListener('click',()=>setChar(''));
  if(!view.length) $('empty').textContent='这些条件下没有图 —— 但「画面」筛选还藏着 '+hid+' 张，点上方「看全部」';
}
function setChar(v){ fChar=v; syncChips('gChar',v); apply(); }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

/* chip **只建一次**，之后就地改 `.on`。
   原来每次点击都 `renderFilters()` 重建整组节点，后果有两个：
   ① 焦点/滚动位置丢，② 任何持旧节点引用的调用（键盘、自动化验收）点到的是
      已脱离 DOM 的按钮 —— 表现为"筛选叠着没解开"，看着像产品的过滤 bug。 */
function buildChips(host,items,onPick){
  const h=$(host);
  for(const it of items){
    const b=document.createElement('button'); b.className='chip'; b.dataset.v=it.v;
    b.innerHTML=esc(it.label)+(it.n!=null?'<b>'+it.n+'</b>':'');
    b.addEventListener('click',()=>onPick(it.v));
    h.appendChild(b);
  }
}
function syncChips(host,val){
  for(const b of $(host).querySelectorAll('.chip')) b.classList.toggle('on',b.dataset.v===val);
}
function initFilters(){
  buildChips('gTier',[{v:'',label:'全部'},{v:'exact',label:'确定'},{v:'baked',label:'图内文字'},
                      {v:'inferred',label:'推断'},{v:'none',label:'类目说明'}],
             v=>{fTier=v;syncChips('gTier',v);apply()});
  if(META.char){
    /* 默认态 = `shown`（只藏明确判过无角色的）。标注缺失时整组不建、fChar 退回 ''，
       页面显示全部 —— 宁可少筛，也不许拿"没判过"当"无角色"藏图。 */
    const c=META.char;
    $('gChar').hidden=false;
    buildChips('gChar',[{v:'shown',label:'隐藏无角色',n:c.has+c.unlabeled},
                        {v:'',label:'全部',n:ALL.length},
                        {v:'has',label:'仅确认有角色',n:c.has},
                        {v:'no',label:'无角色',n:c.none},
                        {v:'unk',label:'未标注',n:c.unlabeled}],setChar);
    syncChips('gChar',fChar);
  }else fChar='';
  buildChips('gGroup',[{v:'',label:'全部'}].concat(
      ['scene','login','other'].map(g=>({v:g,label:META.groups[g].cn,n:META.groups[g].count}))),
             v=>{fGroup=v;fSub='';syncChips('gGroup',v);buildSub();apply()});
  $('gSubSel').addEventListener('change',e=>{fSub=e.target.value;apply()});
}
/* 二级下拉：只在下钻到「其他」或「场景背景」时出现。
   选项数按**当前一级组内**实数算，不写死阈值 —— 词根表(P3)以后补全只会变好，不该改这里。 */
function buildSub(){
  const h=$('gSub'),sel=$('gSubSel');
  sel.innerHTML='';
  if(fGroup!=='other'&&fGroup!=='scene'){h.hidden=true;fSub='';return}
  h.hidden=false;$('gSubLab').textContent=SUB_LABELS[fGroup];
  const pool=ALL.filter(i=>i.group===fGroup);
  let opts;
  if(fGroup==='other'){
    const c={};for(const i of pool)c[i.dir]=(c[i.dir]||0)+1;
    opts=Object.keys(c).sort((a,b)=>c[b]-c[a])
             .map(k=>({v:k,label:(META.dirs[k]||{}).cn||k,n:c[k]}));
  }else{
    const c={};
    for(const i of pool){const k=i.root||'';c[k]=(c[k]||0)+1}
    ROOT_BIG=new Set(Object.keys(c).filter(k=>k&&c[k]>=2));
    opts=[...ROOT_BIG].sort((a,b)=>c[b]-c[a])
             .map(k=>{
               const r=META.roots[k]||{};
               /* 三档可信度不能混着显示：pinyin=拼音整值回查到配置表原文；
                  series=同词根别张图传播来的章节名，**会错**（实测 star_level 那组 265 张
                  抽象底纹被传播成「响彻于天穹之音」）；root=只有英文/拼音标识，没编名字。 */
               const tail=r.cn_from==='series'?'（未核实）':'';
               return {v:k,label:(r.cn||k)+tail,n:c[k]};
             });
    if(Object.keys(c).some(k=>k&&c[k]<2))
      opts.push({v:'__rest',label:'其余单张系列',n:Object.keys(c).filter(k=>k&&c[k]<2).reduce((s,k)=>s+c[k],0)});
    if(c[''])opts.push({v:'__',label:'（词根取不到）',n:c['']});
  }
  const o0=document.createElement('option');o0.value='';o0.textContent='全部（'+pool.length+'）';
  sel.appendChild(o0);
  for(const o of opts){
    const e=document.createElement('option');e.value=o.v;
    e.textContent=o.label+'（'+o.n+'）';sel.appendChild(e);
  }
}

function open(key){
  const i=view.findIndex(x=>x.key===key); if(i<0) return; cur=i; paint();
  $('ov').classList.add('open');
}
function paint(){
  const it=view[cur]; if(!it) return;
  ovZ.reset();   // 换图必须回到"适配"：上一张的倍率与位移对这一张没有意义
  $('ovimg').src=it.img; $('oven').textContent=it.key+' · '+it.name;
  $('ovdl').href=it.img; $('ovdl').download=it.name+'.png';
  if($('fs').classList.contains('on')) fsPaint();
  $('ovname').textContent=title(it);
  const grp=(META.groups[it.group]||{}).cn||it.group;
  const rows=[['命名档',TIER[it.tier]+(it.tier==='inferred'?'（继承自同词根「'+it.inferred_from+'」）':'')],
              ['类目',grp+' / '+((META.dirs[it.dir]||{}).cn||it.dir)
                      +(it.root_dir&&it.root_dir!==it.dir?('（源目录 '+it.root_dir+'）'):'')],
              ['变体',it.variant==='hx'?'和谐版（_hx）'
                      :(it.same_name_of?('同名另一张，主图 '+it.same_name_of):'—')],
              /* 「没判过」必须和「判过=无角色」分开写：前者是标注覆盖面，后者是结论 */
              ['画面',it.has_char==null?'未标注（该类目没做过逐格目视标注）'
                      :(it.has_char?'有角色':'无角色')+'（人工逐格标注，非文件名规则）'],
              ['尺寸',it.w+' × '+it.h],['原图体积',mb(it.bytes)],
              ['词根',it.root||'（无）']];
  if(it.baked) rows.push(['OCR 原文',it.baked.ocr_raw+'（置信 '+it.baked.ocr_conf+'，与定稿重合 '+it.baked.overlap+'）']);
  if(it.series) rows.splice(1,0,['系列名',it.series]);
  $('ovkv').innerHTML=rows.map(r=>'<dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd>').join('');
  const ev=[];
  for(const c of (it.cn||[])){
    const srcs=(c.src||[]).map(s=>s.t+'.'+s.f+' 行 '+s.id).join(' ｜ ');
    const via=c.via?('图内烤字 · '+c.via):'';
    ev.push('<div class="row">'+esc(clean(c.cn))+(c.n>1?' <span style="opacity:.6">×'+c.n+'</span>':'')+
      ((srcs||via)?'<span class="src">'+esc(srcs||via)+'</span>':'')+'</div>');
  }
  if(it.refs&&it.refs.length&&!ev.length)
    ev.push('<div class="row">配置表引用了这张图，但那几行没有中文字段<span class="src">'+
      esc(it.refs.map(s=>s.t+'.'+s.f+' 行 '+s.id).join(' ｜ '))+'</span></div>');
  if(!ev.length) ev.push('<div class="row">配置表里没有这张图的引用</div>');
  $('ovev').innerHTML=ev.join('');
  $('ovwarn').textContent = it.tier==='exact'
    ? '「确定」= 配置表某张表的背景字段整值等于这张图的文件名，名字取自那一行的中文字段。点出处可回指到表与行。'
    : it.tier==='baked'
    ? '「图内文字」= 配置表里查不到这张图，名字是游戏自己烤在横幅像素里的。'
      + (it.baked ? '取证方式：' + it.baked.via : '')
      + '。这是与"表字段整值"独立的第二条源，所以单列一档，不与「确定」混。'
    : it.tier==='inferred'
    ? '「推断」= 这张图自己没有被引用，只有同词根的兄弟图被引用过。所以这里只给系列名（章节名），不给具体关卡 —— 我们不知道它究竟用在哪一小节。'
    : '「类目说明」是按下图所在目录给出的归类描述（依据写在下方），不是这张图的资产名；配置表里查不到它的中文名，页面不编。';
}
function close(){ $('ov').classList.remove('open'); cur=-1; $('ovimg').removeAttribute('src'); }

/* ── 全屏看壁纸 ──
   `.fs` 遮罩层自己就铺满视口，所以 `requestFullscreen()` 失败（内嵌浏览器/无头环境
   常常没有这个权限）也只是少了"真进系统全屏"，图照样铺满、键盘照样能用 ——
   不能把"能不能全屏"当成这层的前提。 */
function fsPaint(){
  const it=view[cur]; if(!it) return;
  fsZ.reset();
  $('fsimg').src=it.img; $('fsname').textContent=title(it);
  $('fsen').textContent=it.key+' · '+it.w+'×'+it.h+' · '+mb(it.bytes);
}
function fsOpen(){
  if(cur<0) return;
  $('fs').classList.add('on'); fsPaint();
  const el=$('fs');
  if(el.requestFullscreen) el.requestFullscreen().catch(()=>{
    $('fsclose').textContent='退出（Esc）';});
}
function fsClose(){
  $('fs').classList.remove('on'); $('fsimg').removeAttribute('src');
  if(document.fullscreenElement&&document.exitFullscreen) document.exitFullscreen().catch(()=>{});
}
function fsDownload(){
  const it=view[cur]; if(!it) return;
  const a=document.createElement('a'); a.href=it.img;
  a.download=it.name+'.png'; document.body.appendChild(a); a.click(); a.remove();
}

/* ── 图片缩放 / 平移（详情弹窗与全屏壁纸共用一个工厂）──
   三个坑写死在这里，改之前先读完：
   ① 放大用 transform 而不是改 width：改宽度每滚一下都触发重排，会卡。
      但 transform **不改布局尺寸** ⇒ .imgbox 必须 overflow:hidden（见上面那条 CSS），
      否则放大的图直接盖到右边信息栏上，还不出滚动条、越界看不出来。
   ② "光标底下那个点不许跑"只能自己算：origin 固定 0 0 时屏幕点 s = t + z·p，
      换倍率要保持 p 不动 ⇒ t' = c − (z'/z)(c − t)。少这一步就是"往左上角缩"。
   ③ 1:1 的基准不是 naturalWidth/clientWidth：object-fit:contain 下元素铺满视口、
      图只是里面那一块，必须先按宽高比算出**实际显示宽**再去除，否则竖图会把 1:1
      算成放大好几倍（这就是"双击之后直接糊到脸上"的成因）。 */
function zoomable(img, box, out){
  let z=1, tx=0, ty=0, drag=null;
  const dispW=()=>{ const ar=(img.naturalWidth||16)/(img.naturalHeight||9);
    return Math.max(1, Math.min(img.clientWidth||1, (img.clientHeight||1)*ar)); };
  const one=()=>{ const n=img.naturalWidth; return n? Math.max(1,Math.min(6,n/dispW())) : 2; };
  function apply(){
    img.style.transform='translate('+tx.toFixed(2)+'px,'+ty.toFixed(2)+'px) scale('+z.toFixed(4)+')';
    box.classList.toggle('zoomed', z>1.001);
    if(out) out.textContent = z>1.001 ? Math.round(z*100)+'%' : '适配';
  }
  function reset(){ z=1; tx=0; ty=0; drag=null; box.classList.remove('grabbing'); apply(); }
  function zoomAt(c,z1){
    z1=Math.max(1,Math.min(6,z1));
    if(z1<=1.001){ reset(); return; }
    tx=c.x-(z1/z)*(c.x-tx); ty=c.y-(z1/z)*(c.y-ty); z=z1; apply();
  }
  const local=e=>{ const r=box.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
  const chrome=e=>e.target.closest && e.target.closest('.cap,.nav,button,a');
  box.addEventListener('wheel',e=>{
    if(chrome(e)) return;                 // 底部按钮条上滚轮不该缩放
    e.preventDefault();
    zoomAt(local(e), z*(e.deltaY<0?1.16:1/1.16));
  },{passive:false});
  box.addEventListener('pointerdown',e=>{
    if(z<=1.001||chrome(e)) return;
    drag={x:e.clientX-tx,y:e.clientY-ty}; box.setPointerCapture(e.pointerId);
    box.classList.add('grabbing');
  });
  box.addEventListener('pointermove',e=>{ if(!drag) return;
    tx=e.clientX-drag.x; ty=e.clientY-drag.y; apply(); });
  const up=()=>{ if(!drag) return; drag=null; box.classList.remove('grabbing'); apply(); };
  box.addEventListener('pointerup',up); box.addEventListener('pointercancel',up);
  box.addEventListener('dblclick',e=>{ if(chrome(e)) return;
    if(z>1.001) reset(); else zoomAt(local(e), one()); });
  return {reset, get z(){return z;}, step:d=>zoomAt({x:box.clientWidth/2,y:box.clientHeight/2}, z*d)};
}
const ovZ=zoomable($('ovimg'),$('ovbox'),$('ovz'));
const fsZ=zoomable($('fsimg'),$('fs'),$('fsz'));

async function boot(){
  try{
    const r=await fetch('bg_meta.json',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    META=await r.json();
  }catch(e){ $('sub').textContent='bg_meta.json 读不到：'+e.message+'（先跑 py -3 scripts/build_bg_meta.py）'; return; }
  ALL=META.items; initFilters(); apply();
  const th=$('gTheme');
  th.querySelector('[data-t="'+(document.documentElement.dataset.theme||'light')+'"]')
    &&th.querySelector('[data-t="'+(document.documentElement.dataset.theme||'light')+'"]').classList.add('on');
}
$('q').addEventListener('input',e=>{q=e.target.value;apply()});
$('gTheme').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  document.documentElement.dataset.theme=b.dataset.t;
  try{localStorage.setItem('gallery.theme',b.dataset.t)}catch(_){}
  $('gTheme').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));});
$('ov').addEventListener('click',e=>{if(e.target===$('ov'))close()});
$('ovclose').addEventListener('click',close);
$('ovfs').addEventListener('click',fsOpen);
$('fsclose').addEventListener('click',fsClose);
$('fsdl').addEventListener('click',fsDownload);
$('fsprev').addEventListener('click',()=>{if(cur>0){cur--;paint()}});
$('fsnext').addEventListener('click',()=>{if(cur<view.length-1){cur++;paint()}});
/* 用系统方式退出全屏（Esc 被浏览器吃掉 / F11）时，遮罩层不能留在屏幕上 */
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)$('fs').classList.remove('on')});
addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('fs').classList.contains('on')){fsClose();return}
  if(e.key==='Escape'&&cur>=0){close();return}
  if(e.key==='/'&&cur<0){e.preventDefault();$('q').focus();return}
  /* 缩放键盘档：当前打开的是哪一层就作用在哪一层（全屏壁纸优先于详情弹窗） */
  if(cur>=0 && (e.key==='+'||e.key==='='||e.key==='-'||e.key==='0'||e.key==='_')){
    const z=$('fs').classList.contains('on')?fsZ:ovZ;
    if(e.key==='0') z.reset(); else z.step(e.key==='+'||e.key==='='?1.25:0.8);
    e.preventDefault(); return;
  }
  if(cur>=0&&e.key==='ArrowLeft'){cur--;paint()}
  if(cur>=0&&e.key==='ArrowRight'&&cur<view.length-1){cur++;paint()}
});
if(!REDUCE){/* 动效本身已由 token 收在 0.2~0.34s，这里只是给"减少动效"偏好留一个钩子 */}
boot();

/* 液态玻璃：本页只挂页头那条 14px 边墙（它身后是滚动的缩略图网格 = 低频背景，折射读得干净）。
   卡片**不挂**：数量大、hover 有位移，而 backdrop-filter 的成本单位就是盒子个数（§134），
   且 §136 那条失效模式正是"被旋转的盒子里挂遮罩"。 */
if(window.LiquidGlass&&LiquidGlass.on)
  LiquidGlass.auto(document.querySelector('header'),{cls:'hglg',band:true,kind:'nav'});
</script>
</body>
</html>
